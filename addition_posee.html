:root{
  --paper:#FAF6EA; --line:rgba(46,111,149,.16); --ink:#243B2C;
  --red:#D6483D; --blue:#2E6F95; --yellow:#F2B33D; --green:#4C9A5B;
  --purple:#7C5CA6; --orange:#E8843C; --border:#B9C4CC;
  --cu:#D6483D; --cd:#2a5ea8; --cc:#3f8f12;
  --cs:clamp(46px,5.6vw,66px);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--line) 0px,var(--line) 1px,transparent 1px,transparent 28px);
  font-family:'Nunito','Segoe UI',Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
.hand{font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive}
#app{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
h1{margin:4px 0 0;font-size:3rem;font-weight:400;line-height:1;text-align:center}
.sub{margin:.3rem 0 1rem;font-weight:700;color:var(--blue);text-align:center;font-size:1.15rem}

/* menu */
.settings{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 18px}
.set{background:#fff;border:2px solid #E4DCC4;border-radius:14px;padding:10px 14px;font-size:1.1rem}
.set b{display:block;margin-bottom:6px;color:var(--blue)}
.tog{font-size:1.1rem;padding:8px 14px;margin:2px;border-radius:12px;border:2px solid #9aa5ad;background:#f3f1ea;color:var(--ink);font-weight:700}
.tog.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.mode{background:#fff;border:3px solid var(--ink);border-left:12px solid var(--c,var(--blue));border-radius:18px;padding:16px;text-align:left;font-size:1.05rem;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.mode b{display:block;font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;font-size:1.8rem;font-weight:400;margin-bottom:4px}
.mode span{color:#555}
.mode small{display:block;margin-top:6px;color:var(--green);font-weight:800}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.memo{background:#fff8e1;border:3px dashed var(--yellow);border-radius:16px;padding:12px 16px;margin:0 0 18px;font-size:1.25rem;text-align:center}
.memo b{color:var(--red)}
.own{margin:18px auto 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border:2px solid #E4DCC4;border-radius:14px;padding:10px 14px;max-width:560px;font-weight:800}
.own input{width:90px;font-size:1.4rem;padding:4px;border:2px solid #9aa5ad;border-radius:10px;text-align:center;font-family:'Patrick Hand',cursive}

/* barre du haut */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:8px}
.top .ttl{text-align:center;font-size:2rem}
.back{font-size:1.05rem;padding:8px 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:700;color:var(--ink)}
.score{font-size:1.4rem;font-weight:800;white-space:nowrap}
.progress{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.dot{width:1.9rem;height:1.9rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;background:#fff;color:#B7AF92;border:2px solid #E4DCC4}
.dot.cur{border-color:var(--blue);color:var(--blue)}
.dot.ok{background:var(--green);color:#fff;border-color:var(--green)}
.dot.ko{background:var(--orange);color:#fff;border-color:var(--orange)}

/* zone de jeu */
.jeu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:880px){.jeu{grid-template-columns:1fr}}
.feuille,.matp{background:#fff;border:2px solid #E4DCC4;border-radius:20px;padding:12px}
.feuille{display:flex;flex-direction:column;align-items:center;overflow-x:auto}
.enligne{font-size:2.3rem;margin:0 0 8px;white-space:nowrap}
.enligne .r{color:var(--red)}

/* papier Seyès : un chiffre par carreau */
.grille{display:grid;
  background-color:#fff;
  background-image:
    linear-gradient(90deg,rgba(124,92,166,.45) 1px,transparent 1px),
    linear-gradient(rgba(46,111,149,.42) 1px,transparent 1px),
    linear-gradient(rgba(46,111,149,.14) 1px,transparent 1px);
  background-size:var(--cs) var(--cs),var(--cs) var(--cs),var(--cs) calc(var(--cs)/4);
  border-right:1px solid rgba(124,92,166,.45);border-bottom:1px solid rgba(46,111,149,.42)}
.cell{width:var(--cs);height:var(--cs);position:relative;display:flex;align-items:flex-end;justify-content:center;
  font-family:'Patrick Hand','Segoe Print',cursive;font-size:calc(var(--cs)*.86);line-height:1;padding-bottom:2px}
.cell.hd{font-family:'Nunito',sans-serif;font-weight:800;font-size:calc(var(--cs)*.42);align-items:center}
.cell.ret{font-size:calc(var(--cs)*.5);color:var(--red);align-items:flex-end}
.cell.tap{cursor:pointer}
.cell.tap:hover{background:rgba(46,111,149,.08)}
.cell.tgt{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--yellow)}
.cell.colhl{background:rgba(242,179,61,.16)}
.cell.trait::after{content:"";position:absolute;left:-1px;right:-1px;bottom:calc(var(--cs)/-4 + 1px);height:5px;background:var(--ink);border-radius:2px}
.cell.res{color:var(--red)}
.cell.bad{background:#FBEAE8;animation:sh .35s}
.cell.new{animation:pp .45s}
.cell.trou{height:calc(var(--cs)/2)}

/* matériel */
.mh{font-weight:800;color:#6b6650;text-align:center;margin-bottom:6px}
.mat{display:grid;gap:8px}
.mc{border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fbfaf6;min-height:240px}
.mc.act{background:#fff7d6;box-shadow:inset 0 0 0 3px var(--yellow)}
.mc h3{margin:0 0 2px;font-size:1.05rem}
.mg{display:flex;flex-direction:column;align-items:center;gap:2px}
.mg .ic{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:flex-end;max-width:100%}
.mg .lb{font-size:.82rem;font-weight:800;color:#6b6650;text-align:center}
.mg.retz{border:2px dashed var(--red);border-radius:10px;padding:3px 6px}
.mg.retz .lb{color:var(--red)}
.mg.plein{border:2px solid var(--yellow);border-radius:10px;padding:3px 6px;background:#fffbea}
.pl{font-size:1.5rem;font-weight:800;color:var(--orange);line-height:1}
.fl{font-size:.9rem;font-weight:800;color:var(--purple);text-align:center}
.jetons{display:grid;grid-template-columns:repeat(5,24px);gap:3px;justify-content:center}
.zero{font-size:1.3rem;color:#bbb;font-weight:800}
img.new{animation:pp .6s;filter:drop-shadow(0 0 4px #F2B33D) drop-shadow(0 0 2px #F2B33D)}
.ouverte{position:relative;display:inline-block}
.ouverte>img.fond{position:absolute;left:0;top:0;width:100%;height:100%}
.ouverte .fen{position:absolute;left:17.6%;top:7.1%;width:66.4%;height:74.3%;background:#fff}
.ouverte .jt,.ouverte .vide{position:absolute;width:12.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;height:auto}
.ouverte .vide{border:2px solid #e3e3e3}
.ouverte .jt.new{filter:drop-shadow(0 0 4px #F2B33D) drop-shadow(0 0 2px #F2B33D)}
.cachemat{text-align:center;padding:40px 10px;font-size:1.3rem;font-weight:800;color:#6b6650}

/* bas */
.msg{text-align:center;font-size:1.45rem;font-weight:700;min-height:2.2rem;margin:12px auto 4px;max-width:1000px;line-height:1.4}
.msg b{color:var(--blue)}
.msg .r{color:var(--red);font-weight:800}
.note{font-size:1.3rem;margin-top:4px}
.note b{color:inherit}
.good{color:var(--green)}.bad{color:var(--red)}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.btn{font-size:1.25rem;padding:10px 20px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--blue);color:#fff}
.btn.help{background:#fff8e1}
.btn.act{background:var(--orange);color:#fff}
.ask{text-align:center;font-size:2.2rem;margin-top:6px}
.ask .box{display:inline-block;min-width:70px;border-bottom:4px solid var(--ink);color:var(--blue);margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:640px;margin:10px auto 0}
.pad button{font-size:2.2rem;padding:6px 0;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .ok{background:var(--green);color:#fff}.pad .del{background:var(--yellow)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

function img(nom, haut, cls){
  var o = IMG[nom], w = Math.round(o.w * haut / o.h);
  return '<img class="' + (cls||"") + '" src="' + o.src + '" width="' + w + '" height="' + haut + '" alt="" draggable="false">';
}
function boiteOuverte(u, neuf, L){
  L = L || 104; var H = Math.round(L * IMG.open10.h / IMG.open10.w);
  var h = '<div class="ouverte" style="width:' + L + 'px;height:' + H + 'px">' + img("open10", H, "fond") + '<div class="fen"></div>';
  for (var i=0;i<10;i++){
    var pos = 'left:' + PLACES[i][0] + '%;top:' + PLACES[i][1] + '%';
    if (i < u) h += '<img class="jt' + (neuf ? " new" : "") + '" style="' + pos + '" src="' + IMG.dot.src + '" alt="jeton" draggable="false">';
    else h += '<span class="vide" style="' + pos + '"></span>';
  }
  return h + '</div>';
}
/* k objets du rang i (0 = jetons dans une boîte retournée, 1 = boîtes de 10, 2 = boîtes de 100) */
function objets(i, k, neuf){
  if (i === 0){   // des jetons seuls, hors des boîtes, rangés par 5
    if (!k) return '<span class="zero">0</span>';
    var h = '<div class="jetons">';
    for (var q=0;q<k;q++) h += img("dot", 24, neuf ? "new" : "");
    return h + '</div>';
  }
  var s = ""; for (var j=0;j<k;j++) s += img(i === 1 ? "box10" : "box100", i === 1 ? 26 : 30, neuf ? "new" : "");
  return s || '<span class="zero">0</span>';
}

var app = document.getElementById("app");
function $(id){ return document.getElementById(id); }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function dig(n){ return String(n).split("").reverse().map(Number); }
function plur(k,s,p){ return k + " " + (k > 1 ? p : s); }
function nbRet(a,b){
  var A = dig(a), B = dig(b), c = 0, k = 0;
  for (var i=0;i<Math.max(A.length,B.length);i++){ var s = (A[i]||0)+(B[i]||0)+c; c = s >= 10 ? 1 : 0; k += c; }
  return k;
}
var dernier = "";
function gen(){
  var want = R.niv === "CE1" ? (R.type === "a" ? 0 : 1) : (R.type === "a" ? 1 : 2);
  for (var t=0;t<5000;t++){
    var a, b;
    if (R.niv === "CE1"){ a = rnd(12,88); b = Math.random() < .25 ? rnd(2,9) : rnd(11,88); if (a+b >= 100) continue; }
    else { a = rnd(102,888); b = Math.random() < .2 ? rnd(12,98) : rnd(101,888); if (a+b >= 1000) continue; }
    if (nbRet(a,b) !== want) continue;
    if (a % 10 === 0 || b % 10 === 0) continue;
    var k = a + "+" + b; if (k === dernier) continue;
    dernier = k; return [a,b];
  }
  return R.niv === "CE1" ? [48,35] : [367,258];
}

      var rec = m.id === "regarde" ? 0 : getRec(m.id);
      return '<button class="mode" style="--c:' + m.c + '" data-mode="' + m.id + '"><b>' + m.titre + '</b><span>' + m.txt + '</span>' +
        (rec ? '<small>Record ' + R.niv + ' : ' + rec + ' / ' + NB + ' ' + etoiles(rec) + '</small>' : '') + '</button>';
    }).join("") + '</div>' +
    '<div class="own">🧮 Mon calcul : <input id="oa" inputmode="numeric" placeholder="48"> + <input id="ob" inputmode="numeric" placeholder="35">' +
    '<button class="btn main" id="og">Montrer ▶</button></div><div class="msg bad" id="oerr"></div>';
  app.innerHTML = h;
  app.querySelectorAll(".tog").forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.k, v = b.dataset.v;
      if (k === "poser") R.poser = v === "1"; else R[k] = v;
      save(); menu();
    };
  });
  app.querySelectorAll(".mode").forEach(function(b){
    b.onclick = function(){ Q = { mode: b.dataset.mode, ok: 0, res: [] }; var p = gen(); nouvelle(p[0], p[1]); };
  });
  $("og").onclick = function(){
    var a = parseInt($("oa").value,10), b = parseInt($("ob").value,10);
    if (!(a > 0 && b > 0 && a + b < 1000)) { $("oerr").textContent = "Écris deux nombres. Leur somme doit être plus petite que 1 000."; return; }
    if (b > a) { var t = a; a = b; b = t; }
    Q = { mode: "regarde", ok: 0, res: [], own: true }; nouvelle(a, b);
  };
}
function set(t, inner){ return '<div class="set"><b>' + t + '</b>' + inner + '</div>'; }
function tog(k,v,label,on){ return '<button class="tog' + (on ? " on" : "") + '" data-k="' + k + '" data-v="' + v + '">' + label + '</button>'; }
function etoiles(sc){ return sc >= NB ? "⭐⭐⭐" : sc >= NB*0.75 ? "⭐⭐" : sc >= NB*0.5 ? "⭐" : ""; }

/* ================= UNE ADDITION ================= */
function nouvelle(a, b){
  var A = dig(a), B = dig(b), n = Math.max(dig(a+b).length, A.length);
  S = { a: a, b: b, A: A, B: B, n: n, stage: "place", pi: 0, places: {}, plus: false, trait: false,
        col: [], i: 0, cs: 0, err: 0, ep: 0, aide: false, g: Q.mode !== "seul", voir: Q.mode !== "seul",
        saisie: "", pad: null, tools: [], msg: "", note: "", tgt: null, bad: null, fresh: {}, compte: false };
  for (var i=0;i<n;i++) S.col.push({ cin: 0, tot: null, ph: "show", res: null });
  S.liste = [];
  for (i=A.length-1;i>=0;i--) S.liste.push({ t: "chiffre", row: "A", i: i });
  for (i=B.length-1;i>=0;i--) S.liste.push({ t: "chiffre", row: "B", i: i });
  S.liste.push({ t: "plus" }); S.liste.push({ t: "trait" });
  if (!R.poser){
    S.liste.forEach(function(it){ if (it.t === "chiffre") S.places[it.row + it.i] = true; });
    S.plus = S.trait = true; S.pi = S.liste.length;
  }
  startKeys(clavier);
  etape();
}
function demo(){ return Q.mode === "regarde"; }
function suivant(fn){ S.tools = [["Suivant ▶","main",fn]]; }
function demander(label, bon, ok, ko){ S.pad = { label: label, bon: bon, ok: ok, ko: ko }; S.saisie = ""; }

function etape(){
  S.pad = null; S.saisie = ""; S.tools = []; S.note = "";
  if (S.bravo){ S.note = '<span class="good">✔ Oui !</span>'; S.bravo = false; }
  if (S.stage === "place") etapePlace();
  else if (S.stage === "calc") etapeCalc();
  else fin();
  draw();
}

/* ---------- poser l'opération ---------- */
function etapePlace(){
  var cur = S.liste[S.pi];
  if (!cur){ S.stage = "calc"; S.i = 0; S.cs = 0; return etapeCalc(); }
  S.tgt = null;
  if (cur.t === "chiffre"){
    var D = cur.row === "A" ? S.A : S.B, nb = cur.row === "A" ? S.a : S.b, d = D[cur.i], premier = cur.i === D.length - 1;
    if (demo()){
      S.msg = (premier ? "J'écris " + (cur.row === "A" ? "le premier nombre" : "le deuxième nombre") + " : <b>" + nb + "</b>. " : "") +
              "Le <span class='r'>" + d + "</span> est le chiffre des <b style='color:" + COUL[cur.i] + "'>" + NOM[cur.i] + "</b> : je l'écris dans la colonne " + COL[cur.i] + ", un chiffre par carreau." +
              (cur.row === "B" && premier ? "<br>Les unités sous les unités !" : "");
      S.tgt = cur.row + cur.i;
      suivant(function(){ S.places[cur.row + cur.i] = true; S.fresh[cur.row + cur.i] = 1; S.pi++; etape(); });
    } else {
      var rang = D.length - cur.i;
      S.msg = "Touche le carreau où tu écris le " + (rang === 1 ? "1er" : rang + "e") + " chiffre de <b>" + nb + "</b> : <span class='r'>" + d + "</span>." +
              (cur.row === "B" && D.length < S.A.length && premier ? "<br>Attention : les unités sous les unités !" : "");
    }
  } else if (cur.t === "plus"){
    if (demo()){ S.msg = "J'écris le signe <b>+</b> dans le carreau à gauche du deuxième nombre."; S.tgt = "plus";
      suivant(function(){ S.plus = true; S.fresh.plus = 1; S.pi++; etape(); }); }
    else S.msg = "Où j'écris le signe <b>+</b> ? Touche le carreau.";
  } else {
    S.msg = "Je trace le <b>trait</b> sous le deuxième nombre : c'est le <b>« = »</b> de l'addition posée. Le résultat s'écrira dessous.";
    S.tools = [["📏 Je trace le trait","act",function(){ S.trait = true; S.pi++; etape(); }]];
  }
}
function tape(r, iStr){
  var cur = S.liste[S.pi];
  if (!cur || S.stage !== "place" || demo() || cur.t === "trait") return;
  var ok = cur.t === "plus" ? (r === "B" && iStr === "s") : (r === cur.row && iStr === String(cur.i));
  if (ok){
    if (cur.t === "plus"){ S.plus = true; S.fresh.plus = 1; } else { S.places[cur.row + cur.i] = true; S.fresh[cur.row + cur.i] = 1; }
    S.ep = 0; S.pi++; etape(); return;
  }
  S.err++; S.ep++; S.bad = r + iStr;
  if (cur.t === "plus") S.note = '<span class="bad">Le signe + s\'écrit à gauche du <b>deuxième</b> nombre.</span>';
  else {
    var D = cur.row === "A" ? S.A : S.B, d = D[cur.i];
    if (iStr === "s") S.note = '<span class="bad">Ce carreau est pour le signe + . Le ' + d + ' est un chiffre du nombre.</span>';
    else if (r !== cur.row) S.note = '<span class="bad">Le ' + d + ' appartient au <b>' + (cur.row === "A" ? "premier" : "deuxième") + '</b> nombre : il s\'écrit sur la ' + (cur.row === "A" ? "1re" : "2e") + ' ligne.</span>';
    else S.note = '<span class="bad">Le ' + d + ' est le chiffre des <b>' + NOM[cur.i] + '</b> : colonne ' + COL[cur.i] + '. Les unités sous les unités !</span>';
  }
  if (S.ep >= (S.g ? 1 : 2)) S.tgt = cur.t === "plus" ? "plus" : cur.row + cur.i;
  draw(); S.bad = null;
}

/* ---------- calculer colonne par colonne ---------- */
function termes(i){
  var c = S.col[i], t = [];
  if (c.cin) t.push('<span class="r">1</span>');
  if (S.A[i] !== undefined) t.push(S.A[i]);
  if (S.B[i] !== undefined) t.push(S.B[i]);
  return t;
}
function etapeCalc(){
  var i = S.i;
  if (i >= S.n){ S.stage = "done"; return fin(); }
  var c = S.col[i], t = termes(i), expr = t.join(" + "), tot = (S.A[i]||0) + (S.B[i]||0) + c.cin;
  c.tot = tot;
  if (!S.g) return etapeSeul(i, c, expr, tot);
  var ret = c.cin ? " (avec la retenue)" : "";
  switch (S.cs){
  case 0:
    if (t.length === 1){ S.cs = 1; return etapeCalc(); }
    S.msg = (i === 0 ? "On commence <b>toujours par les unités</b>. " : "On continue avec les <b>" + NOM[i] + "</b>. ") +
            "Je calcule <b>" + expr + "</b>" + ret + ".";
    if (demo()){
      S.msg += "<br>" + expr + " = <span class='r'>" + tot + "</span> : " + plur(tot, UN[i], NOM[i]) + ".";
      suivant(function(){ S.cs = 1; etape(); });
    } else {
      S.msg += "<br>Combien de " + OBJS[i] + " en tout ?";
      demander(expr + " = ", tot, function(){ S.bravo = true; S.cs = 1; etape(); }, function(){
        S.note = '<span class="bad">Recompte les ' + OBJS[i] + ' de la colonne des ' + NOM[i] + (c.cin ? ', sans oublier la retenue' : '') + '.</span>';
      });
    }
    break;
  case 1:
    if (tot < 10){
      S.msg = (t.length > 1 ? expr + " = <span class='r'>" + tot + "</span> : " + plur(tot, UN[i], NOM[i]) + "."
                            : "Dans la colonne des <b>" + NOM[i] + "</b>, il n'y a que " + (c.cin ? "la retenue" : "le " + tot) + " : rien à ajouter.") +
              (i < S.n - 1 ? " Ce n'est pas assez pour remplir une " + (i === 0 ? "boîte de 10" : "boîte de 100") + " : <b>pas de retenue</b>." : "") +
              "<br>J'écris <span class='r'>" + tot + "</span> sous le trait, dans la colonne des " + NOM[i] + ".";
      if (demo()) suivant(function(){ ecrire(i, tot); });
      else { S.msg = S.msg.replace(/<br>J'écris.*$/, "<br>Quel chiffre j'écris sous le trait ?"); demander("J'écris ", tot, function(){ S.bravo = true; ecrire(i, tot); }); }
    } else {
      S.msg = expr + " = <span class='r'>" + tot + "</span> : " + tot + " " + NOM[i] + " ! C'est plus que 10.<br>" +
              (i === 0 ? "Avec <b>10 jetons</b>, je remplis une <b>boîte de 10</b>." : "Avec <b>10 boîtes de 10</b>, je remplis une <b>boîte de 100</b>.");
      S.tools = [[(i === 0 ? "🫙 Je remplis la boîte de 10" : "📦 Je range 10 boîtes de 10"), "act", function(){ c.ph = "fill"; S.cs = 2; etape(); }]];
    }
    break;
  case 2:
    S.msg = i === 0
      ? "La boîte est pleine : 10 jetons. Je la <b>retourne</b> : c'est <b>1 boîte de 10</b>.<br>Je la place dans la colonne des <b>dizaines</b> : c'est la <span class='r'>retenue</span>."
      : "La boîte de 100 est pleine : 10 boîtes de 10. Je la <b>ferme</b> : c'est <b>1 boîte de 100</b>.<br>Je la place dans la colonne des <b>centaines</b> : c'est la <span class='r'>retenue</span>.";
    S.tools = [[(i === 0 ? "🔄 Je retourne la boîte" : "📦 Je ferme la boîte"), "act", function(){
      c.ph = "flip"; S.col[i+1].cin = 1; S.fresh["r" + (i+1)] = 1; S.fresh["c" + (i+1)] = 1; S.cs = 3; etape(); }]];
    break;
  case 3:
    var r = tot - 10;
    S.msg = "J'écris la retenue <span class='r'>1</span> en haut de la colonne des " + NOM[i+1] + ".<br>";
    if (demo()){
      S.msg += "Il reste <b>" + plur(r, OBJ[i], OBJS[i]) + "</b> : j'écris <span class='r'>" + r + "</span> sous le trait, dans la colonne des " + NOM[i] + ".";
      suivant(function(){ ecrire(i, r); });
    } else {
      S.msg += "Combien reste-t-il de " + OBJS[i] + " ? Je l'écris sous le trait.";
      demander("Il reste ", r, function(){ S.bravo = true; ecrire(i, r); }, function(){
        S.note = '<span class="bad">' + tot + ' − 10 : regarde ce qui reste à côté de la boîte pleine.</span>';
      });
    }
    break;
  }
}
function ecrire(i, v){
  S.col[i].res = v; S.col[i].ph = "done"; S.fresh["s" + i] = 1; S.i++; S.cs = 0; S.ep = 0; etape();
}
/* sans le matériel */
function etapeSeul(i, c, expr, tot){
  var dernierCol = i === S.n - 1;
  if (S.sq === "ret"){
    S.msg = "Colonne des <b>" + NOM[i] + "</b> : " + expr + " = " + tot + ". Y a-t-il une <span class='r'>retenue</span> pour la colonne des " + NOM[i+1] + " ?";
    S.tools = [["Oui, 1 retenue","",function(){ repRet(true); }],["Non, pas de retenue","",function(){ repRet(false); }]];
    return;
  }
  S.msg = (i === 0 ? "On commence par les unités. " : "") + "Colonne des <b>" + NOM[i] + "</b> : <b>" + expr + "</b>.<br>Quel chiffre j'écris sous le trait ?";
  demander("J'écris ", tot % 10, function(){
    S.col[i].res = tot % 10; S.col[i].ph = "done"; S.fresh["s" + i] = 1; S.ep = 0;
    if (!dernierCol){ S.sq = "ret"; S.bravo = true; }
    else { S.i++; S.bravo = true; }
    etape();
  }, function(v){
    S.ep++;
    if (v === tot && tot >= 10) S.note = '<span class="bad">On écrit <b>un seul chiffre</b> par carreau ! ' + tot + ' ' + NOM[i] + ', c\'est 1 ' + UN[i+1] + ' et ' + plur(tot-10, UN[i], NOM[i]) + '.</span>';
    else S.note = '<span class="bad">Pas tout à fait.' + (c.cin ? ' As-tu pensé à la retenue ?' : ' Recalcule ' + expr + '.') + '</span>';
    if (S.ep >= 2){ aideMateriel(); S.note = '<span class="bad">Regardons avec le matériel.</span>'; draw(); }
  });
}
function repRet(oui){
  var i = S.i, c = S.col[i], vrai = c.tot >= 10;
  S.sq = null;
  if (oui === vrai){
    if (vrai){ S.col[i+1].cin = 1; S.fresh["r" + (i+1)] = 1; S.fresh["c" + (i+1)] = 1; }
    S.i++; S.cs = 0; S.bravo = true; etape(); return;
  }
  S.err++;
  if (vrai){
    S.col[i+1].cin = 1; S.fresh["r" + (i+1)] = 1; S.fresh["c" + (i+1)] = 1;
    S.msg = "<span class='bad'>Si !</span> " + c.tot + " " + NOM[i] + " : avec 10, je remplis une " + (i === 0 ? "boîte de 10" : "boîte de 100") + ". Je la place dans la colonne des " + NOM[i+1] + " : j'écris la retenue <span class='r'>1</span>.";
  } else {
    S.msg = "<span class='bad'>Non :</span> " + plur(c.tot, UN[i], NOM[i]) + ", ce n'est pas assez pour remplir une " + (i === 0 ? "boîte de 10" : "boîte de 100") + ". Pas de retenue.";
  }
  S.pad = null; S.note = "";
  S.tools = [["Suivant ▶","main",function(){ S.i++; S.cs = 0; etape(); }]];
  draw();
}
function aideMateriel(){
  S.voir = true; S.aide = true;
  if (S.stage === "calc" && S.col[S.i].res === null && S.sq !== "ret"){ S.g = true; S.cs = 0; S.ep = 0; etape(); }
  else draw();
}

/* ---------- fin d'une addition ---------- */
function fin(){
  var ok = S.err === 0 && !S.aide, som = S.a + S.b;
  S.msg = "<span class='hand' style='font-size:2.2rem'>" + S.a + " + " + S.b + " = <span class='r'>" + som + "</span></span>";
  if (!demo()){
    if (!S.compte){ S.compte = true; Q.res.push(ok); if (ok) Q.ok++; }
    S.msg += "<br>" + (ok ? "Bravo, sans erreur ! ⭐" : "Terminé" + (S.err ? " avec " + plur(S.err, "erreur", "erreurs") : "") + (S.aide ? " (avec l'aide du matériel)" : "") + ".");
    if (Q.res.length >= NB) S.tools = [["Voir mon score ▶","main",resultat]];
    else S.tools = [["Addition suivante ▶","main",function(){ var p = gen(); nouvelle(p[0], p[1]); }]];
  } else {
    S.tools = [["Nouvelle addition ▶","main",function(){ var p = gen(); nouvelle(p[0], p[1]); }],["◀ Menu","",menu]];
  }
}
function resultat(){
  stopKeys();
  var rec = getRec(Q.mode), nouveau = Q.ok > rec;
  if (nouveau) setRec(Q.mode, Q.ok);
  app.innerHTML = '<div class="end"><div class="hand" style="font-size:2.4rem">' + (Q.ok === NB ? "Champion de l'addition posée !" : "Série terminée") + '</div>' +
    '<div class="big hand">' + Q.ok + ' / ' + NB + '</div><div class="stars">' + etoiles(Q.ok) + '</div>' +
    '<p>additions réussies sans erreur et sans aide' + (nouveau ? '<br><b style="color:var(--green)">Nouveau record !</b>' : '') + '</p>' +
    '<div class="tools"><button class="btn main" id="re">Encore une série ▶</button><button class="btn" id="mn">◀ Menu</button></div></div>';
  $("re").onclick = function(){ Q = { mode: Q.mode, ok: 0, res: [] }; var p = gen(); nouvelle(p[0], p[1]); };
  $("mn").onclick = menu;
}

/* ================= DESSIN ================= */
function draw(){
  var titre = Q.own ? "Mon calcul" : MODES.filter(function(m){ return m.id === Q.mode; })[0].titre;
  var h = '<div class="top"><button class="back" id="back">◀ Menu</button><div class="ttl hand">' + titre + '</div><div class="score">' + (demo() ? "" : "⭐ " + Q.ok) + '</div></div>';
  if (!demo()){
    h += '<div class="progress">';
    for (var k=0;k<NB;k++){
      var cl = k < Q.res.length ? (Q.res[k] ? "ok" : "ko") : (k === Q.res.length ? "cur" : "");
      h += '<div class="dot ' + cl + '">' + (k+1) + '</div>';
    }
    h += '</div>';
  }
  var fini = S.stage === "done";
  h += '<div class="jeu"><div class="feuille"><div class="enligne hand">' + S.a + ' + ' + S.b + ' = ' + (fini ? '<span class="r">' + (S.a+S.b) + '</span>' : '?') + '</div>' + grille() + '</div>' +
       '<div class="matp">' + materiel() + '</div></div>';
  h += '<div class="msg">' + S.msg + (S.note ? '<div class="note">' + S.note + '</div>' : '') + '</div>';
  var tools = S.tools.slice();
  if (!S.voir && !fini) tools.push(["💡 Aide : le matériel","help",aideMateriel]);
  h += '<div class="tools">' + tools.map(function(t,j){ return '<button class="btn ' + t[1] + '" data-t="' + j + '">' + t[0] + '</button>'; }).join("") + '</div>';
  if (S.pad){
    h += '<div class="ask hand" id="ask">' + S.pad.label + '<span class="box">' + (S.saisie || "?") + '</span></div><div class="pad">' +
      [1,2,3,4,5,6,7,8,9,0].map(function(d){ return '<button data-d="' + d + '">' + d + '</button>'; }).join("") +
      '<button class="del" data-d="del">⌫</button><button class="ok" data-d="ok">OK</button></div>';
  }
  app.innerHTML = h;
  $("back").onclick = menu;
  app.querySelectorAll("[data-t]").forEach(function(b){ b.onclick = function(){ tools[+b.dataset.t][2](); }; });
  app.querySelectorAll(".pad button").forEach(function(b){ b.onclick = function(){ touche(b.dataset.d); }; });
  app.querySelectorAll(".cell[data-r]").forEach(function(c){ c.onclick = function(){ tape(c.dataset.r, c.dataset.i); }; });
  if (S.shake){ var a = $("ask"); if (a) a.classList.add("shake"); S.shake = false; }
  S.fresh = {};
}
function grille(){
  var n = S.n, cur = S.stage === "place" ? S.liste[S.pi] : null, tap = cur && cur.t !== "trait" && !demo();
  var h = '<div class="grille" style="grid-template-columns:repeat(' + (n+3) + ',var(--cs))">';
  function cell(cls, v, at){ return '<div class="cell ' + cls + '"' + (at || "") + '>' + v + '</div>'; }
  function hl(i){ return S.stage === "calc" && S.i === i ? " colhl" : ""; }
  function ligne(f){ h += cell("",""); h += f(-1); for (var i=n-1;i>=0;i--) h += f(i); h += cell("",""); }
  ligne(function(i){ return i < 0 ? cell("hd","") : cell("hd" + hl(i), COL[i], ' style="color:' + COUL[i] + '"'); });
  ligne(function(i){ return i < 0 ? cell("ret","") : cell("ret" + hl(i) + (S.fresh["r"+i] ? " new" : ""), S.col[i].cin ? "1" : ""); });
  ["A","B"].forEach(function(r){
    var D = r === "A" ? S.A : S.B, tr = r === "B" && S.trait ? " trait" : "";
    ligne(function(i){
      var t = tap ? " tap" : "";
      if (i < 0){
        var tg = S.tgt === "plus" && r === "B" ? " tgt" : "", bd = S.bad === r + "s" ? " bad" : "";
        return cell("sg" + t + tr + tg + bd + (r === "B" && S.fresh.plus ? " new" : ""), r === "B" && S.plus ? "+" : "", ' data-r="' + r + '" data-i="s"');
      }
      var cls = t + tr + (S.tgt === r + i ? " tgt" : "") + (S.bad === r + i ? " bad" : "") + hl(i) + (S.fresh[r+i] ? " new" : "");
      return cell(cls, S.places[r + i] && D[i] !== undefined ? D[i] : "", ' data-r="' + r + '" data-i="' + i + '"');
    });
  });
  ligne(function(i){ return i < 0 ? cell("","") : cell("res" + hl(i) + (S.fresh["s"+i] ? " new" : ""), S.col[i].res === null ? "" : S.col[i].res); });
  ligne(function(){ return cell("",""); });
  return h + '</div>';
}
function materiel(){
  if (!S.voir) return '<div class="cachemat">🙈 Le matériel est caché.<br>Je calcule dans ma tête.</div>';
  var h = '<div class="mh">Le matériel de la classe</div><div class="mat" style="grid-template-columns:repeat(' + S.n + ',minmax(0,1fr))">';
  for (var i=S.n-1;i>=0;i--) h += matCol(i);
  return h + '</div>';
}
function matCol(i){
  var c = S.col[i], a = S.A[i], b = S.B[i], act = S.stage === "calc" && S.i === i, h = "";
  function grp(contenu, lab, cls){ return '<div class="mg ' + (cls||"") + '"><div class="ic">' + contenu + '</div><div class="lb">' + lab + '</div></div>'; }
  if (c.ph === "show"){
    var parts = [];
    if (a !== undefined) parts.push(grp(objets(i, a), plur(a, OBJ[i], OBJS[i])));
    if (b !== undefined) parts.push(grp(objets(i, b), plur(b, OBJ[i], OBJS[i])));
    if (c.cin) parts.push(grp(objets(i, 1, S.fresh["c"+i]), i === 1 ? "la retenue : 1 boîte de 10" : "la retenue : 1 boîte de 100", "retz"));
    h = parts.join('<div class="pl">+</div>');
  } else if (c.ph === "fill"){
    var r = c.tot - 10;
    h = grp(i === 0 ? boiteOuverte(10, true) : img("open100", 62, "new"), i === 0 ? "10 jetons : la boîte est pleine !" : "10 boîtes de 10 : la boîte de 100 est pleine !", "plein") +
        '<div class="pl">+</div>' + grp(objets(i, r), "il reste " + plur(r, OBJ[i], OBJS[i]));
  } else {
    var r2 = c.tot >= 10 ? c.tot - 10 : c.tot;
    h = grp(objets(i, r2), plur(r2, OBJ[i], OBJS[i]) + (c.ph === "done" ? " → j'écris " + r2 : ""));
    if (c.ph === "flip" && i < S.n - 1) h += '<div class="fl">' + (i === 0 ? "🔄 Je retourne la boîte pleine : elle part chez les dizaines ⬅" : "📦 La boîte de 100 part chez les centaines ⬅") + '</div>';
  }
  return '<div class="mc' + (act ? " act" : "") + '"><h3 style="color:' + COUL[i] + '">' + NOM[i] + '</h3>' + h + '</div>';
}

/* ================= SAISIE ================= */
function touche(d){
  if (!S || !S.pad) return;
  if (d === "del"){ S.saisie = S.saisie.slice(0,-1); }
  else if (d === "ok"){ return valider(); }
  else if (S.saisie.length < 2){ S.saisie += d; }
  var box = document.querySelector(".ask .box"); if (box) box.textContent = S.saisie || "?";
}
function valider(){
  if (S.saisie === "") return;
  var v = +S.saisie, p = S.pad;
  if (v === p.bon){ S.pad = null; p.ok(v); return; }
  S.err++; S.saisie = ""; S.shake = true; S.note = '<span class="bad">Pas tout à fait.</span>';
  if (p.ko) p.ko(v);
  if (S.pad) draw();
}
function clavier(e){
  if (!S) return;
  if (S.pad){
    if (/^[0-9]$/.test(e.key)) { touche(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { touche("del"); e.preventDefault(); }
    else if (e.key === "Enter") { touche("ok"); e.preventDefault(); }
  } else if (e.key === "Enter" && S.tools.length === 1) { e.preventDefault(); S.tools[0][2](); }
}

$("fs").onclick = function(){
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch(e){}
};
menu();
})();
