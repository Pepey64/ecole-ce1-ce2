/* Layout : une barre d'onglets (les 5 étapes de la leçon), un plan de travail central lisible au TBI. */
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#1c2333; --muted:#5f6b80; --line:#cfd7e3;
  --paper:#ffffff; --orange:#f28c28; --green:#38a35a; --blue:#2c6bd3; --red:#d63c3c;
  --orange-soft:#fde3c8; --green-soft:#d6f0dd; --red-soft:#f9d9d9; --blue-soft:#dde8fa;
  --chip:#f3f6fa; --shadow:0 2px 10px rgba(28,35,51,.08); --crust:#d9a256; --dough:#fff6e3;
  --font:"Andika","Comic Neue","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --panel:#1a202c; --ink:#e9edf5; --muted:#9aa5b8; --line:#344055;
  --paper:#242c3b; --orange:#f39a3e; --green:#4cbb6f; --blue:#5a8fe8; --red:#ea5f5f;
  --orange-soft:#4a3218; --green-soft:#1d3f29; --red-soft:#4a2224; --blue-soft:#1f3256;
  --chip:#232b3a; --shadow:0 2px 10px rgba(0,0,0,.35); --crust:#b07a36; --dough:#3a3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --panel:#1a202c; --ink:#e9edf5; --muted:#9aa5b8; --line:#344055;
  --paper:#242c3b; --orange:#f39a3e; --green:#4cbb6f; --blue:#5a8fe8; --red:#ea5f5f;
  --orange-soft:#4a3218; --green-soft:#1d3f29; --red-soft:#4a2224; --blue-soft:#1f3256;
  --chip:#232b3a; --shadow:0 2px 10px rgba(0,0,0,.35); --crust:#b07a36; --dough:#3a3328; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{margin:0;font-size:1.7rem;display:flex;align-items:center;gap:12px;text-wrap:balance}
h1 .logo{display:inline-grid;grid-template-columns:repeat(4,12px);gap:2px}
h1 .logo i{height:22px;border-radius:3px;background:var(--line)}
h1 .logo i:nth-child(-n+3){background:var(--orange)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font:inherit;font-size:1rem;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:12px;padding:8px 14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
nav button small{display:block;font-weight:400;font-size:.72rem;opacity:.75}
main{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px clamp(14px,3vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.intro{color:var(--muted);margin:0;font-size:.98rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-weight:700;font-size:.95rem;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-weight:700;min-width:46px;height:46px;padding:0 12px;border-radius:12px;border:2px solid var(--line);
  background:var(--chip);color:var(--ink);cursor:pointer;font-size:1.1rem}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:disabled{opacity:.45;cursor:default}
.chip[aria-pressed="true"]:disabled{opacity:1}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;font-size:1.05rem;background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
/* fractions écrites */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:700;line-height:1.05;margin:0 .12em}
.fr>span{padding:0 .18em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding-bottom:.06em}
.fr>span:last-child{padding-top:.06em}
.big{font-size:3.2rem}
.mid{font-size:2rem}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:2rem;font-weight:700;justify-content:center}
.slot{display:inline-grid;place-items:center;min-width:1.5em;height:1.25em;border:3px dashed var(--muted);border-radius:10px;color:var(--blue)}
.slot.filled{border-style:solid;border-color:var(--blue)}
/* bandes */
.figure{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:0}
svg{display:block;max-width:100%;height:auto}
.part{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.part.o{fill:var(--orange)} .part.g{fill:var(--green)} .part.x{fill:var(--red-soft)}
.part.click{cursor:pointer}
.part.click:hover{fill:var(--blue-soft)}
.part.o.click:hover{fill:var(--orange)}
.whole{fill:none;stroke:var(--blue);stroke-width:5}
.pz .part{fill:var(--dough)} .pz .part.o{fill:var(--orange)} .pz .part.g{fill:var(--green)} .pz .part.x{fill:var(--red-soft)}
.pz .part.click:hover{fill:var(--blue-soft)}
.crust{fill:none;stroke:var(--crust);stroke-width:12}
.pizzas{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:center;align-items:center}
.pzc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pzc .fr{font-size:1.5rem}
.eqs{font-size:2.4rem;font-weight:700}
.cross{stroke:var(--red);stroke-width:4;stroke-linecap:round}
.tick{stroke:var(--ink)} .tlab{fill:var(--ink);font:700 22px var(--font)} .tsub{fill:var(--muted);font:700 15px var(--font)}
.rul{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.band{fill:var(--orange);stroke:var(--ink);stroke-width:2}
.mark{fill:var(--blue)} .markok{fill:var(--green)} .markko{fill:var(--red)}
.hit{fill:transparent;cursor:crosshair}
.barlab{display:flex;align-items:center;gap:12px}
.barlab>div{flex:1;min-width:0}
.barlab .fr{font-size:1.5rem;min-width:2.2em}
/* retour */
.fb{border-radius:14px;padding:14px 18px;font-size:1.08rem;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--green-soft)} .fb.ko{background:var(--red-soft)} .fb.info{background:var(--blue-soft)}
.fb b.tag{flex:none;font-size:1.4rem;line-height:1}
.fb .fr{font-size:1.15rem}
.progress{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--green)} .dot.ko{background:var(--red)} .dot.now{outline:3px solid var(--blue);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:.95rem;border:0;background:var(--chip);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.words{font-size:1.5rem;font-weight:700;text-align:center}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.legend div{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:.98rem}
.legend b{color:var(--blue)}
.cmpbtns .chip{font-size:2rem;width:74px;height:64px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:20px 0}
.result .score{font-size:3rem;font-weight:700}
.wall{display:flex;flex-direction:column;gap:3px}
.wall .r{display:flex;gap:3px}
.wall .c{flex:1;min-width:0;display:grid;place-items:center;background:var(--chip);border:2px solid var(--line);border-radius:6px;height:44px;font-size:.9rem}
.wall .c .fr{font-size:.95rem}
details summary{cursor:pointer;font-weight:700;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;text-align:center}
@media (max-width:560px){body{font-size:16px}.big{font-size:2.4rem}.q{font-size:1.5rem}.chip{min-width:40px;height:42px}}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Les fractions — CE2</h1>
    <nav id="tabs" role="tablist"></nav>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer>Programme de mathématiques cycle 2 (2025) — fractions de dénominateur ≤ 12, inférieures ou égales à 1.</footer>
</div>

<script>
"use strict";
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const NW=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze"];
const DN={1:"unité",2:"demi",3:"tiers",4:"quart",5:"cinquième",6:"sixième",7:"septième",8:"huitième",9:"neuvième",10:"dixième",11:"onzième",12:"douzième"};
const plur=d=>d===3?"tiers":DN[d]+"s";
const fw=(n,d)=>n===1?(d===2?"un demi":"un "+DN[d]):NW[n]+" "+plur(d);
const fr=(n,d,c="")=>`<span class="fr ${c}"><span>${n}</span><span>${d}</span></span>`;
const SVGNS='xmlns="http://www.w3.org/2000/svg"';

/* ------------------------------------------------------------ dessins */
function bar(d,fills,o={}){
  const W=o.w||640,H=o.h||64,pad=4,pw=(W-2*pad)/d;let s=`<svg ${SVGNS} viewBox="0 0 ${W} ${H+2*pad}" role="img" aria-label="${o.aria||"bande partagée en "+d+" parts égales"}">`;
  for(let i=0;i<d;i++){const f=fills[i]||"";
    s+=`<rect class="part ${f} ${o.click?"click":""}" ${o.click?`data-i="${i}" data-bar="${o.id}"`:""} x="${pad+i*pw}" y="${pad}" width="${pw}" height="${H}"/>`;
    if(f==="x")s+=`<line class="cross" x1="${pad+i*pw+8}" y1="${pad+H-8}" x2="${pad+(i+1)*pw-8}" y2="${pad+8}"/>`;}
  s+=`<rect class="whole" x="${pad}" y="${pad}" width="${W-2*pad}" height="${H}" rx="2"/></svg>`;return s;}
function disc(d,fills,o={}){
  const R=150,c=162,size=o.size||320,cl=o.click?"click":"",da=o.click?`data-bar="${o.id}"`:"";
  let s=`<svg ${SVGNS} class="pz" viewBox="0 0 324 324" style="width:${size}px;max-width:100%;margin:0 auto" role="img" aria-label="pizza partagée en ${d} parts égales">`;
  if(d===1)s+=`<circle class="part ${fills[0]||""} ${cl}" data-i="0" ${da} cx="${c}" cy="${c}" r="${R}"/>`;
  else for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d,lg=(a1-a0)>Math.PI?1:0;
    s+=`<path class="part ${fills[i]||""} ${cl}" data-i="${i}" ${da} d="M${c},${c} L${(c+R*Math.cos(a0)).toFixed(1)},${(c+R*Math.sin(a0)).toFixed(1)} A${R},${R} 0 ${lg} 1 ${(c+R*Math.cos(a1)).toFixed(1)},${(c+R*Math.sin(a1)).toFixed(1)} Z"/>`;
    if(fills[i]==="x"){const am=(a0+a1)/2,mx=c+R*.62*Math.cos(am),my=c+R*.62*Math.sin(am),k=Math.min(18,R*Math.PI/d*.4);
      s+=`<path class="cross" d="M${mx-k},${my-k} L${mx+k},${my+k} M${mx+k},${my-k} L${mx-k},${my+k}"/>`;}}
  s+=`<circle class="crust" cx="${c}" cy="${c}" r="${R+3}"/></svg>`;return s;}
const REP={mode:"mix"};
const pickRep=()=>REP.mode==="mix"?(Math.random()<.5?"pizza":"bande"):REP.mode;
const repSeg=()=>`<div class="seg" aria-label="représentation">${[["mix","Bandes et pizzas"],["bande","Bandes"],["pizza","Pizzas"]].map(([v,l])=>`<button data-act="rep" data-v="${v}" aria-pressed="${REP.mode===v}">${l}</button>`).join("")}</div>`;
function grid(d,fills,o={}){
  const shapes={2:[1,2],3:[1,3],4:[2,2],5:[1,5],6:[2,3],7:[1,7],8:[2,4],9:[3,3],10:[2,5],11:[1,11],12:[3,4]};
  const [r,cN]=shapes[d]||[1,d];const cw=Math.min(90,600/cN),ch=r===1?110:cw;const W=cN*cw+8,H=r*ch+8;
  let s=`<svg ${SVGNS} viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(640,W*1.2)}px;margin:0 auto" role="img" aria-label="rectangle partagé en ${d} parts égales">`;
  for(let i=0;i<d;i++){const x=4+(i%cN)*cw,y=4+Math.floor(i/cN)*ch;s+=`<rect class="part ${fills[i]||""} click" data-i="${i}" data-bar="${o.id}" x="${x}" y="${y}" width="${cw}" height="${ch}"/>`;}
  s+=`<rect class="whole" x="4" y="4" width="${W-8}" height="${H-8}"/></svg>`;return s;}
const fillsOf=(d,list)=>{const f=Array(d).fill("");let k=0;for(const [cl,n] of list){for(let j=0;j<n&&k<d;j++)f[k++]=cl;}return f;};

/* règle graduée : 3 unités */
const RX0=50,RU=290,RY=70;
function ruler(sub,o={}){
  let s=`<svg ${SVGNS} viewBox="0 0 1000 ${o.h||150}" role="img" aria-label="règle graduée en ${plur(sub)} d'unité">`;
  if(o.band!=null)s+=`<rect class="band" x="${RX0}" y="${RY-36}" width="${o.band*RU}" height="26"/>`;
  s+=`<rect class="rul" x="${RX0-8}" y="${RY}" width="${3*RU+16}" height="40" rx="3"/>`;
  for(let k=0;k<=3*sub;k++){const x=RX0+k*RU/sub;const major=k%sub===0;const half=sub%2===0&&k%(sub/2)===0;
    const l=major?40:half?26:16;s+=`<line class="tick" x1="${x}" y1="${RY}" x2="${x}" y2="${RY+l}" stroke-width="${major?3:1.6}"/>`;
    if(major)s+=`<text class="tlab" x="${x}" y="${RY+68}" text-anchor="middle">${k/sub}</text>`;}
  if(o.marks)for(const m of o.marks)s+=`<path class="${m.c}" d="M${RX0+m.v*RU},${RY-2} l-11,-22 h22 z"/>`;
  if(o.click)s+=`<rect class="hit" id="hit" x="${RX0-20}" y="${RY-40}" width="${3*RU+40}" height="100"/>`;
  return s+"</svg>";}

/* ------------------------------------------------------------ séries */
const N=10;
function progress(S){let s='<div class="progress" aria-label="progression">';for(let i=0;i<N;i++){const r=S.res[i];s+=`<span class="dot ${r===true?"ok":r===false?"ko":""} ${i===S.i&&!S.done?"now":""}"></span>`;}return s+`<span class="lbl" style="margin-left:8px">${Math.min(S.i+1,N)} / ${N}</span></div>`;}
function newSeries(gen){return{i:0,res:[],q:gen(),answered:false,done:false,gen};}
function nextQ(S){S.i++;if(S.i>=N){S.done=true;return;}S.q=S.gen();S.answered=false;S.fb=null;}
function resultView(S,again){const ok=S.res.filter(x=>x).length;
  const msg=ok===N?"Bravo, sans faute !":ok>=8?"Très bien !":ok>=5?"C'est en bonne voie, on recommence pour s'entraîner.":"On reprend tranquillement avec les bandes.";
  return `<div class="result"><div class="score">${ok} / ${N}</div><div class="words">${msg}</div><button class="btn" data-act="${again}">Nouvelle série</button></div>`;}
const fbHTML=fb=>fb?`<div class="fb ${fb.k}"><b class="tag">${fb.k==="ok"?"✓":fb.k==="ko"?"✗":"→"}</b><div>${fb.t}</div></div>`:"";

/* ============================================================ 1. DÉCOUVRIR */
const D={d:8,shape:"bande",on:new Set([0,1,2])};
function vDecouvrir(){
  const n=D.on.size,d=D.d,f=Array.from({length:d},(_,i)=>D.on.has(i)?"o":"");
  const fig=D.shape==="bande"?bar(d,f,{click:1,id:"dec",h:90}):D.shape==="disque"?disc(d,f,{id:"dec",click:1,size:340}):grid(d,f,{id:"dec"});
  let chips="";for(let k=2;k<=12;k++)chips+=`<button class="chip" data-act="decd" data-v="${k}" aria-pressed="${k===d}">${k}</button>`;
  return `<p class="intro">Choisis en combien de parts égales on partage le tout, puis touche les parts pour les colorier.</p>
  <div class="top"><div class="row"><span class="lbl">Parts égales :</span>${chips}</div>
  <div class="seg">${[["bande","bande"],["disque","pizza"],["rectangle","rectangle"]].map(([s,l])=>`<button data-act="decs" data-v="${s}" aria-pressed="${D.shape===s}">${l}</button>`).join("")}</div></div>
  <div class="figure">${fig}</div>
  <div class="row" style="justify-content:center;gap:28px">
    <span class="big">${fr(n,d)}</span>
    <div><div class="words">${n===0?"rien n'est colorié":fw(n,d)}</div>
    <div class="intro">${n===d?"Toutes les parts sont prises : "+fr(d,d)+" = 1, c'est le tout.":n>d?"":`${n===1?"une part":NW[n]+" parts"} sur ${NW[d]} parts égales`}</div></div>
  </div>
  <div class="legend"><div><b>${n}</b> est le <b>numérateur</b> : le nombre de parts prises.</div><div><b>${d}</b> est le <b>dénominateur</b> : en combien de parts égales on partage le tout.</div></div>
  <div class="row"><button class="btn ghost" data-act="decclr">Tout effacer</button><button class="btn ghost" data-act="decall">Tout colorier</button></div>
  <details><summary>Le mur des fractions</summary>${wall()}</details>`;}
function wall(){const ds=[1,2,3,4,5,6,8,10,12];return `<div class="wall" style="margin-top:10px">${ds.map(d=>`<div class="r">${Array.from({length:d},()=>`<div class="c">${d===1?"<b>1</b>":fr(1,d)}</div>`).join("")}</div>`).join("")}</div>`;}

/* ============================================================ 2. ÉGALER */
function genEg(){
  const pairs=[];for(const d1 of [2,3,4,5,6])for(const m of [2,3,4])if(d1*m<=12)pairs.push([d1,m]);
  const [d,m]=pick(pairs);const n=rnd(1,d-1>0?d-1:1);const down=Math.random()<.35;
  const rep=pickRep();return down?{n1:n*m,d1:d*m,d2:d,t:n,m,down,rep}:{n1:n,d1:d,d2:d*m,t:n*m,m,down,rep};}
let E=newSeries(genEg);E.on=new Set();
function vEgaler(){
  if(E.done)return `<div class="row">${repSeg()}</div>`+resultView(E,"egnew");
  const q=E.q,f1=fillsOf(q.d1,[["o",q.n1]]),f2=Array.from({length:q.d2},(_,i)=>E.on.has(i)?"o":"");
  if(E.answered&&!E.ok)for(let i=0;i<q.d2;i++)f2[i]=i<q.t?"g":"";
  const slot=E.answered?`<span class="slot filled">${E.on.size}</span>`:`<span class="slot">${E.on.size||"?"}</span>`;
  return `<div class="top"><p class="intro">Colorie la même quantité sur la 2<sup>e</sup> ${E.q.rep==="pizza"?"pizza":"bande"}, puis vérifie.</p>${progress(E)}</div><div class="row">${repSeg()}</div>
  <div class="q">${fr(q.n1,q.d1,"big")} <span>=</span> <span class="fr big"><span>${slot}</span><span>${q.d2}</span></span></div>
  ${q.rep==="pizza"?`<div class="pizzas"><div class="pzc">${disc(q.d1,f1,{size:270})}${fr(q.n1,q.d1)}</div><span class="eqs">=</span><div class="pzc">${disc(q.d2,f2,{click:!E.answered,id:"eg",size:270})}${fr("?",q.d2)}</div></div>`
  :`<div class="figure"><div class="barlab">${fr(q.n1,q.d1)}<div>${bar(q.d1,f1)}</div></div>
  <div class="barlab">${fr("?",q.d2)}<div>${bar(q.d2,f2,{click:!E.answered,id:"eg"})}</div></div></div>`}
  ${fbHTML(E.fb)}
  <div class="row">${E.answered?`<button class="btn" data-act="egnext">${E.i===N-1?"Voir mon score":"Question suivante"}</button>`:`<button class="btn" data-act="egchk">Vérifier</button><button class="btn ghost" data-act="egclr">Effacer</button>`}</div>`;}
function checkEg(){
  const q=E.q,n=E.on.size;E.answered=true;E.ok=n===q.t;E.res[E.i]=E.ok;
  const big=q.down?q.d1:q.d2,small=q.down?q.d2:q.d1;
  const rule=`Les ${plur(big)} sont des parts ${NW[q.m]} fois plus petites que les ${plur(small)} : ${q.down?"il en faut "+NW[q.m]+" fois moins":"il en faut "+NW[q.m]+" fois plus"}.`;
  E.fb=E.ok?{k:"ok",t:`Oui ! ${fr(q.n1,q.d1)} = ${fr(q.t,q.d2)}. ${rule}`}:{k:"ko",t:`Tu as colorié ${fr(n,q.d2)}. La bonne réponse est ${fr(q.t,q.d2)} (en vert). ${rule}`};}

/* ============================================================ 3. COMPARER */
const C={type:"tous"};
function genCmp(){
  const t=C.type==="tous"?pick(["den","num","mul"]):C.type;
  if(t==="den"){const d=rnd(3,12);let a=rnd(1,d-1),b=rnd(1,d-1);if(Math.random()<.15)b=a;return{t,a:[a,d],b:[b,d],rep:pickRep()};}
  if(t==="num"){let n=rnd(1,4),d1=rnd(n+1,12),d2=rnd(n+1,12);while(d2===d1)d2=rnd(n+1,12);return{t,a:[n,d1],b:[n,d2],rep:pickRep()};}
  const d=pick([2,3,4,5,6]),m=d*3<=12&&Math.random()<.4?3:2,D=d*m;let x=rnd(1,d-1),y=rnd(1,D-1);
  if(Math.random()<.2)y=x*m;const A=[x,d],B=[y,D];const rep=pickRep();return Math.random()<.5?{t,a:A,b:B,m,rep}:{t,a:B,b:A,m,rep};}
let K=newSeries(genCmp);K.help=false;
const sign=(a,b)=>{const l=a[0]*b[1],r=b[0]*a[1];return l<r?"<":l>r?">":"=";};
function vComparer(){
  const types=[["tous","Tout mélangé"],["den","Même dénominateur"],["num","Même numérateur"],["mul","Dénominateur double/triple"]];
  const head=`<div class="top"><div class="seg" style="flex-wrap:wrap">${types.map(([v,l])=>`<button data-act="cmpt" data-v="${v}" aria-pressed="${C.type===v}">${l}</button>`).join("")}</div>${progress(K)}</div><div class="row">${repSeg()}</div>`;
  if(K.done)return head+resultView(K,"cmpnew");
  const q=K.q,show=K.help||K.answered;
  return `${head}
  <div class="q">${fr(...q.a,"big")}<span class="slot ${K.answered?"filled":""}" style="font-size:2.4rem">${K.answered?K.pick:"?"}</span>${fr(...q.b,"big")}</div>
  <div class="row cmpbtns" style="justify-content:center">${["<","=",">"].map(s=>`<button class="chip" data-act="cmp" data-v="${s}" ${K.answered?"disabled":""}>${s}</button>`).join("")}</div>
  ${show&&q.rep==="pizza"?`<div class="pizzas"><div class="pzc">${disc(q.a[1],fillsOf(q.a[1],[["o",q.a[0]]]),{size:250})}${fr(...q.a)}</div><div class="pzc">${disc(q.b[1],fillsOf(q.b[1],[["g",q.b[0]]]),{size:250})}${fr(...q.b)}</div></div>`:show?`<div class="figure"><div class="barlab">${fr(...q.a)}<div>${bar(q.a[1],fillsOf(q.a[1],[["o",q.a[0]]]))}</div></div><div class="barlab">${fr(...q.b)}<div>${bar(q.b[1],fillsOf(q.b[1],[["g",q.b[0]]]))}</div></div></div>`:`<div class="row" style="justify-content:center"><button class="btn ghost" data-act="cmphelp">Montrer ${q.rep==="pizza"?"les pizzas":"les bandes"}</button></div>`}
  ${fbHTML(K.fb)}
  ${K.answered?`<div class="row"><button class="btn" data-act="cmpnext">${K.i===N-1?"Voir mon score":"Question suivante"}</button></div>`:""}`;}
function checkCmp(s){
  const q=K.q,good=sign(q.a,q.b);K.pick=s;K.answered=true;const ok=s===good;K.res[K.i]=ok;
  const A=fr(...q.a),B=fr(...q.b);let why;
  if(q.t==="den")why=`Les parts sont les mêmes (des ${plur(q.a[1])}) : je compare le nombre de parts, ${q.a[0]} et ${q.b[0]}.`;
  else if(q.t==="num")why=`On prend ${q.a[0]===1?"une part":NW[q.a[0]]+" parts"} dans les deux cas. Plus le dénominateur est grand, plus les parts sont petites : un ${DN[Math.max(q.a[1],q.b[1])]} est plus petit qu'un ${DN[Math.min(q.a[1],q.b[1])]}.`;
  else{const sm=q.a[1]<q.b[1]?q.a:q.b,bg=q.a[1]<q.b[1]?q.b:q.a,m=bg[1]/sm[1];
    why=`Je transforme : ${fr(...sm)} = ${fr(sm[0]*m,bg[1])}. Je compare ${fr(sm[0]*m,bg[1])} et ${fr(...bg)}.`;}
  K.fb={k:ok?"ok":"ko",t:`${ok?"Bravo !":"Pas tout à fait."} ${A} ${good} ${B}. ${why}`};}

/* ============================================================ 4. CALCULER */
const Ca={type:"tous"};
function genCal(){
  const t=Ca.type==="tous"?pick(["add","sub","addm","subm","comp"]):Ca.type;
  if(t==="add"){const d=rnd(3,12),a=rnd(1,d-1),b=rnd(1,d-a);return{t,op:"+",x:[a,d],y:[b,d],D:d,r:a+b,xa:a,ya:b,rep:pickRep()};}
  if(t==="sub"){const d=rnd(3,12),a=rnd(2,d),b=rnd(1,a-1);return{t,op:"−",x:[a,d],y:[b,d],D:d,r:a-b,xa:a,ya:b,rep:pickRep()};}
  if(t==="comp"){const d=rnd(2,12),a=rnd(1,d-1);return{t,op:"+",x:[a,d],y:null,D:d,r:d-a,xa:a,ya:d-a,rep:pickRep()};}
  const d=pick([2,3,4,5,6]),m=d*3<=12&&Math.random()<.4?3:2,D=d*m;
  if(t==="addm"){const x=rnd(1,d-1),y=rnd(1,D-x*m);const small=[x,d],big=[y,D];const first=Math.random()<.5;
    return{t,op:"+",x:first?small:big,y:first?big:small,D,r:x*m+y,xa:first?x*m:y,ya:first?y:x*m,m,small,rep:pickRep()};}
  // subm : le plus grand en premier
  let x=rnd(1,d-1),y=rnd(1,D-1);if(x*m===y)y=y>1?y-1:y+1;
  const sv=x*m,big=sv>y?[x,d]:[y,D],small=sv>y?[y,D]:[x,d];const bv=Math.max(sv,y),svv=Math.min(sv,y);
  return{t,op:"−",x:big,y:small,D,r:bv-svv,xa:bv,ya:svv,m,small:[x,d],rep:pickRep()};}
let Q=newSeries(genCal);Q.help=false;Q.val=null;
function calBar(q){
  const f=q.op==="+"?fillsOf(q.D,[["o",q.xa],["g",q.ya]]):fillsOf(q.D,[["o",q.xa-q.ya],["x",q.ya]]);
  return q.rep==="pizza"?disc(q.D,f,{size:280}):bar(q.D,f);}
function vCalculer(){
  const types=[["tous","Tout mélangé"],["add","+ même dénom."],["sub","− même dénom."],["addm","+ dénom. double"],["subm","− dénom. double"],["comp","Compléter à 1"]];
  const head=`<div class="top"><div class="seg" style="flex-wrap:wrap">${types.map(([v,l])=>`<button data-act="calt" data-v="${v}" aria-pressed="${Ca.type===v}">${l}</button>`).join("")}</div>${progress(Q)}</div><div class="row">${repSeg()}</div>`;
  if(Q.done)return head+resultView(Q,"calnew");
  const q=Q.q;
  const ans=`<span class="fr big"><span><span class="slot ${Q.val!=null?"filled":""}">${Q.val??"?"}</span></span><span>${q.D}</span></span>`;
  const expr=q.t==="comp"?`${fr(...q.x,"big")}<span>+</span>${ans}<span>= 1</span>`:`${fr(...q.x,"big")}<span>${q.op}</span>${fr(...q.y,"big")}<span>=</span>${ans}`;
  let chips="";for(let k=0;k<=q.D;k++)chips+=`<button class="chip" data-act="calv" data-v="${k}" aria-pressed="${Q.val===k}" ${Q.answered?"disabled":""}>${k}</button>`;
  const show=Q.help||Q.answered;
  return `${head}
  <div class="q">${expr}</div>
  <div class="row" style="justify-content:center"><span class="lbl">Numérateur :</span>${chips}</div>
  ${show?`<div class="figure">${calBar(q)}<div class="intro">${q.op==="+"?(q.rep==="pizza"?"Orange : la 1<sup>re</sup> fraction · Vert : la 2<sup>e</sup> · La pizza entière : le tout.":"Orange : la 1<sup>re</sup> fraction · Vert : la 2<sup>e</sup> · Le cadre bleu : le tout."):"Orange + rouge : la 1<sup>re</sup> fraction · Rouge barré : ce que j'enlève."}${q.m?` Les deux fractions sont écrites en ${plur(q.D)}.`:""}</div></div>`:`<div class="row" style="justify-content:center"><button class="btn ghost" data-act="calhelp">Montrer ${q.rep==="pizza"?"la pizza":"la bande"}</button></div>`}
  ${fbHTML(Q.fb)}
  <div class="row">${Q.answered?`<button class="btn" data-act="calnext">${Q.i===N-1?"Voir mon score":"Question suivante"}</button>`:`<button class="btn" data-act="calchk" ${Q.val==null?"disabled":""}>Vérifier</button>`}</div>`;}
function checkCal(){
  const q=Q.q,ok=Q.val===q.r;Q.answered=true;Q.res[Q.i]=ok;let say;
  if(q.t==="comp")say=`${fr(...q.x)} + ${fr(q.r,q.D)} = ${fr(q.D,q.D)} = 1 : il manque ${fw(q.r,q.D)} pour avoir le tout.`;
  else if(q.m){const s=q.small;say=`Je transforme : ${fr(...s)} = ${fr(s[0]*q.m,q.D)}. Puis ${fw(q.xa,q.D)} ${q.op==="+"?"plus":"moins"} ${fw(q.ya,q.D)}, cela fait ${fw(q.r,q.D)}.`;}
  else say=`${fw(q.xa,q.D)} ${q.op==="+"?"plus":"moins"} ${fw(q.ya,q.D)}, cela fait ${fw(q.r,q.D)}.`;
  Q.fb={k:ok?"ok":"ko",t:`${ok?"Juste !":"La réponse est "+fr(q.r,q.D)+"."} ${say}`};}

/* ============================================================ 5. MESURER / PLACER */
const Me={mode:"mesurer"};
function genMes(){
  if(Me.mode==="mesurer"){const sub=pick([2,4,4,8,10,10]);const u=rnd(0,2),k=rnd(1,sub-1);return{sub,u,k};}
  // placer
  const r=Math.random();
  if(r<.35){const sub=10,alt=pick([[1,2],[1,5],[2,5],[3,5],[4,5]]);const u=rnd(0,2);return{sub,u,n:alt[0],d:alt[1],k:alt[0]*10/alt[1]};}
  if(r<.55){const sub=8,n=pick([1,3]),u=rnd(0,2);return{sub,u,n,d:4,k:n*2};}
  const sub=pick([4,8,10]),u=rnd(0,2),k=rnd(1,sub-1);return{sub,u,n:k,d:sub,k};}
let Ms=newSeries(genMes);Ms.U=null;Ms.K=null;Ms.place=null;
const lenTxt=(u,k,sub)=>u===0?fr(k,sub)+" d'unité":`${u} unité${u>1?"s":""} + ${fr(k,sub)} d'unité`;
function vMesurer(){
  const q=Ms.q,mode=Me.mode;
  const head=`<div class="top"><div class="seg">${[["mesurer","Mesurer une bande"],["placer","Placer sur la règle"]].map(([v,l])=>`<button data-act="mesm" data-v="${v}" aria-pressed="${mode===v}">${l}</button>`).join("")}</div>${progress(Ms)}</div>`;
  if(Ms.done)return head+resultView(Ms,"mesnew");
  if(mode==="mesurer"){
    let uc="";for(let u=0;u<=2;u++)uc+=`<button class="chip" data-act="mesu" data-v="${u}" aria-pressed="${Ms.U===u}" ${Ms.answered?"disabled":""}>${u}</button>`;
    let kc="";for(let k=0;k<q.sub;k++)kc+=`<button class="chip" data-act="mesk" data-v="${k}" aria-pressed="${Ms.K===k}" ${Ms.answered?"disabled":""}>${k}</button>`;
    return `${head}<p class="intro">La règle est graduée en <b>${plur(q.sub)}</b> d'unité. Combien mesure la bande orange ?</p>
    <div class="figure">${ruler(q.sub,{band:q.u+q.k/q.sub})}</div>
    <div class="q" style="font-size:1.6rem">La bande mesure <span class="slot ${Ms.U!=null?"filled":""}">${Ms.U??"?"}</span> unité(s) + <span class="fr mid"><span><span class="slot ${Ms.K!=null?"filled":""}">${Ms.K??"?"}</span></span><span>${q.sub}</span></span> d'unité</div>
    <div class="row" style="justify-content:center"><span class="lbl">Unités :</span>${uc}</div>
    <div class="row" style="justify-content:center"><span class="lbl">${plur(q.sub)[0].toUpperCase()+plur(q.sub).slice(1)} :</span>${kc}</div>
    ${fbHTML(Ms.fb)}
    <div class="row">${Ms.answered?`<button class="btn" data-act="mesnext">${Ms.i===N-1?"Voir mon score":"Question suivante"}</button>`:`<button class="btn" data-act="meschk" ${Ms.U==null||Ms.K==null?"disabled":""}>Vérifier</button>`}</div>`;}
  const target=q.u+q.k/q.sub;const marks=[];
  if(Ms.place!=null)marks.push({v:Ms.place,c:Ms.answered?(Ms.ok?"markok":"markko"):"mark"});
  if(Ms.answered&&!Ms.ok)marks.push({v:target,c:"markok"});
  const tTxt=q.u===0?fr(q.n,q.d)+" d'unité":`${q.u} unité${q.u>1?"s":""} + ${fr(q.n,q.d)} d'unité`;
  return `${head}<p class="intro">Touche la règle (graduée en <b>${plur(q.sub)}</b>) pour placer la flèche, puis vérifie.</p>
  <div class="q" style="font-size:1.7rem">Place : ${tTxt}</div>
  <div class="figure">${ruler(q.sub,{marks,click:!Ms.answered})}</div>
  ${fbHTML(Ms.fb)}
  <div class="row">${Ms.answered?`<button class="btn" data-act="mesnext">${Ms.i===N-1?"Voir mon score":"Question suivante"}</button>`:`<button class="btn" data-act="plachk" ${Ms.place==null?"disabled":""}>Vérifier</button>`}</div>`;}
function checkMes(){
  const q=Ms.q,ok=Ms.U===q.u&&Ms.K===q.k;Ms.answered=true;Ms.res[Ms.i]=ok;
  Ms.fb={k:ok?"ok":"ko",t:`${ok?"Bien mesuré !":"Regarde bien les graduations."} La bande mesure ${lenTxt(q.u,q.k,q.sub)}.${q.u?"":" Elle est plus courte qu'une unité."}`};}
function checkPla(){
  const q=Ms.q,target=q.u+q.k/q.sub,ok=Math.abs(Ms.place-target)<1e-6;Ms.answered=true;Ms.ok=ok;Ms.res[Ms.i]=ok;
  let extra="";if(q.d!==q.sub)extra=` Sur cette règle, ${fr(q.n,q.d)} = ${fr(q.k,q.sub)} : je compte ${NW[q.k]} ${plur(q.sub)}${q.u?" après "+q.u:""}.`;
  Ms.fb={k:ok?"ok":"ko",t:`${ok?"Bien placé !":"La flèche verte montre la bonne place."}${extra}`};}

/* ------------------------------------------------------------ navigation */
const TABS=[["dec","Découvrir","le tout et ses parts"],["eg","Égaler","fractions égales"],["cmp","Comparer","< = >"],["cal","Calculer","+ et −"],["mes","Mesurer","bande-unité"]];
let tab="dec";
try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;}catch(e){}
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,s])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}<small>${s}</small></button>`).join("");
  document.getElementById("main").innerHTML={dec:vDecouvrir,eg:vEgaler,cmp:vComparer,cal:vCalculer,mes:vMesurer}[tab]();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return;}
  const p=e.target.closest("[data-bar]");
  if(p){const i=+p.dataset.i,set=p.dataset.bar==="dec"?D.on:E.on;set.has(i)?set.delete(i):set.add(i);render();return;}
  if(e.target.id==="hit"){const svg=e.target.ownerSVGElement,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const p2=pt.matrixTransform(svg.getScreenCTM().inverse());const q=Ms.q;let v=Math.round((p2.x-RX0)/RU*q.sub)/q.sub;v=Math.max(0,Math.min(3,v));Ms.place=v;render();return;}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case"rep":REP.mode=v;for(const S of [E,K,Q])if(S.q&&!S.answered&&!S.done){S.q.rep=pickRep();}E.on=new Set();break;
    case"decd":D.d=+v;D.on=new Set([...D.on].filter(i=>i<D.d));break;
    case"decs":D.shape=v;break;
    case"decclr":D.on.clear();break;
    case"decall":D.on=new Set(Array.from({length:D.d},(_,i)=>i));break;
    case"egchk":checkEg();break;
    case"egclr":E.on.clear();break;
    case"egnext":nextQ(E);E.on=new Set();break;
    case"egnew":E=newSeries(genEg);E.on=new Set();break;
    case"cmpt":C.type=v;K=newSeries(genCmp);K.help=false;break;
    case"cmphelp":K.help=true;break;
    case"cmp":checkCmp(v);break;
    case"cmpnext":nextQ(K);break;
    case"cmpnew":K=newSeries(genCmp);K.help=false;break;
    case"calt":Ca.type=v;Q=newSeries(genCal);Q.val=null;break;
    case"calv":Q.val=+v;break;
    case"calhelp":Q.help=true;break;
    case"calchk":checkCal();break;
    case"calnext":nextQ(Q);Q.val=null;break;
    case"calnew":Q=newSeries(genCal);Q.val=null;break;
    case"mesm":Me.mode=v;Ms=newSeries(genMes);Ms.U=Ms.K=Ms.place=null;break;
    case"mesu":Ms.U=+v;break;
    case"mesk":Ms.K=+v;break;
    case"meschk":checkMes();break;
    case"plachk":checkPla();break;
    case"mesnext":nextQ(Ms);Ms.U=Ms.K=Ms.place=null;break;
    case"mesnew":Ms=newSeries(genMes);Ms.U=Ms.K=Ms.place=null;break;
  }
  render();});
render();
</script>
