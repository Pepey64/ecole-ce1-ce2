:root{
  --paper:#FAF6EA; --line:rgba(46,111,149,.16); --ink:#243B2C;
  --red:#D6483D; --blue:#2E6F95; --yellow:#F2B33D; --green:#4C9A5B; --purple:#7C5CA6; --orange:#E08A1E;
  --card:#E4DCC4; --muted:#7A7458; --tc:#2E6F95;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--line) 0px, var(--line) 1px, transparent 1px, transparent 28px);
  font-family:'Nunito','Segoe UI',Verdana,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
.hand{font-family:'Patrick Hand','Segoe Print','Comic Sans MS','Bradley Hand',cursive}
button{font-family:inherit; cursor:pointer; color:inherit; touch-action:manipulation}
.wrap{max-width:1150px; margin:0 auto; padding:10px 16px 24px}

/* ---------- en-tête et onglets ---------- */
header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
h1{margin:0; font-size:2.5rem; font-weight:400; line-height:1}
header .who{font-weight:700; color:var(--blue)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px}
.tab{flex:1 1 140px; font-size:1.6rem; padding:6px 10px; border-radius:14px; border:3px solid var(--c); background:#fff; color:var(--c); box-shadow:0 3px 0 var(--c); line-height:1.2}
.tab.on{background:var(--c); color:#fff}
.tab:active{transform:translateY(2px); box-shadow:0 1px 0 var(--c)}

/* ---------- accueil d'un onglet ---------- */
.home h2{margin:4px 0 0; font-size:2.2rem; font-weight:400; color:var(--tc)}
.home .sub{margin:2px 0 14px; font-size:1.15rem; font-weight:600; color:var(--muted)}
.opts{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px}
.grp{background:#fff; border:2px solid var(--card); border-radius:14px; padding:8px 12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.grp b{margin-right:4px}
.chip{font-size:1.05rem; font-weight:700; padding:7px 14px; border-radius:999px; border:2px solid #B9B09A; background:#F3EFE3}
.chip.on{background:var(--tc); border-color:var(--tc); color:#fff}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px}
.mode{background:#fff; border:3px solid var(--tc); border-radius:18px; padding:20px 18px; text-align:left; font-size:1.15rem; box-shadow:0 4px 0 var(--tc)}
.mode b{display:block; font-family:'Patrick Hand','Comic Sans MS',cursive; font-weight:400; font-size:2rem; color:var(--tc); margin-bottom:4px}
.mode span{color:#555}
.mode:active{transform:translateY(3px); box-shadow:0 1px 0 var(--tc)}
.note{font-size:1rem; color:var(--muted); margin-top:14px}
.small-btn{font-size:.9rem; padding:4px 10px; border-radius:8px; border:2px solid #B9B09A; background:#fff; margin-left:8px}

/* ---------- barre du haut pendant un exercice ---------- */
.top{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-bottom:8px}
.back{font-size:1.1rem; font-weight:700; padding:7px 14px; border-radius:10px; border:2px solid var(--ink); background:#fff}
.ttl{text-align:center; font-size:1.7rem; color:var(--tc)}
.prog{font-size:1.4rem; font-weight:800; min-width:60px; text-align:right}

.stage{background:#fff; border-radius:20px; border:2px solid var(--card); padding:14px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:260px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.phrase{font-size:3rem; line-height:1.25; text-align:center}
.phrase.xl{font-size:5rem}
.res{color:var(--green)}
.co{color:var(--orange)} .cg{color:#2F8A3E}

/* champ à compléter */
.fld{display:inline-block; min-width:1.4em; padding:0 .15em; text-align:center; border-bottom:4px dotted #999; color:#999; line-height:1.1}
.fld.act{border:4px solid var(--blue); border-radius:10px; color:var(--blue); background:#EAF2FB}
.fld.ok{color:var(--green); border-bottom:4px solid var(--green)}
.fld.shown{color:var(--red); border-bottom:4px solid var(--red)}

.msg{text-align:center; font-size:1.9rem; font-weight:800; min-height:44px; margin:6px 0}
.msg.good{color:var(--green)} .msg.bad{color:var(--red)}

/* pavé numérique */
.pad{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; max-width:760px; margin:0 auto}
.pad button{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:2.6rem; padding:4px 0; border-radius:14px; border:3px solid var(--ink); background:#fff; box-shadow:0 4px 0 var(--ink)}
.pad button:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.pad .ok{background:var(--green); color:#fff; font-family:'Nunito',sans-serif; font-weight:800; font-size:1.9rem}
.pad .del{background:var(--yellow)}

/* ---------- file numérique + jetons ---------- */
.scene{width:100%; display:flex; flex-direction:column; align-items:center; gap:6px; --cs:52px}
.scene.m20{--cs:38px}
.tokzone{display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap}
.frames{display:flex; gap:14px}
.frame{display:grid; grid-template-columns:repeat(5,var(--cs)); grid-template-rows:repeat(2,var(--cs)); border:3px solid var(--ink); border-radius:8px; background:#fff; overflow:hidden}
.cell{border:1px solid #D8D0B8; display:flex; align-items:center; justify-content:center}
.cell>div{width:78%; height:78%; border-radius:50%; transition:transform .35s, opacity .35s, background .3s}
.tok.on{background:var(--blue); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tok.on.new{background:var(--yellow); animation:pop .4s}
.tok.add{border:3px dashed #D99A1E; background:rgba(242,179,61,.18); animation:blink 1.2s infinite}
.tok.rem{background:var(--blue); position:relative; outline:3px solid var(--red); outline-offset:-1px}
.tok.rem::after{content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:calc(var(--cs)*.45)}
.tok.gone{transform:scale(0); opacity:0}
@keyframes blink{50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.badgebox{text-align:center}
.badge{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:4.2rem; min-width:96px; padding:0 10px; background:#fff; border:4px solid var(--blue); border-radius:18px; line-height:1.15; color:var(--blue)}
.badge.pop{animation:pop .4s}
.bl{font-weight:800; color:var(--blue); font-size:1.1rem}

svg.nl{width:100%; max-width:1000px; height:auto; display:block; overflow:visible}
.nl .axis{stroke:var(--ink); stroke-width:4; stroke-linecap:round}
.nl .tick{stroke:var(--ink); stroke-width:3}
.nl .lbl{font-family:'Patrick Hand','Comic Sans MS',cursive; fill:var(--ink); transition:fill .3s}
.nl .lbl.start{fill:var(--blue); font-weight:700}
.nl .lbl.hit{fill:var(--green); font-weight:700}
.nl .lbl.ck{cursor:pointer}
.nl .hop{fill:none; stroke-width:5; stroke-linecap:round; opacity:.75}
.nl .hop.p{stroke:var(--green)} .nl .hop.m{stroke:var(--red)}
.nl .hop.lit{opacity:1; stroke-width:7}
.nl .hop.draw{stroke-dasharray:1; stroke-dashoffset:1; animation:draw .45s forwards}
.nl .hopl{font-family:'Patrick Hand','Comic Sans MS',cursive}
.nl .hopl.p{fill:var(--green)} .nl .hopl.m{fill:var(--red)}
.nl .hopl.draw{opacity:0; animation:appear .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{to{opacity:1}}
#pion{transition:transform .45s ease-in-out}
#pion path,#pion circle{fill:var(--red); stroke:#fff; stroke-width:3}
.pj.jump{animation:jump .45s ease-in-out}
@keyframes jump{50%{transform:translateY(-34px)}}

.ops{display:flex; gap:24px; justify-content:center}
.op{font-size:3rem; min-width:150px; padding:2px 20px; border-radius:18px; border:3px solid; background:#fff; box-shadow:0 4px 0 currentColor}
.op.p{color:var(--green)} .op.m{color:var(--red)}
.op:active{transform:translateY(3px); box-shadow:0 1px 0 currentColor}
.hist{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:34px}
.hist span{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:1.5rem; background:#F3EFE3; border-radius:10px; padding:0 12px}
.hint{margin:0; color:var(--muted); font-size:1rem}

/* ---------- diagramme parties / tout ---------- */
.decrow{display:flex; align-items:center; justify-content:center; gap:34px; flex-wrap:wrap}
.diag{width:min(440px,82vw)}
.dtop{display:flex}
.dp,.dt{display:flex; align-items:center; justify-content:center; font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:4rem; line-height:1}
.dp{flex-basis:0; min-height:100px; border:3px solid; background-image:radial-gradient(rgba(0,0,0,.09) 1px, transparent 1.6px); background-size:6px 6px}
.dp.o{background-color:#FFE3BC; border-color:var(--orange)}
.dp.g{background-color:#D3F1D3; border-color:#3BAA4A}
.dt{border:3px solid var(--ink); border-top-width:0; background:#fff; min-height:88px; transition:background .3s}
.dt.win{background:#E7F5E8}
.diag.sm{width:min(360px,80vw)}
.diag.sm .dp{min-height:84px} .diag.sm .dt{min-height:74px}
.handwrap{display:flex; align-items:center; gap:8px}
.handbox{width:210px}
.handbox.pop{animation:pop .45s}
.hand-svg{width:100%; height:auto; display:block}
.hand-svg .ck{cursor:pointer}
.arr{font-size:2rem; width:58px; height:58px; border-radius:50%; border:3px solid var(--ink); background:#fff}
.nums{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; font-weight:800; font-size:1.2rem}
.numb{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:2.2rem; width:64px; height:58px; border-radius:12px; border:3px solid var(--ink); background:#fff}
.numb.on{background:var(--orange); border-color:var(--orange); color:#fff}
.allways{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; font-size:1.1rem}
.way{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:1.6rem; padding:0 12px; border-radius:10px; border:2px solid #B9B09A; background:#F3EFE3}
.way.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.steps{display:flex; gap:26px; flex-wrap:wrap; justify-content:center}
.stp{display:flex; align-items:center; gap:10px; border:3px solid; border-radius:16px; padding:4px 10px}
.stp.o{border-color:var(--orange); background:#FFF3E2} .stp.g{border-color:#3BAA4A; background:#EAF8EA}
.stp b{font-family:'Patrick Hand','Comic Sans MS',cursive; font-weight:400; font-size:2.6rem; min-width:40px; text-align:center}
.stp button{font-size:2rem; width:54px; height:54px; border-radius:50%; border:3px solid var(--ink); background:#fff; font-weight:800}
.act{font-size:1.4rem; font-weight:800; padding:10px 22px; border-radius:14px; border:3px solid var(--ink); background:#fff; box-shadow:0 4px 0 var(--ink)}
.act.main{background:var(--tc); color:#fff; border-color:var(--tc); box-shadow:0 4px 0 rgba(0,0,0,.35)}
.act:active{transform:translateY(3px)}

/* ---------- fin de série / défi ---------- */
.end{text-align:center; background:#fff; border-radius:20px; border:2px solid var(--card); padding:26px; font-size:1.3rem}
.end .big{font-size:6rem; line-height:1}
.end .stars{font-size:3.6rem; min-height:64px}
.end .row,.row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:12px}
.count{font-size:9rem; color:var(--red); line-height:1}
.timer{position:relative; height:34px; background:#F3EFE3; border:3px solid var(--ink); border-radius:999px; overflow:hidden}
.timer .bar{position:absolute; left:0; top:0; bottom:0; background:var(--green); transition:width .1s linear}
.timer .bar.late{background:var(--red)}
.timer span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.2rem}
.stage.defi{min-height:230px}
table.bilan{margin:14px auto 6px; border-collapse:collapse; font-size:1.2rem}
.bilan th,.bilan td{border:2px solid var(--card); padding:6px 16px}
.bilan th{background:#F3EFE3}
.bilan td.n{font-weight:900; text-align:center}
.errs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px}
.errs span{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:1.6rem; background:#FBEAE8; border:2px solid var(--red); border-radius:10px; padding:0 12px}
.errs s{color:var(--red); font-size:1.2rem; margin-left:6px}
.rec{font-weight:800; color:var(--purple)}

.fs{position:fixed; right:10px; bottom:10px; font-size:1rem; padding:6px 10px; border-radius:8px; border:2px solid #999; background:#fff; opacity:.75}

/* écrans bas (tablette paysage, TBI avec barre d'outils) */
@media (max-height:800px){
  h1{font-size:2rem} .tabs{margin:6px 0 8px} .tab{font-size:1.35rem; padding:4px 8px}
  .phrase{font-size:2.5rem} .phrase.xl{font-size:4rem}
  .scene{--cs:44px} .scene.m20{--cs:34px}
  .badge{font-size:3.4rem}
  svg.nl{max-width:860px}
  .pad button{font-size:2.2rem}
  .stage{padding:10px 14px; gap:8px; min-height:200px}
  .dp{min-height:84px} .dt{min-height:72px} .dp,.dt{font-size:3.4rem}
  .handbox{width:165px}
}
@media (max-width:640px){
  .phrase{font-size:2.2rem} .phrase.xl{font-size:3.4rem}
  .scene{--cs:30px} .scene.m20{--cs:22px}
  .badge{font-size:2.6rem; min-width:70px}
  .pad button{font-size:1.8rem}
  .ttl{font-size:1.2rem}
}

</head>
<body>
<div class="wrap">
  <header>
    <h1 class="hand">🧮 Calcul CP</h1>
    <span class="who">Ajouter, enlever, décomposer jusqu'à 5</span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>
</div>
<button class="fs" id="fs">⛶ plein écran</button>

<script>
/* Calcul CP — application hors connexion (un seul fichier).
   Onglets : +1/−1 et +2/−2 (file numérique + jetons, le cardinal change à chaque bond),
   décomposition jusqu'à 5 (diagramme parties/tout + doigts), petites additions jusqu'à 5,
   défi 1 minute avec bilan. */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var app = $("#app"), tabsEl = $("#tabs");
  var M = "−"; // signe moins
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- réglages mémorisés sur l'appareil ---------- */
  var OPT = { max: 10, ligne: true, jetons: true, doigts: true, zero: false, themes: { p1: true, p2: true, dec: true, add: true } };
  try { var o = JSON.parse(localStorage.getItem("calcul-cp-options") || "null"); if (o) { Object.assign(OPT, o); OPT.themes = Object.assign({ p1: true, p2: true, dec: true, add: true }, o.themes || {}); } } catch (e) {}
  function save() { try { localStorage.setItem("calcul-cp-options", JSON.stringify(OPT)); } catch (e) {} }
  function getRecord() { try { return +localStorage.getItem("calcul-cp-record") || 0; } catch (e) { return 0; } }
  function setRecord(v) { try { localStorage.setItem("calcul-cp-record", String(v)); } catch (e) {} }

  var TABS = [
    { id: "p1", kind: "line", step: 1, label: "+1 &nbsp;−1", color: "#2E6F95", title: "Ajouter 1, enlever 1",
      sub: "On avance ou on recule d'un bond sur la file numérique : le nombre de jetons change." },
    { id: "p2", kind: "line", step: 2, label: "+2 &nbsp;−2", color: "#7C5CA6", title: "Ajouter 2, enlever 2",
      sub: "Deux bonds de 1 sur la file numérique : on ajoute ou on enlève 2 jetons." },
    { id: "dec", kind: "dec", label: "Décomposer", color: "#E08A1E", title: "Décomposer les nombres jusqu'à 5",
      sub: "Dans 5, il y a 3 et 2. Les doigts peuvent aider." },
    { id: "add", kind: "add", label: "Additions", color: "#4C9A5B", title: "Petites additions jusqu'à 5",
      sub: "Les deux parties du haut sont connues : on cherche la grande quantité." },
    { id: "defi", kind: "defi", label: "⏱ Défi 1 min", color: "#D6483D", title: "Bilan : le défi 1 minute",
      sub: "Le plus de calculs justes en une minute !" }
  ];
  var THEME_NAMES = { p1: "+1 et −1", p2: "+2 et −2", dec: "Décomposer", add: "Additions" };

  var S = { tab: 0, view: "home", gen: 0, interval: null,
            qs: [], i: 0, score: 0, vals: [], k: 0, input: "", errs: 0, locked: false, t0: 0, d: null };

  function later(fn, ms) { var g = S.gen; return setTimeout(function () { if (g === S.gen) fn(); }, ms); }
  function reset() { S.gen++; if (S.interval) { clearInterval(S.interval); S.interval = null; } }
  function setColor() { document.documentElement.style.setProperty("--tc", TABS[S.tab].color); }

  /* ---------- onglets ---------- */
  function renderTabs() {
    tabsEl.innerHTML = TABS.map(function (t, n) {
      return '<button class="tab hand' + (n === S.tab ? " on" : "") + '" style="--c:' + t.color + '" data-n="' + n + '">' + t.label + "</button>";
    }).join("");
    tabsEl.querySelectorAll(".tab").forEach(function (b) { b.onclick = function () { S.tab = +b.dataset.n; home(); }; });
  }

  function chip(label, on, attr) { return '<button class="chip' + (on ? " on" : "") + '" ' + attr + ">" + label + "</button>"; }
  function modeCard(n, title, desc) { return '<button class="mode" data-m="' + n + '"><b>' + title + "</b><span>" + desc + "</span></button>"; }

  /* ---------- accueil d'un onglet ---------- */
  function home() {
    reset(); S.view = "home"; renderTabs(); setColor();
    var T = TABS[S.tab], opts = "", modes = "", extra = "";
    var maxGrp = '<div class="grp"><b>Nombres jusqu\'à</b>' + chip("10", OPT.max === 10, 'data-max="10"') + chip("20", OPT.max === 20, 'data-max="20"') + "</div>";
    if (T.kind === "line") {
      opts = maxGrp + '<div class="grp"><b>Aides</b>' + chip("📏 File numérique", OPT.ligne, 'data-tog="ligne"') + chip("🔵 Jetons", OPT.jetons, 'data-tog="jetons"') + "</div>";
      modes = modeCard(0, "Découvrir", "Au tableau : on fait les bonds ensemble et on regarde le nombre de jetons changer.") +
              modeCard(1, "S'entraîner", "10 calculs " + (T.step === 1 ? "+1 et −1" : "+2 et −2") + " avec le pavé numérique.");
    } else if (T.kind === "dec" || T.kind === "add") {
      opts = '<div class="grp"><b>Aides</b>' + chip("✋ Les doigts", OPT.doigts, 'data-tog="doigts"') + "</div>" +
             '<div class="grp"><b>Le zéro</b>' + chip("Avec le 0", OPT.zero, 'data-tog="zero"') + "</div>";
      modes = T.kind === "dec"
        ? modeCard(0, "Découvrir", "Au tableau : on choisit un nombre et on cherche toutes ses décompositions.") +
          modeCard(1, "S'entraîner", "10 décompositions : « Dans 5, il y a 3 et … ».")
        : modeCard(0, "Découvrir", "Au tableau : on choisit les deux parties, on cherche le tout.") +
          modeCard(1, "S'entraîner", "10 petites additions : on trouve la grande quantité.");
    } else {
      opts = '<div class="grp"><b>Thèmes</b>' + Object.keys(THEME_NAMES).map(function (k) {
        return chip(THEME_NAMES[k], OPT.themes[k], 'data-th="' + k + '"'); }).join("") + "</div>" + maxGrp;
      modes = modeCard(9, "▶ Lancer le défi", "1 minute pour faire le plus de calculs justes. Sans aide !");
      var r = getRecord();
      extra = '<p class="note">⭐ 5 calculs justes &nbsp; ⭐⭐ 10 &nbsp; ⭐⭐⭐ 15 et plus.<br>' +
              '<span class="rec">🏆 Record de cet appareil : ' + r + "</span>" +
              (r ? '<button class="small-btn" id="rz">remettre à zéro</button>' : "") + "</p>";
    }
    app.innerHTML = '<section class="home"><h2 class="hand">' + T.title + '</h2><p class="sub">' + T.sub + "</p>" +
                    '<div class="opts">' + opts + '</div><div class="modes">' + modes + "</div>" + extra + "</section>";
    app.querySelectorAll("[data-max]").forEach(function (b) { b.onclick = function () { OPT.max = +b.dataset.max; save(); home(); }; });
    app.querySelectorAll("[data-tog]").forEach(function (b) { b.onclick = function () { OPT[b.dataset.tog] = !OPT[b.dataset.tog]; save(); home(); }; });
    app.querySelectorAll("[data-th]").forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.th; OPT.themes[k] = !OPT.themes[k];
        if (!Object.keys(OPT.themes).some(function (x) { return OPT.themes[x]; })) OPT.themes[k] = true; // au moins un thème
        save(); home();
      };
    });
    app.querySelectorAll(".mode").forEach(function (b) { b.onclick = function () { startMode(+b.dataset.m); }; });
    var rz = $("#rz"); if (rz) rz.onclick = function () { setRecord(0); home(); };
  }

  function startMode(m) {
    var T = TABS[S.tab];
    if (m === 9) return startDefi();
    if (m === 0) { if (T.kind === "line") return discoverLine(T); if (T.kind === "dec") return discoverDec(); return discoverAdd(); }
    series(T);
  }

  function topBar(label, withProg) {
    return '<div class="top"><button class="back">⟵ Retour</button><div class="ttl hand">' + label + '</div><div class="prog" id="prog">' +
      (withProg ? progText() : "") + "</div></div>";
  }
  function progText() { return (S.i + 1) + " / " + S.qs.length + " &nbsp;⭐ " + S.score; }
  function bindTop() { var b = app.querySelector(".back"); if (b) b.onclick = home; }

  /* ---------- champs et pavé ---------- */
  function F(i) { return '<span class="fld" data-f="' + i + '">&nbsp;</span>'; }
  function updateFields() {
    app.querySelectorAll(".fld[data-f]").forEach(function (f) {
      var i = +f.dataset.f, v = S.vals[i];
      if (v) { f.className = "fld " + (v.bad ? "shown" : "ok"); f.textContent = v.v; }
      else if (i === S.k && !S.locked) { f.className = "fld act"; f.innerHTML = S.input || "&nbsp;"; }
      else { f.className = "fld"; f.innerHTML = "&nbsp;"; }
    });
  }
  function padHTML() {
    return '<div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return '<button data-d="' + d + '">' + d + "</button>"; }).join("") +
      '<button class="del" data-d="del">⌫</button><button data-d="0">0</button><button class="ok" data-d="ok">OK</button></div>';
  }
  function bindPad() { app.querySelectorAll(".pad button").forEach(function (b) { b.onclick = function () { key(b.dataset.d); }; }); }
  function setMsg(t, c) { var m = $("#msg"); if (m) { m.textContent = t || " "; m.className = "msg " + (c || ""); } }
  function shake() { var st = $("#stage"); if (!st) return; st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); }

  function key(d) {
    if ((S.view !== "series" && S.view !== "defi") || S.locked) return;
    if (d === "del") S.input = S.input.slice(0, -1);
    else if (d === "ok") return S.view === "defi" ? checkDefi() : check();
    else if (S.input.length < 2) S.input += d;
    setMsg("", ""); updateFields();
  }

  /* =====================================================================
     FILE NUMÉRIQUE + JETONS
     ===================================================================== */
  function X(i, max) { return 40 + i * 920 / max; }

  function tokensHTML(max, from, to) {
    var lo = Math.min(from, to), hi = Math.max(from, to), h = '<div class="tokzone"><div class="frames">';
    for (var f = 0; f < max / 10; f++) {
      h += '<div class="frame">';
      for (var c = f * 10; c < f * 10 + 10; c++) {
        var cls = "";
        if (c < lo) cls = "tok on"; else if (c < hi) cls = to > from ? "tok add" : "tok rem";
        h += '<div class="cell"><div class="' + cls + '" data-c="' + c + '"></div></div>';
      }
      h += "</div>";
    }
    return h + '</div><div class="badgebox"><div class="badge" id="badge">' + from + '</div><div class="bl" id="bl">' + jet(from) + "</div></div></div>";
  }
  function jet(n) { return n > 1 ? "jetons" : "jeton"; }

  function lineSVG(max, from, to, mode, clickable) {
    var Y = 130, fs = max > 10 ? 27 : 38, dir = Math.sign(to - from), n = Math.abs(to - from), k;
    var s = '<svg class="nl" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><marker id="ahp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4C9A5B"/></marker>' +
      '<marker id="ahm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D6483D"/></marker></defs>' +
      '<line class="axis" x1="18" y1="' + Y + '" x2="985" y2="' + Y + '"/>';
    for (var i = 0; i <= max; i++) {
      s += '<line class="tick" x1="' + X(i, max) + '" y1="' + (Y - 12) + '" x2="' + X(i, max) + '" y2="' + (Y + 12) + '"/>' +
           '<text class="lbl' + (i === from ? " start" : "") + (clickable ? " ck" : "") + '" data-n="' + i + '" x="' + X(i, max) + '" y="' + (Y + 50) +
           '" font-size="' + fs + '" text-anchor="middle">' + i + "</text>";
    }
    for (k = 0; k < n; k++) {
      var a = from + dir * k, b = a + dir, x1 = X(a, max), x2 = X(b, max), xm = (x1 + x2) / 2, pm = dir > 0 ? "p" : "m";
      var delay = mode === "draw" ? ' style="animation-delay:' + (k * 0.45) + 's"' : "";
      s += '<path class="hop ' + pm + (mode === "draw" ? " draw" : "") + '" data-k="' + k + '" pathLength="1" d="M' + x1 + " " + (Y - 6) + " Q" + xm + " -20 " + x2 + " " + (Y - 6) + '"' +
           (mode === "draw" ? delay : ' marker-end="url(#ah' + pm + ')"') + "/>" +
           '<text class="hopl ' + pm + (mode === "draw" ? " draw" : "") + '" x="' + xm + '" y="32" text-anchor="middle" font-size="' + (max > 10 ? 24 : 30) + '"' + delay + ">" +
           (dir > 0 ? "+1" : M + "1") + "</text>";
    }
    s += '<g id="pion" style="transform:translate(' + X(from, max) + 'px,0px)"><g class="pj"><path d="M-15 ' + (Y - 2) + " L-8 " + (Y - 34) + " L8 " + (Y - 34) + " L15 " + (Y - 2) + 'Z"/><circle cx="0" cy="' + (Y - 46) + '" r="12"/></g></g></svg>';
    return s;
  }

  function lineScene(from, to, mode, force) {
    var max = OPT.max, L = OPT.ligne, J = OPT.jetons;
    if (force && !L && !J) { L = true; J = true; }
    if (!L && !J) return "";
    return '<div class="scene' + (max > 10 ? " m20" : "") + '" data-max="' + max + '">' +
      (J ? tokensHTML(max, from, to) : "") + (L ? lineSVG(max, from, to, mode, force) : "") + "</div>";
  }

  /* anime les bonds : le pion avance, un jeton arrive ou part, le cardinal change à chaque bond */
  function playScene(sc, from, to) {
    if (!sc) return 0;
    var n = Math.abs(to - from), dir = Math.sign(to - from), max = +sc.dataset.max, STEP = 750;
    var pion = sc.querySelector("#pion"), badge = sc.querySelector("#badge"), bl = sc.querySelector("#bl");
    for (var k = 1; k <= n; k++) {
      (function (k) {
        later(function () {
          var cur = from + dir * k;
          if (pion) {
            pion.style.transform = "translate(" + X(cur, max) + "px,0px)";
            var pj = pion.firstElementChild; pj.classList.remove("jump"); void pj.getBoundingClientRect(); pj.classList.add("jump");
          }
          var arc = sc.querySelector('.hop[data-k="' + (k - 1) + '"]'); if (arc) arc.classList.add("lit");
          later(function () {
            var t = sc.querySelector('[data-c="' + (dir > 0 ? from + k - 1 : from - k) + '"]');
            if (t) t.className = dir > 0 ? "tok on new" : "tok gone";
            if (badge) { badge.textContent = cur; badge.classList.remove("pop"); void badge.offsetWidth; badge.classList.add("pop"); bl.textContent = jet(cur); }
            if (k === n) { var l = sc.querySelector('.lbl[data-n="' + to + '"]'); if (l) l.classList.add("hit"); }
          }, 380);
        }, (k - 1) * STEP);
      })(k);
    }
    return n * STEP + 400;
  }

  function genLine(step) {
    var max = OPT.max, plus = [], minus = [], n;
    for (n = 0; n <= max - step; n++) plus.push({ from: n, to: n + step });
    for (n = step; n <= max; n++) minus.push({ from: n, to: n - step });
    var list = shuffle(shuffle(plus).slice(0, 5).concat(shuffle(minus).slice(0, 5)));
    return list.map(function (o) {
      var sign = o.to > o.from ? "+" : M;
      return {
        answers: [o.to],
        view: function () { return '<div class="phrase hand">' + o.from + " " + sign + " " + step + " = " + F(0) + "</div>" + lineScene(o.from, o.to, "pre"); },
        after: function (st) { return playScene(st.querySelector(".scene"), o.from, o.to); }
      };
    });
  }

  function discoverLine(T) {
    reset(); S.view = "disc";
    var step = T.step, d = { n: Math.min(3, OPT.max), hist: [], busy: false };
    function eqStatic() { return "Il y a <b>" + d.n + "</b> " + jet(d.n) + "."; }
    function draw(from, to, mode) {
      app.innerHTML = topBar(T.label + " · Découvrir") +
        '<div class="stage" id="stage"><div class="phrase hand" id="eq">' + eqStatic() + "</div>" + lineScene(from, to, mode, true) +
        '<div class="ops"><button class="op m hand" data-d="-1">' + M + " " + step + '</button><button class="op p hand" data-d="1">+ ' + step + "</button></div>" +
        '<div class="hist" id="hist"></div><p class="hint">Touche un nombre de la file pour changer de départ.</p></div>' +
        '<div class="msg" id="msg">&nbsp;</div>';
      bindTop(); histDraw();
      app.querySelectorAll(".op").forEach(function (b) { b.onclick = function () { go(+b.dataset.d); }; });
      app.querySelectorAll(".lbl.ck").forEach(function (t) {
        t.addEventListener("click", function () { if (d.busy) return; d.n = +t.dataset.n; draw(d.n, d.n, "none"); });
      });
    }
    function histDraw() { var h = $("#hist"); if (h) h.innerHTML = d.hist.map(function (x) { return "<span>" + x + "</span>"; }).join(""); }
    function go(dir) {
      if (d.busy) return;
      var from = d.n, to = from + dir * step, sign = dir > 0 ? "+" : M;
      if (to < 0 || to > OPT.max) { setMsg(dir > 0 ? "On ne peut pas aller plus loin que " + OPT.max + " !" : "Il n'y a pas assez de jetons !", "bad"); shake(); return; }
      d.busy = true; draw(from, to, "draw");
      $("#eq").innerHTML = from + " " + sign + " " + step + ' = <span class="fld act">&nbsp;</span>';
      var sc = app.querySelector(".scene");
      later(function () { app.querySelectorAll(".hop").forEach(function (h) { h.setAttribute("marker-end", "url(#ah" + (dir > 0 ? "p" : "m") + ")"); }); }, step * 450 + 30);
      later(function () {
        var dur = playScene(sc, from, to);
        later(function () {
          d.n = to; d.hist.push(from + " " + sign + " " + step + " = " + to); if (d.hist.length > 6) d.hist.shift();
          $("#eq").innerHTML = from + " " + sign + " " + step + ' = <b class="res">' + to + "</b>";
          histDraw(); d.busy = false;
        }, dur);
      }, step * 450 + 150);
    }
    draw(d.n, d.n, "none");
  }

  /* =====================================================================
     DIAGRAMME PARTIES / TOUT + MAIN
     ===================================================================== */
  function diag(p1, p2, tot, w1, w2, sm) {
    return '<div class="diag' + (sm ? " sm" : "") + '"><div class="dtop"><div class="dp o" style="flex-grow:' + Math.max(w1, 0.8) + '">' + p1 +
      '</div><div class="dp g" style="flex-grow:' + Math.max(w2, 0.8) + '">' + p2 + '</div></div><div class="dt">' + tot + "</div></div>";
  }
  /* couleur de chaque doigt, dans l'ordre où l'on compte : pouce, index, majeur, annulaire, auriculaire
     o = orange (1re partie), g = vert (2e partie), w = levé mais blanc (partie cherchée), f = plié */
  function decCols(t, a, hide) {
    var c = [];
    for (var i = 0; i < 5; i++) {
      if (i >= t) c.push("f");
      else if (i < a) c.push(hide === "a" ? "w" : "o");
      else c.push(hide === "b" ? "w" : "g");
    }
    return c;
  }
  function handSVG(cols, click) {
    var P = { o: ["#FFD39A", "#E08A1E"], g: ["#BFEBC2", "#2F9A3F"], w: ["#FFFFFF", "#6F6656"], f: ["#DCD5C3", "#A79E88"] };
    var FG = [{ x: 54, l: 112 }, { x: 91, l: 130 }, { x: 128, l: 118 }, { x: 165, l: 94 }];
    var ck = click ? " ck" : "";
    function att(c) { var p = P[c]; return ' fill="' + p[0] + '" stroke="' + p[1] + '" stroke-width="4"' + (c === "w" ? ' stroke-dasharray="7 5"' : ""); }
    var s = '<svg class="hand-svg" viewBox="-34 0 274 326" xmlns="http://www.w3.org/2000/svg">';
    FG.forEach(function (f, j) {
      var i = j + 1, c = cols[i], up = c !== "f";
      var y = up ? 155 - f.l : 124, h = up ? f.l + 30 : 54;
      s += '<rect class="fg' + ck + '" data-i="' + i + '" x="' + f.x + '" y="' + y + '" width="34" height="' + h + '" rx="17"' + att(c) + "/>";
    });
    var c0 = cols[0], L = c0 === "f" ? 34 : 94;
    s += '<g transform="translate(68 238) rotate(-52)"><rect class="fg' + ck + '" data-i="0" x="-18" y="' + (-L) + '" width="36" height="' + (L + 30) + '" rx="18"' + att(c0) + "/></g>";
    s += '<rect x="82" y="272" width="92" height="50" rx="8" fill="#FFF3E2" stroke="#8A7A66" stroke-width="4"/>' +
         '<rect x="46" y="148" width="160" height="132" rx="40" fill="#FFF3E2" stroke="#8A7A66" stroke-width="4"/>';
    return s + "</svg>";
  }

  function decPool() {
    var pool = [], lo = OPT.zero ? 1 : 2;
    for (var t = lo; t <= 5; t++) for (var a = OPT.zero ? 0 : 1; a <= (OPT.zero ? t : t - 1); a++) pool.push({ t: t, a: a, b: t - a });
    return pool;
  }
  function addPool() {
    var pool = [], lo = OPT.zero ? 0 : 1;
    for (var a = lo; a <= 5; a++) for (var b = lo; a + b <= 5; b++) if (a + b >= 1) pool.push({ a: a, b: b });
    return pool;
  }

  function genDec() {
    return shuffle(decPool()).slice(0, 10).map(function (o) {
      var hide = Math.random() < 0.5 ? "a" : "b";
      var p1 = hide === "a" ? F(0) : o.a, p2 = hide === "b" ? F(0) : o.b;
      return {
        answers: [hide === "a" ? o.a : o.b],
        view: function () {
          return '<div class="decrow">' + diag(p1, p2, o.t, o.a, o.b) +
            (OPT.doigts ? '<div class="handbox">' + handSVG(decCols(o.t, o.a, hide)) + "</div>" : "") + "</div>" +
            '<div class="phrase hand">Dans ' + o.t + ", il y a " + p1 + " et " + p2 + ".</div>";
        },
        after: function (st) {
          var hb = st.querySelector(".handbox");
          if (hb) { hb.innerHTML = handSVG(decCols(o.t, o.a, null)); hb.classList.add("pop"); }
          return 500;
        }
      };
    });
  }

  function genAdd() {
    return shuffle(addPool()).slice(0, 10).map(function (o) {
      return {
        answers: [o.a + o.b],
        view: function () {
          return '<div class="decrow">' + diag(o.a, o.b, F(0), o.a, o.b) +
            (OPT.doigts ? '<div class="handbox">' + handSVG(decCols(o.a + o.b, o.a, null)) + "</div>" : "") + "</div>" +
            '<div class="phrase hand">' + o.a + " + " + o.b + " = " + F(0) + "</div>";
        },
        after: function (st) { var t = st.querySelector(".dt"); if (t) t.classList.add("win"); return 400; }
      };
    });
  }

  function discoverDec() {
    reset(); S.view = "disc";
    var d = { t: 5, a: 3 };
    function draw() {
      var lo = OPT.zero ? 0 : 1, hi = OPT.zero ? d.t : d.t - 1;
      d.a = Math.min(hi, Math.max(lo, d.a));
      var b = d.t - d.a, totals = OPT.zero ? [1, 2, 3, 4, 5] : [2, 3, 4, 5], ways = [];
      for (var a = lo; a <= hi; a++) ways.push(a);
      app.innerHTML = topBar("Décomposer · Découvrir") +
        '<div class="stage" id="stage"><div class="nums"><span>Le nombre :</span>' +
        totals.map(function (t) { return '<button class="numb' + (t === d.t ? " on" : "") + '" data-t="' + t + '">' + t + "</button>"; }).join("") + "</div>" +
        '<div class="decrow">' + diag(d.a, b, d.t, d.a, b) +
        '<div class="handwrap"><button class="arr" data-m="-1" aria-label="moins de doigts orange">◀</button><div class="handbox">' +
        handSVG(decCols(d.t, d.a, null), true) + '</div><button class="arr" data-m="1" aria-label="plus de doigts orange">▶</button></div></div>' +
        '<div class="phrase hand">Dans ' + d.t + ', il y a <span class="co">' + d.a + '</span> et <span class="cg">' + b + "</span>.</div>" +
        '<div class="allways"><b>Toutes les façons :</b>' +
        ways.map(function (a) { return '<button class="way' + (a === d.a ? " on" : "") + '" data-a="' + a + '">' + a + " et " + (d.t - a) + "</button>"; }).join("") +
        '</div><p class="hint">Touche un doigt ou les flèches pour changer la décomposition.</p></div>';
      bindTop();
      app.querySelectorAll(".numb").forEach(function (x) { x.onclick = function () { d.t = +x.dataset.t; d.a = Math.ceil(d.t / 2); draw(); }; });
      app.querySelectorAll(".arr").forEach(function (x) { x.onclick = function () { d.a += +x.dataset.m; draw(); }; });
      app.querySelectorAll(".way").forEach(function (x) { x.onclick = function () { d.a = +x.dataset.a; draw(); }; });
      app.querySelectorAll(".fg.ck").forEach(function (x) {
        x.addEventListener("click", function () { var i = +x.getAttribute("data-i"); if (i < d.t) { d.a = (i + 1 === d.a) ? i : i + 1; draw(); } });
      });
    }
    draw();
  }

  function discoverAdd() {
    reset(); S.view = "disc";
    var lo = OPT.zero ? 0 : 1, d = { a: 2, b: 1, shown: false };
    function draw() {
      var t = d.a + d.b;
      app.innerHTML = topBar("Additions · Découvrir") +
        '<div class="stage" id="stage"><div class="steps">' +
        '<div class="stp o"><button data-s="a" data-v="-1">−</button><b>' + d.a + '</b><button data-s="a" data-v="1">+</button></div>' +
        '<div class="stp g"><button data-s="b" data-v="-1">−</button><b>' + d.b + '</b><button data-s="b" data-v="1">+</button></div></div>' +
        '<div class="decrow">' + diag(d.a, d.b, d.shown ? t : "?", d.a, d.b) +
        (OPT.doigts ? '<div class="handbox">' + handSVG(decCols(t, d.a, null)) + "</div>" : "") + "</div>" +
        '<div class="phrase hand">' + d.a + " + " + d.b + " = " + (d.shown ? '<b class="res">' + t + "</b>" : "……") + "</div>" +
        '<button class="act main" id="show">' + (d.shown ? "Cacher le tout" : "Montrer le tout") + "</button></div>" +
        '<div class="msg" id="msg">&nbsp;</div>';
      bindTop();
      app.querySelectorAll(".stp button").forEach(function (x) {
        x.onclick = function () {
          var k = x.dataset.s, v = d[k] + +x.dataset.v, other = k === "a" ? d.b : d.a;
          if (v < lo) return;
          if (v + other > 5) { setMsg("Jusqu'à 5 seulement !", "bad"); return; }
          if (v + other < 1) return;
          d[k] = v; d.shown = false; draw();
        };
      });
      $("#show").onclick = function () { d.shown = !d.shown; draw(); };
    }
    draw();
  }

  /* =====================================================================
     SÉRIES DE 10 (moteur commun)
     ===================================================================== */
  function series(T) {
    reset(); S.view = "series";
    S.qs = T.kind === "line" ? genLine(T.step) : T.kind === "dec" ? genDec() : genAdd();
    S.i = 0; S.score = 0; S.t0 = Date.now();
    newQ();
  }
  function seriesLabel() { return TABS[S.tab].label + " · S'entraîner"; }
  function newQ() {
    S.vals = []; S.k = 0; S.input = ""; S.errs = 0; S.locked = false;
    var q = S.qs[S.i];
    app.innerHTML = topBar(seriesLabel(), true) + '<div class="stage" id="stage">' + q.view() + '</div><div class="msg" id="msg">&nbsp;</div>' + padHTML();
    bindTop(); bindPad(); updateFields();
  }
  function check() {
    if (!S.input) return;
    var q = S.qs[S.i], good = q.answers[S.k], st = $("#stage"), dur;
    if (+S.input === good) {
      S.vals[S.k] = { v: good }; S.k++; S.input = "";
      if (S.k < q.answers.length) { setMsg("Oui !", "good"); return updateFields(); }
      if (S.errs === 0) S.score++;
      S.locked = true; updateFields(); $("#prog").innerHTML = progText();
      setMsg(S.errs === 0 ? "Bravo ! ⭐" : "C'est juste !", "good");
      dur = q.after ? q.after(st) : 0;
      later(next, Math.max(1300, dur + 900));
    } else {
      S.errs++;
      if (S.errs === 1) { setMsg("Essaie encore.", "bad"); S.input = ""; updateFields(); shake(); }
      else {
        S.vals[S.k] = { v: good, bad: true }; S.k++; S.input = ""; S.locked = true; updateFields();
        setMsg("La bonne réponse est " + good + ".", "bad");
        dur = q.after ? q.after(st) : 0;
        later(next, Math.max(2200, dur + 1300));
      }
    }
  }
  function stars(score, n) { return score >= n ? "⭐⭐⭐" : score >= n * 0.7 ? "⭐⭐" : score >= n * 0.4 ? "⭐" : ""; }
  function next() {
    S.i++;
    if (S.i < S.qs.length) return newQ();
    reset(); S.view = "end";
    var sec = Math.round((Date.now() - S.t0) / 1000), n = S.qs.length;
    app.innerHTML = topBar(seriesLabel()) + '<div class="end"><div class="big hand">' + S.score + " / " + n + '</div><div class="stars">' + stars(S.score, n) + "</div>" +
      "<p>Temps : " + Math.floor(sec / 60) + " min " + (sec % 60) + " s</p>" +
      '<div class="row"><button class="act main" id="again">Recommencer</button><button class="act" id="tomenu">Retour</button></div></div>';
    bindTop();
    $("#again").onclick = function () { series(TABS[S.tab]); };
    $("#tomenu").onclick = home;
  }

  /* =====================================================================
     DÉFI 1 MINUTE + BILAN
     ===================================================================== */
  function defiQ() {
    var th = pick(S.d.themes), max = OPT.max, q, s, plus, n, t, a, b, h;
    if (th === "p1" || th === "p2") {
      s = th === "p1" ? 1 : 2; plus = Math.random() < 0.5; n = plus ? rnd(0, max - s) : rnd(s, max);
      var e = n + " " + (plus ? "+" : M) + " " + s + " = ";
      q = { th: th, ans: plus ? n + s : n - s, txt: e + (plus ? n + s : n - s), key: e,
            view: function () { return '<div class="phrase xl hand">' + e + F(0) + "</div>"; } };
    } else if (th === "dec") {
      var o = pick(decPool()); t = o.t; a = o.a; b = o.b; h = Math.random() < 0.5 ? "a" : "b";
      q = { th: th, ans: h === "a" ? a : b, txt: "Dans " + t + ", il y a " + a + " et " + b, key: "d" + t + a + h,
            view: function () { return diag(h === "a" ? F(0) : a, h === "b" ? F(0) : b, t, a, b, true); } };
    } else {
      var p = pick(addPool()); a = p.a; b = p.b;
      q = { th: th, ans: a + b, txt: a + " + " + b + " = " + (a + b), key: "a" + a + b,
            view: function () { return '<div class="phrase xl hand">' + a + " + " + b + " = " + F(0) + "</div>"; } };
    }
    return q;
  }

  function startDefi() {
    reset(); S.view = "defi-cd";
    S.d = { themes: Object.keys(OPT.themes).filter(function (k) { return OPT.themes[k]; }), score: 0, items: [], last: "" };
    var c = 3;
    function show() {
      app.innerHTML = topBar("Défi 1 minute") + '<div class="stage" id="stage"><div class="count hand">' + (c > 0 ? c : "Partez !") + "</div></div>";
      bindTop();
    }
    function tick() { c--; show(); if (c > 0) later(tick, 800); else later(runDefi, 650); }
    show(); later(tick, 800);
  }
  function runDefi() {
    S.view = "defi"; S.d.t0 = Date.now();
    S.interval = setInterval(timerTick, 100);
    nextDefi();
  }
  function nextDefi() {
    var q, tries = 0;
    do { q = defiQ(); tries++; } while (q.key === S.d.last && tries < 20);
    S.d.last = q.key; S.d.q = q;
    S.vals = []; S.k = 0; S.input = ""; S.locked = false;
    app.innerHTML = '<div class="top"><button class="back">⟵ Arrêter</button><div class="timer"><div class="bar" id="bar"></div><span id="secs"></span></div>' +
      '<div class="prog">⭐ ' + S.d.score + "</div></div>" +
      '<div class="stage defi" id="stage">' + q.view() + '</div><div class="msg" id="msg">&nbsp;</div>' + padHTML();
    bindTop(); bindPad(); updateFields(); timerTick();
  }
  function timerTick() {
    if (S.view !== "defi") return;
    var rem = Math.max(0, 60 - (Date.now() - S.d.t0) / 1000), bar = $("#bar"), secs = $("#secs");
    if (bar) { bar.style.width = (rem / 60 * 100) + "%"; bar.classList.toggle("late", rem <= 10); }
    if (secs) secs.textContent = Math.ceil(rem) + " s";
    if (rem <= 0) endDefi();
  }
  function checkDefi() {
    if (!S.input) return;
    var q = S.d.q, given = +S.input;
    S.locked = true;
    if (given === q.ans) {
      S.d.score++; S.vals[0] = { v: q.ans }; S.d.items.push({ th: q.th, ok: true });
      updateFields(); setMsg("✓ Juste !", "good"); later(nextDefi, 380);
    } else {
      S.vals[0] = { v: q.ans, bad: true }; S.d.items.push({ th: q.th, ok: false, txt: q.txt, given: given });
      updateFields(); setMsg("La bonne réponse est " + q.ans + ".", "bad"); later(nextDefi, 1200);
    }
  }
  function endDefi() {
    reset(); S.view = "defi-end";
    var D = S.d, sc = D.score, old = getRecord(), st = sc >= 15 ? "⭐⭐⭐" : sc >= 10 ? "⭐⭐" : sc >= 5 ? "⭐" : "";
    if (sc > old) setRecord(sc);
    var rows = D.themes.map(function (th) {
      var it = D.items.filter(function (x) { return x.th === th; }), ok = it.filter(function (x) { return x.ok; }).length;
      return "<tr><td>" + THEME_NAMES[th] + '</td><td class="n" style="color:var(--green)">' + ok + '</td><td class="n" style="color:var(--red)">' + (it.length - ok) + "</td></tr>";
    }).join("");
    var errs = D.items.filter(function (x) { return !x.ok; });
    app.innerHTML = topBar("Bilan du défi") + '<div class="end"><div class="big hand">' + sc + '</div><div>calcul' + (sc > 1 ? "s" : "") + " juste" + (sc > 1 ? "s" : "") + " en 1 minute</div>" +
      '<div class="stars">' + st + "</div>" +
      '<div class="rec">' + (sc > old ? "🏆 Nouveau record pour cet appareil !" : "🏆 Record de cet appareil : " + old) + "</div>" +
      '<table class="bilan"><tr><th>Thème</th><th>✓ justes</th><th>✗ erreurs</th></tr>' + rows + "</table>" +
      (errs.length ? '<div><b>À revoir :</b></div><div class="errs">' + errs.slice(0, 10).map(function (x) {
        return "<span>" + x.txt + "<s>" + x.given + "</s></span>"; }).join("") + "</div>" : '<div class="rec" style="color:var(--green)">Aucune erreur, bravo !</div>') +
      '<div class="row"><button class="act main" id="again">Rejouer</button><button class="act" id="tomenu">Retour</button></div></div>';
    bindTop();
    $("#again").onclick = startDefi;
    $("#tomenu").onclick = home;
  }

  /* ---------- clavier physique et plein écran ---------- */
  document.addEventListener("keydown", function (e) {
    if (S.view !== "series" && S.view !== "defi") return;
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); key("del"); }
    else if (e.key === "Enter") key("ok");
  });
  $("#fs").onclick = function () {
    var de = document.documentElement;
    if (!document.fullscreenElement) { if (de.requestFullscreen) { try { var p = de.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) {} } }
    else if (document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }
  };

  home();
})();
</script>
</body>
