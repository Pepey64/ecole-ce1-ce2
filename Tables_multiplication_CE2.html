:root{
  --t2:#e3f2e1;--t4:#e1ecf7;--t8:#f3e5f5;--t3:#fdebd3;--t6:#e1ecf7;--t10:#eceff1;--t9:#fff3c4;--t5:#e3f2e1;
  --red:#d32f2f;--dark:#555;--mid:#9a9a9a;--grey:#e6e6e6;--ok:#2e7d32;--pink:#f48fb1;--pinkb:#c2185b;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fafafa;color:#111;font-family:"Andika",sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 30px}
header.top{display:flex;align-items:center;gap:12px;background:var(--grey);border:1px solid var(--mid);border-radius:16px;padding:8px 16px;margin-bottom:16px}
header.top h1{font-family:"Playwrite",cursive;font-weight:400;font-size:26px;margin:0;flex:1;line-height:1.6}
.back{border:1px solid var(--mid);background:#fff;border-radius:10px;padding:6px 12px;font-size:16px;font-weight:700}
.hidden{display:none!important}
h2{font-size:19px;margin:18px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{border:2px solid #bbb;border-radius:16px;background:#fff;padding:14px;text-align:left;font-size:17px;transition:.1s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:#111;box-shadow:0 0 0 3px #111 inset}
.card .chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-block;border:1px solid var(--dark);border-radius:999px;padding:2px 10px;font-weight:700;font-size:15px}
.card .rule{color:var(--dark);font-size:14.5px}
.card b.r{color:var(--red)}
.go{display:block;margin:18px auto 0;font-size:20px;font-weight:700;background:#111;color:#fff;border:0;border-radius:14px;padding:12px 30px}
.go:disabled{opacity:.3;cursor:default}
/* jeu */
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-weight:700;font-size:17px;margin:4px 2px 10px}
.dots{display:flex;gap:5px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #999;background:#fff}
.dots span.ok{background:var(--ok);border-color:var(--ok)}
.dots span.help{background:#f0a040;border-color:#f0a040}
.dots span.cur{border-color:#111;border-width:2.5px}
.question{text-align:center;font-size:44px;font-weight:700;margin:10px 0 6px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.slot{min-width:96px;height:62px;border:2.5px solid #111;border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.slot.active{box-shadow:0 0 0 4px #ffd54f}
.slot.good{border-color:var(--ok);color:var(--ok)}
.slot.bad{border-color:var(--red);color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin:16px 0 6px}
.step{border:1.5px solid var(--dark);border-radius:12px;padding:8px 12px;font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.step .slot{min-width:70px;height:46px;font-size:24px;border-width:2px}
.arrow{display:flex;flex-direction:column;align-items:center;color:var(--red);font-weight:700;font-size:15px;min-width:70px}
.arrow svg{display:block}
.msg{text-align:center;min-height:30px;font-size:19px;margin:8px 0}
.msg.ok{color:var(--ok);font-weight:700}
.msg.hint{color:var(--red)}
.rule-line{text-align:center;color:var(--dark);font-size:16px;margin-top:2px}
.rule-line b{color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:14px auto 0}
.pad button{font-size:28px;font-weight:700;padding:12px 0;border-radius:12px;border:1.5px solid #999;background:#fff}
.pad button:active{background:#eee}
.pad .wide{grid-column:span 2;font-size:20px}
.pad .val{grid-column:span 3}
.pad .val{background:#111;color:#fff;border-color:#111}
.tools{display:flex;justify-content:center;gap:10px;margin-top:10px}
.tool{border:1px solid var(--mid);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px}
/* jetons */
.jetons{display:flex;justify-content:center;align-items:center;margin:10px 0 0}
.frame{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1.5px solid var(--dark);border-radius:9px;flex-wrap:wrap;justify-content:center}
.grp{display:inline-grid;gap:2px;padding:3px;border:1px solid var(--dark);border-radius:6px;background:#fff}
.grp i{width:9px;height:9px;border-radius:50%;background:var(--pink);border:1px solid var(--pinkb);display:block}
.grp.x{border:1.5px dashed var(--red);position:relative;opacity:.8;align-self:center}
.grp.x::after{content:"";position:absolute;inset:-3px;background:linear-gradient(to top right,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%),linear-gradient(to bottom right,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%)}
.plus{color:var(--red);font-weight:700;font-size:20px;padding:0 3px}
.cut{width:0;align-self:stretch;border-left:2.5px dashed var(--red);margin:0 3px}
.fade{opacity:.28}
.timer{font-size:22px}
.end{text-align:center}
.end .big{font-size:42px;font-weight:700;margin:6px 0}
.errs{max-width:560px;margin:10px auto;text-align:left;font-size:17px}
.errs div{padding:4px 0;border-bottom:1px solid #ddd}
.errs .c{color:var(--dark);font-size:15px}
@media (max-width:560px){header.top h1{font-size:19px}#mode-name{flex-basis:100%;font-size:15px}.pad button{font-size:24px}.question{font-size:34px}.step{font-size:19px}.step .slot{min-width:56px;height:40px;font-size:19px}.arrow{min-width:52px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="title">Les tables de multiplication</h1><button class="back hidden" id="back">⟵ Menu</button></header>

  <!-- MENU -->
  <section id="menu">
    <h2>1. Je choisis les tables</h2>
    <div class="cards" id="fams"></div>
    <h2>2. Je choisis l'activité</h2>
    <div class="cards" id="modes"></div>
    <button class="go" id="start" disabled>C'est parti !</button>
  </section>

  <!-- JEU -->
  <section id="game" class="hidden">
    <div class="bar"><span id="mode-name"></span><span class="dots" id="dots"></span><span id="right"></span></div>
    <div class="question" id="q"></div>
    <div class="rule-line" id="rule"></div>
    <div class="chain" id="chain"></div>
    <div class="jetons hidden" id="jetons"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <div class="tools"><button class="tool" id="tj">Voir les jetons</button></div>
  </section>

  <!-- FIN -->
  <section id="end" class="hidden end"></section>
</div>

<script>
"use strict";
const FAMS = [
  {id:"248", tables:[2,4,8], name:"Tables de 2, 4 et 8",
   rule:"La table de 4, c'est le <b class=r>double</b> de la table de 2.<br>La table de 8, c'est le <b class=r>double</b> de la table de 4."},
  {id:"36", tables:[3,6], name:"Tables de 3 et de 6",
   rule:"3 fois, c'est 2 fois <b class=r>plus 1 fois</b>.<br>6 fois, c'est le <b class=r>double</b> de 3 fois."},
  {id:"9", tables:[9], name:"Table de 9",
   rule:"9 fois, c'est 10 fois <b class=r>moins 1 fois</b>."},
  {id:"5", tables:[5], name:"Table de 5",
   rule:"5 fois, c'est la <b class=r>moitié</b> de 10 fois."},
  {id:"all", tables:[2,3,4,5,6,8,9], name:"Tout mélanger",
   rule:"Toutes les tables de ces leçons."},
];
const MODES = [
  {id:"guide", name:"Je comprends", desc:"Je calcule pas à pas, comme dans la leçon.", n:8},
  {id:"train", name:"Je m'entraîne", desc:"10 calculs. Si je me trompe, la leçon m'aide.", n:10},
  {id:"defi", name:"Défi 1 minute", desc:"Le plus de bonnes réponses en 1 minute.", n:0},
];
const COL = {2:"var(--t2)",3:"var(--t3)",4:"var(--t4)",5:"var(--t5)",6:"var(--t6)",8:"var(--t8)",9:"var(--t9)",10:"var(--t10)"};

/* ---------- chaînes de calcul (les conseils des leçons) ---------- */
// une étape : {t: table, op: lien depuis l'étape précédente}
function chainOf(t, b){
  const s = (tt, op) => ({t:tt, v:tt*b, op});
  switch(t){
    case 2: return [s(2,null)];
    case 4: return [s(2,null), s(4,"double")];
    case 8: return [s(2,null), s(4,"double"), s(8,"double")];
    case 3: return [s(2,null), s(3,"+ "+b)];
    case 6: return [s(2,null), s(3,"+ "+b), s(6,"double")];
    case 9: return [s(10,null), s(9,"− "+b)];
    case 5: return [s(10,null), s(5,"moitié")];
  }
}
function ruleFor(t){
  return {2:"2 fois, c'est le <b>double</b>.",4:"4 fois, c'est le <b>double</b> de 2 fois.",
    8:"8 fois, c'est le <b>double</b> de 4 fois.",3:"3 fois, c'est 2 fois <b>plus 1 fois</b>.",
    6:"6 fois, c'est le <b>double</b> de 3 fois.",9:"9 fois, c'est 10 fois <b>moins 1 fois</b>.",
    5:"5 fois, c'est la <b>moitié</b> de 10 fois."}[t];
}
function half(n){
  if(n===100) return "La moitié de 100, c'est 50.";
  const d = n/10;
  if(d%2===0) return `La moitié de ${n}, c'est ${n/2}.`;
  if(n===10) return "La moitié de 10, c'est 5.";
  return `${n} = ${n-10} + 10 → moitié de ${n-10} = ${(n-10)/2}, moitié de 10 = 5 → ${(n-10)/2} + 5 = ${n/2}.`;
}
function hintFor(step, prev, b){
  if(!step.op){
    if(step.t===2) return `2 fois le ${b}, c'est le double de ${b} : ${b} + ${b}.`;
    if(step.t===10) return `10 fois le ${b}, c'est ${b} dizaine${b>1?"s":""} : ${10*b}.`;
  }
  if(step.op==="double") return `Le double de ${prev.v}, c'est ${prev.v} + ${prev.v}.`;
  if(step.op.startsWith("+")) return `J'ajoute 1 fois le ${b} : ${prev.v} + ${b}.`;
  if(step.op.startsWith("−")) return `J'enlève 1 fois le ${b} : ${prev.v} − ${b}.`;
  if(step.op==="moitié") return half(prev.v);
  return "";
}
function chainText(t,b){
  const ch = chainOf(t,b);
  return ch.map((s,i)=> i===0 ? `${s.t} × ${b} = ${s.v}` : `${s.op} → ${s.v}`).join("  ");
}

/* ---------- jetons ---------- */
function grp(b, cls=""){
  const cols = b<=3 ? b : Math.ceil(b/2);
  let h = `<span class="grp ${cls}" style="grid-template-columns:repeat(${cols},9px)">`;
  for(let i=0;i<b;i++) h+="<i></i>";
  return h+"</span>";
}
function frame(col, inner, cls=""){ return `<span class="frame ${cls}" style="background:${col}">${inner}</span>`; }
function jetonsHTML(t, b){
  const g = grp(b);
  const f2 = frame(COL[2], g+g);
  const f3 = frame(COL[3], f2+'<span class="plus">+</span>'+g);
  switch(t){
    case 2: return f2;
    case 4: return frame(COL[4], f2+f2);
    case 8: { const f4 = frame(COL[4], f2+f2); return frame(COL[8], f4+f4); }
    case 3: return f3;
    case 6: return frame(COL[6], f3+f3);
    case 9: return frame(COL[9], g.repeat(9)) + '&nbsp;' + grp(b,"x");
    case 5: return frame(COL[10], frame(COL[5], g.repeat(5)) + '<span class="cut"></span>' + `<span class="frame fade">${g.repeat(5)}</span>`);
  }
}

/* ---------- état ---------- */
let fam=null, mode=null, st=null, timerId=null;
const $ = id => document.getElementById(id);

function buildMenu(){
  $("fams").innerHTML = FAMS.map(f=>`<button class="card" data-f="${f.id}">
     <div class="chips">${f.tables.map(t=>`<span class="chip" style="background:${COL[t]}">${t}</span>`).join("")}</div>
     <div><b>${f.name}</b></div><div class="rule">${f.rule}</div></button>`).join("");
  $("modes").innerHTML = MODES.map(m=>`<button class="card" data-m="${m.id}"><b>${m.name}</b><div class="rule">${m.desc}</div></button>`).join("");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fam=FAMS.find(f=>f.id===b.dataset.f);sel("[data-f]",b);});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=MODES.find(m=>m.id===b.dataset.m);sel("[data-m]",b);});
}
function sel(q, b){ document.querySelectorAll(q).forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); $("start").disabled=!(fam&&mode); }

function buildPad(){
  $("pad").innerHTML = ["1","2","3","4","5","6","7","8","9","0"].map(k=>`<button data-k="${k}">${k}</button>`).join("")
    + `<button class="wide" data-k="del">⌫ Effacer</button><button class="wide val" data-k="ok">Valider</button>`;
  $("pad").querySelectorAll("button").forEach(b=>b.onclick=()=>key(b.dataset.k));
}
document.addEventListener("keydown", e=>{
  if($("game").classList.contains("hidden")) return;
  if(/^[0-9]$/.test(e.key)) key(e.key);
  else if(e.key==="Backspace") key("del");
  else if(e.key==="Enter") key("ok");
});

/* ---------- tirage ---------- */
let last="";
function draw(){
  let t,b,k;
  do{
    t = fam.tables[Math.floor(Math.random()*fam.tables.length)];
    const pool=[2,3,4,5,6,7,8,9,3,4,6,7,8,9,10];
    b = pool[Math.floor(Math.random()*pool.length)];
    k=t+"x"+b;
  }while(k===last);
  last=k; return {t,b};
}

/* ---------- partie ---------- */
function start(){
  $("menu").classList.add("hidden"); $("end").classList.add("hidden");
  $("game").classList.remove("hidden"); $("back").classList.remove("hidden");
  $("mode-name").textContent = mode.name+" · "+fam.name;
  st = {i:0, n:mode.n, res:[], ok:0, errs:[], input:"", t0:0};
  if(mode.id==="defi"){ st.time=60; tick(); timerId=setInterval(tick,1000); }
  next();
}
function tick(){
  $("right").innerHTML = `<span class="timer">⏱ ${st.time} s</span>`;
  if(st.time<=0){ clearInterval(timerId); finish(); return; }
  st.time--;
}
function dots(){
  if(mode.id==="defi"){ $("dots").innerHTML = `<b>${st.ok}</b>&nbsp;bonne${st.ok>1?"s":""} réponse${st.ok>1?"s":""}`; return; }
  let h=""; for(let i=0;i<st.n;i++) h+=`<span class="${st.res[i]||""} ${i===st.i?"cur":""}"></span>`;
  $("dots").innerHTML=h; $("right").textContent = `${Math.min(st.i+1,st.n)} / ${st.n}`;
}
function next(){
  if(mode.id!=="defi" && st.i>=st.n){ finish(); return; }
  const {t,b}=draw(); st.t=t; st.b=b; st.input=""; st.help=false;
  st.chain = chainOf(t,b); st.k=0; st.phase = mode.id==="guide" ? "chain" : "direct";
  $("msg").className="msg"; $("msg").textContent="";
  $("jetons").classList.add("hidden"); $("tj").textContent="Voir les jetons";
  $("tj").classList.toggle("hidden", mode.id==="defi");
  $("jetons").innerHTML = jetonsHTML(t,b);
  render(); dots();
}
function render(){
  const {t,b}=st;
  const showChain = st.phase==="chain";
  // question
  const qv = st.phase==="direct" ? (st.input||"") : (st.phase==="done"? String(t*b):"");
  const qcls = st.phase==="direct" ? "slot active" : (st.phase==="done"?"slot good":"slot");
  $("q").innerHTML = `<span>${t} × ${b} =</span><span class="${qcls}" id="qslot">${qv}</span>`;
  $("rule").innerHTML = (showChain||st.phase==="done") ? ruleFor(t) : "";
  // chaîne
  if(showChain || (st.phase==="done" && st.chain.length>1 && (mode.id==="guide"||st.help))){
    let h="";
    st.chain.forEach((s,i)=>{
      if(i>0) h+=`<span class="arrow">${s.op}<svg width="60" height="14"><line x1="2" y1="7" x2="50" y2="7" stroke="#d32f2f" stroke-width="2.5"/><path d="M58 7 L48 1.5 L48 12.5 Z" fill="#d32f2f"/></svg></span>`;
      let v="", cls="slot";
      if(i<st.k || st.phase==="done"){ v=s.v; cls+=" good"; }
      else if(i===st.k){ v=st.input; cls+=" active"; }
      h+=`<span class="step" style="background:${COL[s.t]}">${s.t} × ${b} = <span class="${cls}" ${i===st.k?'id="cslot"':''}>${v}</span></span>`;
    });
    $("chain").innerHTML=h;
  } else $("chain").innerHTML="";
}
function key(k){
  if(st.phase==="done" || st.phase==="wait") return;
  if(k==="del"){ st.input=st.input.slice(0,-1); render(); return; }
  if(k==="ok"){ check(); return; }
  if(st.input.length<3){ st.input+=k; render(); }
}
function flashBad(id){
  const el=$(id); if(!el) return; el.classList.add("bad"); el.classList.remove("active");
}
function check(){
  if(st.input==="") return;
  const val = parseInt(st.input,10);
  const {t,b}=st;
  if(st.phase==="direct"){
    if(val===t*b){
      if(mode.id==="defi"){ st.ok++; dots(); next(); return; }
      st.res[st.i]="ok"; st.ok++; done("Bravo !");
    } else {
      if(mode.id==="defi"){ st.errs.push({t,b,v:val}); render(); flashBad("qslot"); st.phase="wait";
        setTimeout(()=>next(),600); return; }
      st.help=true; st.input=""; render(); flashBad("qslot");
      st.phase="wait";
      setTimeout(()=>{ st.phase="chain"; st.k=0; render();
        $("msg").className="msg hint"; $("msg").innerHTML="Je m'aide de la leçon : je calcule pas à pas.";}, 700);
    }
    return;
  }
  if(st.phase==="chain"){
    const s = st.chain[st.k];
    if(val===s.v){
      st.k++; st.input=""; $("msg").className="msg"; $("msg").textContent="";
      if(st.k>=st.chain.length){
        if(mode.id==="guide"){ st.res[st.i]= st.help?"help":"ok"; if(!st.help) st.ok++; }
        else st.res[st.i]="help";
        done(st.help ? `${t} × ${b} = ${t*b}` : "Bravo !");
      } else render();
    } else {
      st.help=true; st.input=""; render(); flashBad("cslot");
      $("msg").className="msg hint";
      $("msg").textContent = hintFor(s, st.chain[st.k-1], b);
    }
  }
}
function done(text){
  st.phase="done"; render(); dots();
  $("msg").className="msg ok"; $("msg").textContent=text;
  setTimeout(()=>{ st.i++; next(); }, st.help?2200:1100);
}
function finish(){
  clearInterval(timerId);
  $("game").classList.add("hidden"); const e=$("end"); e.classList.remove("hidden");
  let h="";
  if(mode.id==="defi"){
    h+=`<h2>Défi terminé !</h2><div class="big">${st.ok}</div><div>bonne${st.ok>1?"s":""} réponse${st.ok>1?"s":""} en 1 minute</div>`;
    if(st.errs.length){
      h+=`<h2>Je revois mes erreurs</h2><div class="errs">`+st.errs.map(x=>`<div><b>${x.t} × ${x.b} = ${x.t*x.b}</b> (j'avais écrit ${x.v})<div class="c">${chainText(x.t,x.b)}</div></div>`).join("")+`</div>`;
    }
  } else {
    h+=`<h2>${mode.name} : terminé !</h2><div class="big">${st.ok} / ${st.n}</div><div>réussi${st.ok>1?"s":""} du premier coup</div>`;
  }
  h+=`<button class="go" id="again">Recommencer</button>`;
  e.innerHTML=h; $("again").onclick=start;
}
function menu(){
  clearInterval(timerId);
  ["game","end"].forEach(id=>$(id).classList.add("hidden"));
  $("menu").classList.remove("hidden"); $("back").classList.add("hidden");
}
$("tj").onclick=()=>{ const j=$("jetons"); j.classList.toggle("hidden");
  $("tj").textContent = j.classList.contains("hidden")?"Voir les jetons":"Cacher les jetons"; };
$("back").onclick=menu; $("start").onclick=start;
buildMenu(); buildPad();
</script>
</body>
</html>
