<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problèmes de transformation</title>
<style>
:root{
  --ink:#1d1d1f; --paper:#fbf8f1; --red:#e3262b; --blue:#1e66d0; --blue-soft:#d9e8ff; --red2:#d62828; --red-soft:#ffe0e0;
  --ok:#1b7a2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Trebuchet MS",Verdana,Arial,sans-serif;font-size:20px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1300px;margin:0 auto;padding:14px 18px 40px}

/* ---------- en-tête ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between;border-bottom:3px solid #9a9a9a;padding-bottom:10px;margin-bottom:14px}
h1{margin:0;font-family:"Segoe Print","Comic Sans MS","Chalkboard SE",cursive;font-size:34px;color:var(--red);font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:17px}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 18px;font-weight:700}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
select{font:inherit;padding:8px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;max-width:250px}
.btn{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:8px 16px;font-weight:700}
.btn:hover{background:#f1ecdf}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-size:22px;padding:12px 26px}
.btn.primary:hover{background:#174fa6}
.prog{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:17px;color:#444}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.cur{background:#ffe27a}.dot.ok{background:#93f293}.dot.help{background:#ffd28a}

/* ---------- disposition ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-template-areas:"enonce model" "panel model";gap:16px 26px;align-items:start}
.enonce{grid-area:enonce}.panel{grid-area:panel}.modelwrap{grid-area:model;position:sticky;top:10px}
@media (max-width:920px){.grid{grid-template-columns:1fr;grid-template-areas:"enonce" "model" "panel"}.modelwrap{position:static}}

.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 20px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:center;margin-bottom:10px;font-size:17px;color:#444}
.badge{border:3px solid var(--ink);border-radius:999px;padding:2px 14px;background:#fff7d6;font-weight:700;color:var(--ink)}
.badge.empty{background:#fff;font-weight:400;color:#777;border-style:dashed}

/* ---------- phrases de l'énoncé ---------- */
.stack{display:flex;flex-direction:column;gap:12px;position:relative}
.stack.sorted{padding-left:44px}
.stack.sorted::before{content:"";position:absolute;left:12px;top:4px;bottom:26px;width:7px;border-radius:4px;background:linear-gradient(#1e66d0,#222,#d62828)}
.stack.sorted::after{content:"";position:absolute;left:3px;bottom:6px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid #d62828}
.scard{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:16px;border:5px solid;font-size:24px;line-height:1.45;background:#fff}
.scard.c-none{border-style:dashed;border-color:#9a9a9a;background:#f4f2ec}
.scard.c-blue{border-color:var(--blue);background:var(--blue-soft)}
.scard.c-white{border-color:#222;background:#fff}
.scard.c-red{border-color:var(--red2);background:var(--red-soft)}
.scard.hl{box-shadow:0 0 0 6px rgba(255,200,0,.75)}
.scard.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.stext{flex:1 1 280px}
.num{font-weight:800}
mark.nn{background:#fff0a3;border-radius:6px;padding:0 3px;color:inherit}
.tag{margin-left:auto;font-size:15px;font-weight:700;padding:1px 12px;border-radius:999px;border:3px solid;background:#fff;white-space:nowrap}
.tag.t-before{border-color:var(--blue);color:var(--blue)}
.tag.t-trans{border-color:#222;color:#222}
.tag.t-after{border-color:var(--red2);color:var(--red2)}
.pick{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:16px}
.pk{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 12px;font-weight:700;font-size:16px}
.pk i{width:20px;height:20px;border:3px solid var(--ink);border-radius:5px;display:inline-block}
.pk-before i{background:var(--blue-soft);border-color:var(--blue)}
.pk-trans i{background:#fff}
.pk-after i{background:var(--red-soft);border-color:var(--red2)}
.pk:hover{background:#fff7d6}

/* ---------- étapes ---------- */
.steps{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 12px;padding:0;list-style:none;font-size:15px}
.steps li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;border:2px solid #b9b3a4;background:#fff;color:#777}
.steps li b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#d9d3c3;color:#fff;font-size:14px}
.steps li.cur{border-color:var(--blue);color:var(--ink);font-weight:700;background:var(--blue-soft)}
.steps li.cur b{background:var(--blue)}
.steps li.done{border-color:#27b927;color:#256b25}.steps li.done b{background:#27b927}
.stephead{border-radius:16px;padding:10px 16px;margin-bottom:12px;background:var(--ink);color:#fff;font-size:23px;font-weight:700}
.stephead small{display:block;font-weight:400;font-size:17px;opacity:.93}
.stephead.lang{background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 4px}
.chip{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:12px 22px;font-size:27px;font-weight:700;min-width:84px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.chip:hover{background:#fff7d6}
.chip.sel{background:#ffe27a;transform:translateY(-3px);box-shadow:0 7px 0 rgba(0,0,0,.25)}
.chip.q{font-size:40px;padding:6px 30px;line-height:1.2}
.chip.used{opacity:.25;pointer-events:none;box-shadow:none}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0}
.bigbtn{border:5px solid;border-radius:22px;padding:18px 10px;font-size:34px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bigbtn.b{border-color:var(--blue);background:var(--blue-soft);color:#0f3f8a}
.bigbtn.r{border-color:var(--red2);background:var(--red-soft);color:#8f1515}
.bigbtn:hover{filter:brightness(.96)}
.trio{display:grid;grid-template-columns:1fr;gap:10px;margin:6px 0}
.opt{border:4px solid var(--ink);border-radius:18px;background:#fff;padding:12px 16px;font-size:22px;font-weight:700;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.opt:hover{background:#fff7d6}
.opt.tri{text-align:center;font-size:26px}
.opt.good{background:#d9f7d9;border-color:#27b927}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.rule{border:3px dashed var(--ink);border-radius:16px;padding:10px 14px;background:#fffdf5;margin:6px 0 12px;font-size:19px}
.rule div+div{margin-top:4px}
.gap{display:inline-block;min-width:130px;border-bottom:4px dotted var(--ink);text-align:center;font-weight:800;padding:0 6px}
.gap.f{border-bottom-color:#27b927;color:var(--ok)}
.rule .cur-line{background:#fff3b0;border-radius:8px}
.calcline{font-size:46px;font-weight:800;text-align:center;margin:8px 0 10px;letter-spacing:1px}
.calcline .ans{display:inline-block;min-width:130px;border-bottom:5px solid var(--ink);padding:0 10px;color:var(--blue)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center;margin:6px auto 4px}
.key{height:60px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:28px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.key:hover{background:#fff7d6}
.key.wide{background:var(--blue);border-color:var(--blue);color:#fff}
.key.back{font-size:18px}
.qrepeat{font-size:20px;color:#444;text-align:center;margin-bottom:6px}
.final{font-size:28px;text-align:center;border:4px solid #27b927;background:#e9f9ec;border-radius:18px;padding:12px;margin-top:8px;font-weight:700}
.msg{margin-top:12px;border-radius:16px;padding:12px 16px;font-size:21px;border:3px solid}
.msg.ok{background:#e9f9ec;border-color:#27b927;color:#17491f}
.msg.ko{background:#fdecea;border-color:#e57368;color:#6e1a14}
.msg.info{background:var(--blue-soft);border-color:var(--blue);color:#12306f}
.next{margin-top:14px;text-align:center}
.wait{font-size:20px;color:#444;text-align:center;padding:6px}

/* ---------- le modèle : flèche du temps ---------- */
.modelcard{padding:14px 16px 16px}
.modelcard h2{margin:0 0 8px;font-size:20px;text-align:center}
.plot{display:grid;grid-template-columns:1fr 1.1fr 1fr;height:285px;align-items:stretch}
.cwrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 8px}
.col{position:relative;width:100%;max-width:140px;border:5px solid;border-bottom:0;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;text-align:center}
.col.before{background:#9ec3ff;border-color:var(--blue)}
.col.after{background:#ffb3b3;border-color:var(--red2)}
.ghost{width:100%;max-width:140px;border:4px dashed;border-bottom:0;border-radius:12px 12px 0 0;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(0,0,0,.2) 9px 11px);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#333}
.ghost.before{border-color:var(--blue)}.ghost.after{border-color:var(--red2)}
.cnum{font-size:42px;font-weight:800;line-height:1.1}
.cnum.dots{font-size:30px;font-weight:400;color:#555;letter-spacing:2px}
.cnum.q{font-size:58px}
.cnum.res{color:#0b3a8f}
.tz{border-left:3px dashed #555;border-right:3px dashed #555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 4px;text-align:center}
.tz .ph{font-size:22px;color:#8a8a8a}
.tz .sg{font-size:54px;font-weight:800;line-height:1}
.tz .sg.gain{color:#1b7a2e}.tz .sg.loss{color:#a8321c}
.tz .tn{font-size:40px;font-weight:800;line-height:1.1}
.tz .tn.dots{font-size:28px;color:#555;font-weight:400;letter-spacing:2px}
.tz .tn.q{font-size:54px}
.tz .tn.res{color:#0b3a8f}
.axis{position:relative;height:7px;background:var(--blue);margin:0 6px 0 6px;border-radius:4px}
.axis::after{content:"";position:absolute;right:-6px;top:-9px;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:20px solid var(--blue)}
.labels{display:grid;grid-template-columns:1fr 1.1fr 1fr;text-align:center;margin-top:8px;font-size:19px;font-weight:700}
.labels .lb{color:var(--blue)}.labels .lt{color:#333}.labels .la{color:var(--red2)}
.target{cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,190,0,.8)}}
.shakez{animation:shake .4s}
@media (prefers-reduced-motion:reduce){.target{animation:none;outline:5px solid #e8a600}}
.legend{margin-top:10px;text-align:center;font-size:15px;color:#555}

.end{text-align:center;padding:26px 18px}
.end h2{font-family:"Segoe Print","Comic Sans MS",cursive;color:var(--red);font-size:38px;margin:0 0 8px}
.endlist{display:grid;gap:8px;max-width:680px;margin:16px auto;text-align:left;font-size:19px}
.endlist div{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff}
.endlist .tg{margin-left:auto;font-weight:700;font-size:16px;white-space:nowrap}
.endlist .tg.ok{color:var(--ok)}.endlist .tg.help{color:#a35a00}
</style>
</head>

 "after": "Après la partie, il y a {n} jetons dans la boîte.", "gain": "{n} jetons ont été ajoutés dans la boîte.", "loss": "{n} jetons ont été retirés de la boîte.", "qBefore": "Combien y avait-il de jetons dans la boîte avant la partie ?", "qAfter": "Combien y a-t-il de jetons dans la boîte après la partie ?", "qGain": "Combien de jetons ont été ajoutés dans la boîte ?", "qLoss": "Combien de jetons ont été retirés de la boîte ?", "aBefore": "Il y avait {n} jetons dans la boîte avant la partie.", "aAfter": "Il y a {n} jetons dans la boîte après la partie.", "aGain": "{n} jetons ont été ajoutés dans la boîte.", "aLoss": "{n} jetons ont été retirés de la boîte."}];
const TIMES=["before","trans","after"];
const TNAME={before:"avant",trans:"transformation",after:"après"};
const TCOL={before:"bleu",trans:"blanc",after:"rouge"};
const CKEY={before:"blue",trans:"white",after:"red"};
const N=6;

/* ---------- utilitaires ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fill=(t,n)=>t.replace("{n}",String(n));

/* ---------- génération ---------- */
function makeProblem(level,unknown,gl,order,ctx){
  let s,T;
  if(level==="CE1"){do{s=rnd(12,70);T=rnd(6,Math.min(40,99-s));}while(T===s||s+T>99);}
  else{do{s=rnd(120,780);T=rnd(25,Math.min(400,999-s));}while(s%100===0||T%100===0||T===s);}
  const big=s+T;
  const B=gl==="gain"?s:big, A=gl==="gain"?big:s;
  const p={ctx,unknown,gl,order,B,T,A,bigt:gl==="gain"?"after":"before"};
  p.res=p[{before:"B",trans:"T",after:"A"}[unknown]];
  p.sents=sentences(p);
  return p;
}
const numOf=(p,t)=>t==="before"?p.B:t==="after"?p.A:p.T;
function sentences(p){
  const c=p.ctx,u=p.unknown;
  const infos=TIMES.filter(t=>t!==u);
  if(p.order==="inverse")infos.reverse();
  const out=infos.map(t=>{
    const key={before:"before",after:"after",trans:p.gl}[t];
    return{t,q:false,tpl:c[key],n:numOf(p,t)};
  });
  const qk={before:"qBefore",after:"qAfter",trans:p.gl==="gain"?"qGain":"qLoss"}[u];
  out.push({t:u,q:true,tpl:c[qk],n:null});
  return out;
}
const seekOf=p=>p.unknown==="trans"?"trans":(p.unknown===p.bigt?"big":"small");
const opOf=p=>seekOf(p)==="big"?"add":"sub";
function calcOf(p){
  if(p.unknown==="trans"){const hi=Math.max(p.A,p.B),lo=Math.min(p.A,p.B);return{x:hi,sym:"−",y:lo};}
  if(seekOf(p)==="big"){return{x:p.unknown==="after"?p.B:p.A,sym:"+",y:p.T};}
  return{x:p.bigt==="after"?p.A:p.B,sym:"−",y:p.T};
}
function questionText(p){return p.sents[p.sents.length-1].tpl;}
function answerOptions(p){
  const c=p.ctx;
  const key=u=>({before:"aBefore",after:"aAfter",trans:p.gl==="gain"?"aGain":"aLoss"}[u]);
  const right=fill(c[key(p.unknown)],p.res);
  const others=[p.B,p.T,p.A].filter(v=>v!==p.res);
  const d1=fill(c[key(p.unknown)],others[rnd(0,others.length-1)]);
  const alt=TIMES.filter(t=>t!==p.unknown);
  const d2=fill(c[key(alt[rnd(0,1)])],p.res);
  return shuffle([{t:right,ok:true},{t:d1,ok:false},{t:d2,ok:false}]);
}
function makeSeries(level,seekMode,ordMode){
  const ctxs=shuffle(CTX).slice(0,N);
  let unk,gls;
  const prog=ordMode==="progressif";
  if(seekMode==="melange"){
    unk=prog?["after","after"].concat(shuffle(["trans","before","trans","before"])):shuffle(["after","trans","before","after","trans","before"]);
  }else unk=Array(N).fill(seekMode);
  gls=prog?["gain","loss"].concat(shuffle(["gain","gain","loss","loss"])):shuffle(["gain","loss","gain","loss","gain","loss"]);
  return ctxs.map((c,i)=>{
    const order=ordMode==="ordre"?"chrono":ordMode==="melange"?"inverse":(i<2?"chrono":"inverse");
    return makeProblem(level,unk[i],gls[i],order,c);
  });
}

/* ---------- état ---------- */
let S={level:"CE1",seekMode:"melange",ordMode:"progressif",screen:"play",fast:false,token:0};
function newSeries(){
  S.probs=makeSeries(S.level,S.seekMode,S.ordMode);
  S.i=0;S.results=[];S.screen="play";
  startProblem();
}
function startProblem(){
  const p=S.probs[S.i];
  S.token++;
  Object.assign(S,{p,step:1,msg:null,nounFound:false,assign:{},sorted:false,busy:false,big:null,
    placed:{before:null,trans:null,after:null},sel:null,sub:"seek",seekOk:false,opOk:false,input:"",tries:0,err:0,
    calcOk:false,phrase:null,wrongCt:{},shake:null,shakeCard:null,fx:null,ruleFilled:{},revealed:false,
    candOrder:shuffle(p.ctx.cands),numOrder:shuffle(TIMES),answers:answerOptions(p)});
}
const say=(t,h)=>{S.msg={t,h};};
const noun=()=>S.p.ctx.noun;
const D=ms=>S.fast?5:ms;

/* ---------- rendu des phrases ---------- */
function sentHTML(s){
  const parts=s.tpl.split("{n}").map(x=>{
    let h=esc(x);
    if(S.nounFound)h=h.replace(new RegExp(noun().replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"),m=>`<mark class="nn">${m}</mark>`);
    return h;
  });
  return parts.length===2?`${parts[0]}<span class="num">${s.n}</span>${parts[1]}`:parts[0];
}
function cardHTML(s){
  const t=s.t,as=S.assign[t];
  const cls=["scard",as?"c-"+CKEY[as]:"c-none"];
  if(S.sel===t&&S.step===4)cls.push("hl");
  if(S.shakeCard===t)cls.push("shake");
  const tag=as?`<span class="tag t-${as}">${TNAME[as]}</span>`:"";
  let pick="";
  if(S.step===2&&!as&&!S.busy){
    pick=`<div class="pick"><span>Cadre :</span>`+TIMES.map(c=>`<button class="pk pk-${c}" data-act="color" data-id="${t}" data-c="${c}"><i></i>${c==="before"?"avant (bleu)":c==="trans"?"transformation (blanc)":"après (rouge)"}</button>`).join("")+`</div>`;
  }
  return `<div class="${cls.join(" ")}" data-id="${t}"><div class="stext">${sentHTML(s)}</div>${tag}${pick}</div>`;
}
function enonceHTML(){
  const order=S.sorted?TIMES.map(t=>S.p.sents.find(s=>s.t===t)):S.p.sents;
  return `<div class="card">
    <div class="cardhead"><span>${S.sorted?"Les phrases, dans l'ordre du temps qui passe :":"L'énoncé :"}</span>
      <span class="badge ${S.nounFound?"":"empty"}">Quantité qui change : ${S.nounFound?esc(noun()):"........"}</span></div>
    <div class="stack${S.sorted?" sorted":""}">${order.map(cardHTML).join("")}</div></div>`;
}

/* ---------- modèle : flèche du temps ---------- */
const GEO={eq:150,big:250,small:140};
function colHTML(t){
  const p=S.p;
  let h=GEO.eq,ghost=0;
  if(S.big){h=S.big===t?GEO.big:GEO.small;ghost=S.big===t?0:GEO.big-GEO.small;}
  let inner;
  if(S.placed[t]){
    if(t===p.unknown)inner=S.calcOk?`<div class="cnum res">${p.res}</div>`:`<div class="cnum q">?</div>`;
    else inner=`<div class="cnum">${numOf(p,t)}</div>`;
  }else inner=`<div class="cnum dots">.....</div>`;
  const tg=S.step===4&&S.sel&&!S.placed[t]?" target":"";
  const sk=S.shake===t?" shakez":"";
  const g=ghost?`<div class="ghost ${t}" style="height:${ghost}px">${S.big?"transformation":""}</div>`:"";
  return `<div class="cwrap">${g}<div class="col ${t}${tg}${sk}" data-act="zone" data-z="${t}" style="height:${h}px">${inner}</div></div>`;
}
function tzHTML(){
  const p=S.p;
  const tg=S.step===4&&S.sel&&!S.placed.trans?" target":"";
  const sk=S.shake==="trans"?" shakez":"";
  let inner;
  if(!S.big){
    inner=`<div class="ph">+ ......</div><div class="ph">− ......</div>`;
  }else{
    const sign=p.gl==="gain"?"+":"−";
    let n;
    if(S.placed.trans){
      n=p.unknown==="trans"?(S.calcOk?`<div class="tn res">${p.res}</div>`:`<div class="tn q">?</div>`):`<div class="tn">${p.T}</div>`;
    }else n=`<div class="tn dots">.....</div>`;
    inner=`<div class="sg ${p.gl}">${sign}</div>${n}`;
  }
  return `<div class="tz${tg}${sk}" data-act="zone" data-z="trans">${inner}</div>`;
}
function modelHTML(){
  return `<div class="card modelcard"><h2>Le modèle : la flèche du temps</h2>
    <div class="plot">${colHTML("before")}${tzHTML()}${colHTML("after")}</div>
    <div class="axis"></div>
    <div class="labels"><span class="lb">AVANT</span><span class="lt">transformation</span><span class="la">APRÈS</span></div>
    <div class="legend">Cadre bleu : avant · cadre blanc : transformation · cadre rouge : après</div></div>`;
}

/* ---------- panneau des étapes ---------- */
function chipsHTML(items,act,sel){
  return `<div class="chips">`+items.map(it=>{
    const cls=["chip"];if(it.q)cls.push("q");if(sel===it.id)cls.push("sel");if(it.used)cls.push("used");
    return `<button class="${cls.join(" ")}" data-act="${act}" data-id="${it.id}">${it.label}</button>`;
  }).join("")+`</div>`;
}
const SEEKLAB={big:"la grande quantité",small:"la petite quantité",trans:"la transformation"};
function ruleHTML(){
  const L=[["big","une grande quantité","addition"],["small","une petite quantité","soustraction"],["trans","la transformation","soustraction"]];
  return `<div class="rule">`+L.map(([k,t,w])=>`<div class="${S.sub!=="seek"&&S.seekOk&&seekOf(S.p)===k?"cur-line":""}">Si je cherche ${t}, je fais une <span class="gap${S.ruleFilled[k]?" f":""}">${S.ruleFilled[k]?w:"&nbsp;"}</span></div>`).join("")+`</div>`;
}
function panelHTML(){
  const p=S.p;
  if(S.step===1){
    return `<div class="card"><div class="stephead lang">Étape 1 · Quelle est la quantité qui change dans le temps qui passe ?
      <small>Ce qui change, c'est ce qu'on compte. Touche le bon mot.</small></div>
      <div class="chips">${S.candOrder.map(w=>`<button class="chip" data-act="cand" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div></div>`;
  }
  if(S.step===2){
    return `<div class="card"><div class="stephead lang">Étape 2 · Colorie le cadre de chaque phrase
      <small>Bleu : avant la transformation · Blanc : la transformation · Rouge : après la transformation</small></div>
      ${S.busy?`<div class="wait">Les phrases se remettent dans l'ordre du temps qui passe…</div>`:`<div class="wait">Pour chaque phrase, touche la couleur de son cadre.</div>`}</div>`;
  }
  if(S.step===3){
    return `<div class="card"><div class="stephead lang">Étape 3 · Quand y a-t-il la plus grande quantité ?
      <small>Avant la transformation ou après ?</small></div>
      <div class="bigbtns"><button class="bigbtn b" data-act="big" data-w="before">AVANT</button><button class="bigbtn r" data-act="big" data-w="after">APRÈS</button></div></div>`;
  }
  if(S.step===4){
    const items=S.numOrder.map(t=>({id:t,label:t===p.unknown?"?":numOf(p,t),q:t===p.unknown,used:!!S.placed[t]}));
    return `<div class="card"><div class="stephead">Étape 4 · Relis l'énoncé et place les quantités
      <small>Phrase au cadre bleu → colonne bleue · cadre blanc → transformation · cadre rouge → colonne rouge. Le ? : la quantité qu'on cherche.</small></div>
      ${chipsHTML(items,"tok",S.sel)}</div>`;
  }
  if(S.step===5){
    let inner=`<div class="stephead">Étape 5 · Je cherche… et je calcule
      <small>${S.sub==="seek"?"Que cherche-t-on : où est le ? dans le modèle ?":S.sub==="op"?"Quelle opération faut-il faire ?":"Calcule le résultat."}</small></div>${ruleHTML()}`;
    if(S.sub==="seek"){
      inner+=`<div class="trio">${["big","small","trans"].map(k=>`<button class="opt tri" data-act="seek" data-v="${k}">Je cherche ${SEEKLAB[k]}</button>`).join("")}</div>`;
    }else if(S.sub==="op"){
      inner+=`<div class="qrepeat">Je cherche <b>${SEEKLAB[seekOf(p)]}</b>. Je dois faire :</div>
      <div class="row2"><button class="opt tri" data-act="op" data-v="add">une addition (+)</button><button class="opt tri" data-act="op" data-v="sub">une soustraction (−)</button></div>`;
    }else{
      const c=calcOf(p);
      inner+=`<div class="calcline">${c.x} ${c.sym} ${c.y} = <span class="ans">${esc(S.input)||"&nbsp;"}</span></div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-act="key" data-k="${d}">${d}</button>`).join("")}
        <button class="key back" data-act="back">Effacer</button><button class="key" data-act="key" data-k="0">0</button><button class="key wide" data-act="ok">OK</button></div>`;
    }
    return `<div class="card">${inner}</div>`;
  }
  if(S.step===6){
    const done=S.phrase!==null;
    let inner=`<div class="stephead lang">Étape 6 · Écris la phrase réponse<small>Je réponds avec les mots de la question.</small></div>
      <div class="qrepeat">${esc(questionText(p))}</div>`;
    if(done)inner+=`<div class="final">${esc(S.answers[S.phrase].t)}</div>`;
    else inner+=`<div class="trio">${S.answers.map((a,i)=>`<button class="opt" data-act="ans" data-i="${i}">${esc(a.t)}</button>`).join("")}</div>`;
    return `<div class="card">${inner}</div>`;
  }
  return "";
}
function stepsHTML(){
  const names=["La quantité qui change","L'ordre du temps","La plus grande quantité","Les quantités et le ?","Le calcul","La phrase réponse"];
  const fin=S.step===6&&S.phrase!==null;
  return `<ol class="steps">`+names.map((n,i)=>{
    const k=i+1;
    const cls=S.step>k||(fin&&k===6)?"done":(S.step===k?"cur":"");
    return `<li class="${cls}"><b>${k}</b>${n}</li>`;
  }).join("")+`</ol>`;
}

      <option value="ordre"${sel("ordre",S.ordMode)}>Phrases : dans l'ordre du temps</option>
      <option value="melange"${sel("melange",S.ordMode)}>Phrases : mélangées</option></select>
    <button class="btn" data-act="new">Nouvelle série</button></div></div>`;
}
function progHTML(){
  let d="";
  for(let i=0;i<N;i++){let c="dot";if(S.results[i]!==undefined)c+=S.results[i]?" ok":" help";else if(i===S.i&&S.screen==="play")c+=" cur";d+=`<span class="${c}"></span>`;}
  return `<div class="prog">Problème ${Math.min(S.i+1,N)} sur ${N} ${d}</div>`;
}
function endHTML(){
  const good=S.results.filter(Boolean).length;
  return `<div class="card end"><h2>Bravo !</h2><div>Tu as réussi ${good} problème${good>1?"s":""} sur ${N} du premier coup.</div>
    <div class="endlist">${S.probs.map((p,i)=>`<div><span>${i+1}.</span><span>${esc(p.ctx.noun)} · ${p.unknown==="trans"?"je cherche la transformation":p.unknown==="after"?"je cherche l'après":"je cherche l'avant"}</span>
      <span class="tg ${S.results[i]?"ok":"help"}">${S.results[i]?"du premier coup":"avec de l'aide"}</span></div>`).join("")}</div>
    <button class="btn primary" data-act="new">Nouvelle série</button></div>`;
}
function render(){
  const root=document.getElementById("app");
  if(S.screen==="end"){root.innerHTML=headerHTML()+progHTML()+endHTML();return;}
  root.innerHTML=headerHTML()+progHTML()+`<div class="grid"><div class="enonce">${enonceHTML()}</div>
    <div class="panel">${stepsHTML()}${panelHTML()}${msgHTML()}${nextHTML()}</div>
    <div class="modelwrap">${modelHTML()}</div></div>`;
  if(S.fx==="cols"){
    S.fx=null;
    document.querySelectorAll(".col").forEach(e=>{if(e.animate)e.animate([{height:GEO.eq+"px"},{height:e.style.height}],{duration:900,easing:"ease-in-out"});});
    document.querySelectorAll(".ghost").forEach(e=>{if(e.animate)e.animate([{opacity:0},{opacity:1}],{duration:1000,delay:500,fill:"backwards"});});
  }
}

/* ---------- animation : les phrases se remettent dans l'ordre ---------- */
function doReorder(tok){
  if(tok!==S.token)return;
  const old={};document.querySelectorAll(".scard").forEach(e=>{old[e.dataset.id]=e.getBoundingClientRect().top;});
  const before=S.p.sents.map(s=>s.t).join();
  S.sorted=true;render();
  let moved=false;
  document.querySelectorAll(".scard").forEach(e=>{
    const dy=(old[e.dataset.id]||0)-e.getBoundingClientRect().top;
    if(dy){moved=true;if(e.animate)e.animate([{transform:`translateY(${dy}px)`,zIndex:5},{transform:"translateY(0)"}],{duration:1200,easing:"cubic-bezier(.45,0,.25,1)"});}
  });
  const wait=(before!==TIMES.join()||moved)?D(1350):D(500);
  setTimeout(()=>{
    if(tok!==S.token)return;
    S.busy=false;S.step=3;
    say("ok",before!==TIMES.join()
      ?"Voilà ! Les phrases sont remises dans l'ordre du temps qui passe : d'abord le bleu, puis le blanc, puis le rouge."
      :"Les phrases étaient déjà dans l'ordre du temps qui passe : bleu, blanc, rouge.");
    render();
  },wait);
}

/* ---------- actions ---------- */
const A={
  level(el){S.level=el.dataset.v;newSeries();},
  seekMode(el){S.seekMode=el.value;newSeries();},
  ordMode(el){S.ordMode=el.value;newSeries();},
  new(){newSeries();},

  cand(el){
    const w=el.dataset.w;
    if(w===noun()){
      S.nounFound=true;S.step=2;
      say("ok",`Oui ! Ce qui change dans le temps qui passe, ce sont les <b>${esc(noun())}</b>.`);
    }else{
      S.err++;
      say("ko",`Non : on ne compte pas « ${esc(w)} ». Cherche ce qu'on compte, ce qui change au cours du temps.`);
    }
  },

  color(el){
    const id=el.dataset.id,c=el.dataset.c;
    const s=S.p.sents.find(x=>x.t===id);
    if(c===id){
      S.assign[id]=c;
      if(Object.keys(S.assign).length===3){
        S.busy=true;
        say("ok","Les trois phrases ont leur couleur. Remettons-les dans l'ordre du temps !");
        const tok=S.token;
        render();
        setTimeout(()=>doReorder(tok),D(900));
      }else say("ok",`Oui : cadre ${TCOL[c]}.`);
    }else{
      S.err++;S.shakeCard=id;
      S.wrongCt[id]=(S.wrongCt[id]||0)+1;
      if(S.wrongCt[id]<2){
        say("ko","Pas tout à fait. Cette phrase parle-t-elle de ce qu'il y avait avant, de ce qui change, ou de ce qu'il y a après ?");
      }else{
        const why={
          before:s.q?"La question demande ce qu'il y avait <b>avant</b> la transformation : cadre bleu.":"Cette phrase dit ce qu'il y avait <b>au début</b>, avant que ça change : cadre bleu.",
          trans:s.q?"La question demande <b>ce qui change</b> : cadre blanc.":`Cette phrase dit <b>ce qui change</b> : on ajoute ou on enlève des ${esc(noun())} : cadre blanc.`,
          after:s.q?"La question demande ce qu'il y a <b>après</b> la transformation : cadre rouge.":"Cette phrase dit ce qu'il y a <b>à la fin</b>, après que ça a changé : cadre rouge."
        }[id];
        say("info",why);
      }
    }
  },

  big(el){
    const w=el.dataset.w;
    if(w===S.p.bigt){
      S.big=w;S.step=4;S.fx="cols";
      say("ok",S.p.gl==="gain"
        ?`Des ${esc(noun())} s'ajoutent : la quantité augmente. La plus grande quantité est <b>après</b>.`
        :`Des ${esc(noun())} s'enlèvent : la quantité diminue. La plus grande quantité est <b>avant</b>.`);
    }else{
      S.err++;
      say("ko",`Relis la phrase au cadre blanc : on ajoute ou on enlève des ${esc(noun())} ? La quantité augmente ou diminue ?`);
    }
  },

  tok(el){const t=el.dataset.id;S.sel=S.sel===t?null:t;},
  zone(el){
    const z=el.dataset.z;
    if(S.step!==4||!S.sel||S.placed[z])return;
    S.shake=null;
    if(S.sel===z){
      S.placed[z]=z;S.sel=null;
      if(TIMES.every(t=>S.placed[t])){
        S.step=5;S.sub="seek";
        say("ok","Très bien ! Les quantités sont placées. Le point d'interrogation montre ce qu'on cherche.");
      }else say("ok","Oui, c'est bien là.");
    }else{
      S.err++;S.shake=z;
      const lab=S.sel===S.p.unknown?"la question":`le nombre <b>${numOf(S.p,S.sel)}</b>`;
      say("ko",`Relis l'énoncé : la phrase de ${lab} a un cadre <b>${TCOL[S.sel]}</b>. Où faut-il la placer ?`);
      S.sel=null;
    }
  },

  seek(el){
    const v=el.dataset.v;
    if(v===seekOf(S.p)){
      S.seekOk=true;S.sub="op";
      say("ok",`Oui : on cherche <b>${SEEKLAB[v]}</b>.`);
    }else{
      S.err++;
      say("ko","Regarde où est le ? dans le modèle : colonne la plus haute = grande quantité ; colonne la plus basse = petite quantité ; au milieu = transformation.");
    }
  },
  op(el){
    const v=el.dataset.v,k=seekOf(S.p);
    if(v===opOf(S.p)){
      S.opOk=true;S.sub="calc";S.ruleFilled[k]=true;
      say("ok",{big:"Pour trouver la grande quantité, je réunis les deux autres : je fais une <b>addition</b>.",
        small:"Pour trouver la petite quantité, j'enlève la transformation à la grande quantité : je fais une <b>soustraction</b>.",
        trans:"Pour trouver la transformation, je cherche l'écart entre la grande et la petite quantité : je fais une <b>soustraction</b>."}[k]);
    }else{
      S.err++;
      say("ko",{big:"Non. Pour trouver la grande quantité, il faut <b>réunir</b> les deux autres quantités.",
        small:"Non. Pour trouver la petite quantité, il faut <b>enlever</b> la transformation à la grande quantité.",
        trans:"Non. Pour trouver la transformation, on cherche l'<b>écart</b> entre la grande quantité et la petite quantité."}[k]);
    }
  },
  key(el){if(S.input.length<4)S.input+=el.dataset.k;},
  back(){S.input=S.input.slice(0,-1);},
  ok(){
    if(S.input==="")return;
    const c=calcOf(S.p);
    if(parseInt(S.input,10)===S.p.res){
      S.calcOk=true;S.step=6;
      say("ok",`Oui : <b>${c.x} ${c.sym} ${c.y} = ${S.p.res}</b>`);
    }else{
      S.tries++;S.err++;
      if(S.tries>=3){
        S.input=String(S.p.res);S.calcOk=true;S.step=6;S.revealed=true;
        say("info",`Le résultat est <b>${c.x} ${c.sym} ${c.y} = ${S.p.res}</b>. Refais le calcul posé ou l'arbre pour comprendre.`);
      }else{S.input="";say("ko","Ce n'est pas le bon résultat. Vérifie ton calcul et essaie encore.");}
    }
  },

  ans(el){
    const i=parseInt(el.dataset.i,10);
    if(S.answers[i].ok){S.phrase=i;say("ok","Bravo ! Ta phrase réponse reprend les mots de la question et donne le bon nombre.");}
    else{S.err++;say("ko",`Relis la question : « ${esc(questionText(S.p))} » La phrase réponse reprend les mots de la question, avec le bon nombre.`);}
  },
  next(){
    S.results[S.i]=(S.err===0);
    if(S.i>=N-1)S.screen="end";else{S.i++;startProblem();}
  }
};

/* ---------- événements ---------- */
const root=document.getElementById("app");
root.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el||el.tagName==="SELECT")return;
  if(S.busy)return;
  S.shake=null;S.shakeCard=null;
  const act=el.dataset.act;
  if(A[act]){A[act](el);render();}
});
root.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]");
  if(el&&A[el.dataset.act]){A[el.dataset.act](el);render();}
});
document.addEventListener("keydown",e=>{
  if(S.screen!=="play"||S.step!==5||S.sub!=="calc"||S.busy)return;
  if(/^[0-9]$/.test(e.key)){A.key({dataset:{k:e.key}});render();}
  else if(e.key==="Backspace"){A.back();render();}
  else if(e.key==="Enter"){A.ok();render();}
});

newSeries();render();
window.__app={S:()=>S,A,render,newSeries,CTX,calcOf,seekOf,sentences};
})();
</script>
</body>
</html>
