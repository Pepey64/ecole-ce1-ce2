<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Passé, présent, futur (CE1)</title>
<style>
/* Mise en page : menu en cartes, puis une question à la fois dans un grand panneau (TBI / tablette).
   Rouge = le verbe ; surligné jaune = les mots du temps ; violet = passé, bleu = présent, vert = futur. */
:root{
  --paper:#FAF6EA; --line:rgba(46,111,149,.16); --ink:#243B2C; --muted:#6F6A52;
  --red:#D6483D; --blue:#2E6F95; --yellow:#F2B33D; --green:#4C9A5B; --purple:#7C5CA6;
  --border:#E4DCC4;
  --pa:#7C5CA6; --pa-soft:#F1EBF8;
  --pr:#2E6F95; --pr-soft:#E4EFF6;
  --fu:#3E8A50; --fu-soft:#E6F4E8;
  --ok:#3E8A50; --ok-soft:#E7F5E8; --ko:#C2392E; --ko-soft:#FBEAE8; --hl:#FFE38A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--line) 0px,var(--line) 1px,transparent 1px,transparent 28px);
  font-family:'Nunito','Segoe UI',Verdana,sans-serif;font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.hand{font-family:'Patrick Hand','Segoe Print','Comic Sans MS','Bradley Hand',cursive}
.wrap{max-width:64rem;margin:0 auto;padding:1.25rem max(1rem,env(safe-area-inset-right,0px)) 4rem max(1rem,env(safe-area-inset-left,0px))}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
h1{margin:0;font-size:clamp(2.2rem,5vw,3rem);line-height:1;font-weight:400}
.sub{margin:.3rem 0 0;font-weight:700;color:var(--blue)}
.pill{border:0;border-radius:9999px;font-weight:800;color:#fff;padding:.55rem 1.1rem;font-size:1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;line-height:1.2}
.pill:active{transform:scale(.95)}
.pill.red{background:var(--red)} .pill.blue{background:var(--blue)} .pill.purple{background:var(--purple)} .pill.green{background:var(--green)}
.pill.ghost{background:#fff;color:var(--ink);border:2px solid var(--border);box-shadow:none}
.pill.ghost[aria-pressed="true"]{background:var(--ko-soft);border-color:var(--red);color:var(--red)}
.pill.big{font-size:1.35rem;padding:.8rem 1.7rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* Menu */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:1rem}
.card{background:#fff;border:2px solid var(--border);border-left:8px solid var(--red);border-radius:1rem;padding:1rem 1.1rem;
  text-align:left;display:flex;flex-direction:column;gap:.35rem;min-height:9.5rem;transition:transform .15s}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card.c-defi{border-left-color:var(--purple)}
.card .num{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card h2{margin:0;font-size:1.75rem;font-weight:400;line-height:1.1}
.card p{margin:0;font-size:.95rem;color:#5b5a4a}
.card .st{margin-top:auto;font-size:1.5rem;letter-spacing:.1em;color:var(--yellow)}
.st .off,.stars .off{color:#E4DCC4}
.foot-menu{margin-top:1.5rem;display:flex;justify-content:flex-end}
.tiny{font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline}

/* Barre d'exercice */
.bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.bar h2{margin:0;font-size:2rem;font-weight:400;line-height:1}
.progress{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.dot{width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;border:2px solid var(--border);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:#B7AF92}
.dot.now{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(46,111,149,.2)}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.half{background:var(--yellow);border-color:var(--yellow);color:#fff}

.panel{background:#fff;border:2px solid var(--border);border-radius:1.2rem;padding:1.25rem clamp(1rem,3vw,2rem);display:flex;flex-direction:column;gap:1.1rem}
.consigne{margin:0;font-size:1.25rem;font-weight:700}
.sentence{font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.4;text-align:center;padding:.3rem 0;font-weight:600}
.vb.show,.help-on .vb{color:var(--red);font-weight:800}
.ind{background:var(--hl);border-radius:.25em;padding:0 .15em}
.nextrow{display:flex;justify-content:center;margin-top:1.1rem;min-height:3.6rem}

/* Bacs passé / présent / futur */
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.bincol{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.bin{border:3px solid;border-radius:1rem;padding:.6rem .4rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;transition:transform .15s}
.bin:hover:not(:disabled){transform:translateY(-3px)}
.bin:disabled{cursor:default}
.bin.pa{border-color:var(--pa);background:var(--pa-soft)}
.bin.pr{border-color:var(--pr);background:var(--pr-soft)}
.bin.fu{border-color:var(--fu);background:var(--fu-soft)}
.bin .lbl{font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;font-size:2rem;line-height:1}
.bin.pa .lbl{color:var(--pa)} .bin.pr .lbl{color:var(--pr)} .bin.fu .lbl{color:var(--fu)}
.bin .hint{font-size:.85rem;color:#5b5a4a;text-align:center;line-height:1.2}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:.35rem;max-width:100%}
.bin img.p{height:96px;width:auto;min-width:0;object-fit:contain}
.bin img.ludo{height:110px}
.bin.wrongbin{opacity:.4;filter:grayscale(1)}
.bin.goodbin{box-shadow:0 0 0 5px var(--ok)}
.bin.pulse{animation:pulse 1s ease-in-out 2}
.binlist{display:flex;flex-direction:column;gap:.25rem}
.binlist span{background:#fff;border-radius:.5rem;padding:.15rem .45rem;font-size:.85rem;border:1px solid var(--border);line-height:1.3}
@media (max-width:620px){.bin img.p{height:52px}.bin img.ludo{height:60px}.bin .lbl{font-size:1.5rem}.bin .hint{display:none}}

/* Retours */
.fb{border-radius:.9rem;padding:.7rem 1rem;font-size:1.15rem;font-weight:700}
.fb.ok{background:var(--ok-soft);color:#2d6a3a}
.fb.ko{background:var(--ko-soft);color:#a3332a}
.fb.info{background:#FFF6D9;color:#6e5200}
.shake{animation:shake .35s}
.pop{animation:pop .35s ease-out}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.9);opacity:.5}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.05)}}

/* Détective : mots cliquables */
.words{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.45rem .4rem;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.3}
.w{border:2px solid var(--border);background:#fff;border-radius:.4em;padding:.05em .35em;font:inherit;font-weight:600;transition:transform .12s}
.w:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.w:disabled{cursor:default}
.w.sel{border-color:var(--blue);background:#DCEBF5;box-shadow:inset 0 -4px 0 var(--blue)}
.w.is-v{border-color:var(--red);color:var(--red);background:var(--ko-soft);font-weight:800;box-shadow:none}
.w.is-i{border-color:var(--yellow);background:var(--hl);box-shadow:none}
.w.miss{border-style:dashed;border-width:3px}
.w.wrong{text-decoration:line-through;color:#9a9a9a;border-style:dashed;background:#f6f6f6;box-shadow:none}
.punct{margin-left:-.35rem}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.95rem;font-weight:700;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.sw{width:1rem;height:1rem;border-radius:.25rem;border:3px solid}
.ask{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.ask .q{font-size:1.3rem;font-weight:800}
.tbtns{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.tbtn{border:3px solid;border-radius:9999px;padding:.45rem 1.3rem;font-size:1.5rem;font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;background:#fff}
.tbtn.pa{border-color:var(--pa);color:var(--pa)} .tbtn.pr{border-color:var(--pr);color:var(--pr)} .tbtn.fu{border-color:var(--fu);color:var(--fu)}
.tbtn.good{color:#fff} .tbtn.pa.good{background:var(--pa)} .tbtn.pr.good{background:var(--pr)} .tbtn.fu.good{background:var(--fu)}
.tbtn.bad{opacity:.4;text-decoration:line-through}
.tbtn:disabled{cursor:default}

/* Choix (transposition, bon mot) */
.choices{display:flex;flex-direction:column;gap:.7rem}
.choices.inline{flex-direction:row;flex-wrap:wrap;justify-content:center}
.choice{border:3px solid var(--border);background:#fff;border-radius:1rem;padding:.6rem 1.1rem;font-size:clamp(1.3rem,3vw,1.9rem);text-align:left;font-weight:600;transition:transform .12s}
.choice:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--ko);background:var(--ko-soft);text-decoration:line-through;color:#9a6a66}
.choice:disabled{cursor:default}
.slot{display:inline-block;min-width:5.5em;border-bottom:4px solid var(--ink);text-align:center;color:transparent}
.slot.filled{color:inherit;border-bottom-color:var(--yellow)}
.model{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:center}
.model .from{font-size:clamp(1.4rem,3.4vw,2.1rem);font-weight:600;text-align:center}
.target{display:flex;align-items:center;gap:.8rem;border:3px dashed;border-radius:1rem;padding:.5rem 1rem;font-size:1.2rem;font-weight:700}
.target img.p{height:64px;width:auto;flex:none}.target img.ludo{height:72px}
.target.pa{border-color:var(--pa);color:var(--pa)} .target.pr{border-color:var(--pr);color:var(--pr)} .target.fu{border-color:var(--fu);color:var(--fu)}
.arrow{font-size:2rem;color:var(--muted)}

/* Fin */
.end{text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center}
.end h2{margin:0;font-size:2.6rem;font-weight:400}
.stars{font-size:4rem;letter-spacing:.12em;color:var(--yellow);line-height:1}

@media (prefers-reduced-motion:reduce){.shake,.pop,.bin.pulse{animation:none}.card,.bin,.w,.choice{transition:none}}
@media print{body{background:#fff}.top .pill,.bar .row{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  /* ============ RÉGLAGES ============ */
  const CLE_ETOILES = "ppf_ce1_etoiles";

  /* ============ DONNÉES ============
     {verbe}   [mot du temps]   ! = phrase « piège » (le mot ne suffit pas, c'est le verbe qui décide) */
  const PHRASES = [
    // Passé
    ["[Hier], Léo {a joué} au football.", "pa"],
    ["[Autrefois], les enfants {écrivaient} à la plume.", "pa"],
    ["[L'an dernier], nous {étions} en CP.", "pa"],
    ["Emma {a perdu} une dent [la semaine dernière].", "pa"],
    ["[Il y a longtemps], les dinosaures {vivaient} sur la Terre.", "pa"],
    ["Le chat {a mangé} toute la soupe.", "pa"],
    ["[Avant], mon grand-père {avait} une moustache.", "pa"],
    ["[Hier soir], il {pleuvait} très fort.", "pa"],
    ["Rémi {est tombé} dans la cour.", "pa"],
    ["[Avant-hier], vous {avez visité} le musée.", "pa"],
    ["Les pirates {cachaient} leur trésor sur une île.", "pa"],
    // Présent
    ["[Aujourd'hui], nous {allons} à la piscine.", "pr"],
    ["[En ce moment], Léo {lit} une bande dessinée.", "pr"],
    ["[Maintenant], tu {es} en CE1.", "pr"],
    ["Le soleil {brille} dans le ciel.", "pr"],
    ["[Actuellement], mon cousin {habite} à Bayonne.", "pr"],
    ["[Aujourd'hui], les élèves {chantent} une chanson.", "pr"],
    ["Mon chien {aboie} [en ce moment].", "pr"],
    ["Emma {a} un nouveau vélo.", "pr"],
    ["[À présent], vous {rangez} vos affaires.", "pr"],
    ["Les poissons {nagent} dans l'aquarium.", "pr"],
    // Futur
    ["[Demain], nous {irons} au cinéma.", "fu"],
    ["[Plus tard], je {serai} pompier.", "fu"],
    ["[L'an prochain], vous {serez} en CE2.", "fu"],
    ["Léo {partira} en vacances [la semaine prochaine].", "fu"],
    ["[Bientôt], les feuilles {tomberont}.", "fu"],
    ["Il {neigera} sur la montagne.", "fu"],
    ["[Dans deux jours], tu {auras} huit ans.", "fu"],
    ["[Après-demain], Rémi {jouera} au rugby.", "fu"],
    ["Ma sœur {chantera} au spectacle.", "fu"],
    ["[Demain matin], le maître {corrigera} les cahiers.", "fu"],
    // Pièges : « ce soir », « ce matin », « dimanche »… peuvent aller avec les trois temps
    ["!Ce soir, nous {mangerons} des crêpes.", "fu"],
    ["!Ce soir, nous {mangeons} des crêpes.", "pr"],
    ["!Ce matin, Lina {a oublié} son cartable.", "pa"],
    ["!Ce matin, Lina {range} son cartable.", "pr"],
    ["!Dimanche, Papa {préparera} une paella.", "fu"],
    ["!Dimanche, Papa {a préparé} une paella.", "pa"]
  ];

  const MOTS = {
    pa: ["hier", "autrefois", "avant", "il y a longtemps", "l'an dernier", "la semaine dernière", "avant-hier", "hier soir", "il y a deux jours"],
    pr: ["aujourd'hui", "maintenant", "en ce moment", "actuellement", "à présent"],
    fu: ["demain", "plus tard", "bientôt", "l'an prochain", "la semaine prochaine", "après-demain", "dans deux jours", "demain matin"]
  };

  // Transposition : la même phrase au passé, au présent, au futur
  const TRANSPO = [
    ["j'{ai joué} au ballon", "je {joue} au ballon", "je {jouerai} au ballon"],
    ["nous {avons chanté} une chanson", "nous {chantons} une chanson", "nous {chanterons} une chanson"],
    ["Léo {était} malade", "Léo {est} malade", "Léo {sera} malade"],
    ["les enfants {avaient} faim", "les enfants {ont} faim", "les enfants {auront} faim"],
    ["tu {as rangé} ta chambre", "tu {ranges} ta chambre", "tu {rangeras} ta chambre"],
    ["Emma {est allée} à la piscine", "Emma {va} à la piscine", "Emma {ira} à la piscine"],
    ["vous {avez regardé} un film", "vous {regardez} un film", "vous {regarderez} un film"],
    ["il {faisait} beau", "il {fait} beau", "il {fera} beau"],
    ["mes parents {étaient} contents", "mes parents {sont} contents", "mes parents {seront} contents"],
    ["Rémi {a mangé} une glace", "Rémi {mange} une glace", "Rémi {mangera} une glace"],
    ["nous {avions} un chat", "nous {avons} un chat", "nous {aurons} un chat"],
    ["le bébé {a pleuré}", "le bébé {pleure}", "le bébé {pleurera}"]
  ];
  const DEBUTS = { pa: ["Hier", "La semaine dernière"], pr: ["Aujourd'hui", "En ce moment"], fu: ["Demain", "La semaine prochaine"] };

  const ORDRE = ["pa", "pr", "fu"];
  const T = {
    pa: { nom: "Passé",   au: "au passé",   q: "L'action a déjà eu lieu.",     mot: "un mot du passé" },
    pr: { nom: "Présent", au: "au présent", q: "L'action se passe maintenant.", mot: "un mot du présent" },
    fu: { nom: "Futur",   au: "au futur",   q: "L'action se passera plus tard.", mot: "un mot du futur" }
  };

  /* ============ OUTILS ============ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const app = $("#app");
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function low(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  // Découpe une phrase en jetons : v = verbe, i = mot du temps, w = mot, p = ponctuation
  function parse(s) {
    const toks = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === " ") { i++; continue; }
      if (c === "{" || c === "[") {
        const j = s.indexOf(c === "{" ? "}" : "]", i);
        toks.push({ k: c === "{" ? "v" : "i", t: s.slice(i + 1, j) }); i = j + 1; continue;
      }
      if (/[.,!?;:]/.test(c)) { toks.push({ k: "p", t: c }); i++; continue; }
      let j = i; while (j < s.length && !/[\s{}\[\].,!?;:]/.test(s[j])) j++;
      toks.push({ k: "w", t: s.slice(i, j) }); i = j;
    }
    return toks;
  }
  function toHTML(toks, opt) {
    opt = opt || {};
    return toks.map((tk, n) => {
      let t = esc(tk.t);
      if (tk.k === "v") t = `<span class="vb${opt.verb ? " show" : ""}">${t}</span>`;
      if (tk.k === "i" && opt.ind) t = `<span class="ind">${t}</span>`;
      if (tk.slot) t = `<span class="slot">${t}</span>`;
      return (n > 0 && tk.k !== "p" ? " " : "") + t;
    }).join("");
  }
  function toText(toks) { return toks.map((tk, n) => (n > 0 && tk.k !== "p" ? " " : "") + tk.t).join(""); }
  const verbeDe = toks => (toks.find(t => t.k === "v") || { t: "" }).t;

  function phraseItem(row) {
    const piege = row[0].charAt(0) === "!";
    const s = piege ? row[0].slice(1) : row[0];
    return { s, t: row[1], piege, toks: parse(s) };
  }
  const TOUTES = PHRASES.map(phraseItem);
  const NORMALES = TOUTES.filter(p => !p.piege);
  const PIEGES = TOUTES.filter(p => p.piege);
  const AVEC_MOT = NORMALES.filter(p => p.toks.some(t => t.k === "i"));
  const SANS_MOT = NORMALES.filter(p => !p.toks.some(t => t.k === "i"));

  // Ludo (bébé / en CE1 / vieux) à côté du personnage verbe du même temps
  function perso(t) {
    return `<span class="duo"><img class="p ludo" src="${IMG_LUDO[t]}" alt="" draggable="false"><img class="p" src="${IMG_VERBE[t]}" alt="" draggable="false"></span>`;
  }

  /* ============ ÉTOILES ============ */
  function lireEtoiles() { try { return JSON.parse(localStorage.getItem(CLE_ETOILES)) || {}; } catch (e) { return {}; } }
  function ecrireEtoiles(o) { try { localStorage.setItem(CLE_ETOILES, JSON.stringify(o)); } catch (e) { /* stockage indisponible */ } }
  function etoilesHTML(n) { let s = ""; for (let i = 0; i < 3; i++) s += i < n ? "★" : '<span class="off">★</span>'; return s; }

  const etat = { aide: false };
  let ses = null, minuterie = null;

  /* ============ ACTIVITÉS ============ */
  function binsHTML(withLists) {
    return `<div class="bins">${ORDRE.map(t => `
      <div class="bincol">
        <button class="bin ${t}" data-t="${t}">${perso(t)}<span class="lbl">${T[t].nom}</span><span class="hint">${T[t].q}</span></button>
        ${withLists ? `<div class="binlist" data-list="${t}">${ses.rangees[t].map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
      </div>`).join("")}</div>`;
  }

  // 1 et 3 : ranger dans le bon bac
  function rendreTri(area, item, done, mode) {
    const estPhrase = mode === "phrase";
    const listes = !ses.defi;
    area.innerHTML = `
      <p class="consigne">${estPhrase ? "Lis la phrase et trouve le verbe. Puis range la phrase : passé, présent ou futur ?" : "Ce mot du temps, il va avec le passé, le présent ou le futur ?"}</p>
      <div class="sentence ${estPhrase ? "" : "hand"}" id="snt" style="${estPhrase ? "" : "font-size:clamp(2.4rem,6vw,3.4rem)"}">${estPhrase ? toHTML(item.toks) : esc(item.w)}</div>
      <div class="fb" id="fb" hidden></div>
      ${binsHTML(listes)}`;
    const fb = $("#fb", area), snt = $("#snt", area);
    let err = 0;
    const verbe = estPhrase ? verbeDe(item.toks) : "";
    $$(".bin", area).forEach(b => b.addEventListener("click", () => {
      const t = b.dataset.t;
      fb.hidden = false;
      if (t === item.t) {
        $$(".bin", area).forEach(x => x.disabled = true);
        b.classList.add("goodbin");
        if (estPhrase) {
          $$(".vb", snt).forEach(v => v.classList.add("show"));
          snt.innerHTML = toHTML(item.toks, { verb: true, ind: true });
          let msg = `Oui ! Le verbe « ${esc(verbe)} » est ${T[t].au}.`;
          if (item.piege) msg += ` « ${esc(item.s.split(",")[0])} » ne suffit pas : c'est le verbe qui décide !`;
          fb.className = "fb ok pop"; fb.innerHTML = msg;
        } else {
          fb.className = "fb ok pop"; fb.innerHTML = `Oui ! « ${esc(item.w)} » indique le ${T[t].nom.toLowerCase()}.`;
        }
        if (listes) {
          ses.rangees[t].push(estPhrase ? toText(item.toks) : item.w);
          const l = $(`[data-list="${t}"]`, area);
          l.insertAdjacentHTML("beforeend", `<span class="pop">${esc(estPhrase ? toText(item.toks) : item.w)}</span>`);
        }
        done(err);
      } else {
        err++;
        b.disabled = true; b.classList.add("wrongbin");
        snt.classList.remove("shake"); void snt.offsetWidth; snt.classList.add("shake");
        if (estPhrase) {
          $$(".vb", snt).forEach(v => v.classList.add("show"));
          fb.className = "fb ko";
          fb.innerHTML = err === 1
            ? `Pas encore. Regarde le verbe « ${esc(verbe)} ». Essaie de dire la phrase avec « hier », « aujourd'hui » ou « demain » : qu'est-ce qui sonne juste ?`
            : `Le verbe « ${esc(verbe)} » est ${T[item.t].au} : ${T[item.t].q}`;
        } else {
          fb.className = "fb ko";
          fb.innerHTML = err === 1
            ? `Pas encore. Fais une phrase avec « ${esc(item.w)} » : est-ce avant, maintenant ou plus tard ?`
            : `« ${esc(cap(item.w))} », c'est ${T[item.t].au}. ${T[item.t].q}`;
        }
        if (err >= 2) $(`.bin[data-t="${item.t}"]`, area).classList.add("pulse");
      }
    }));
  }

  // 2 : le détective — cliquer sur le verbe et les mots du temps, puis dire le temps
  function rendreDetective(area, item, done) {
    // Chaque mot devient un bouton ; les mots d'un même groupe (verbe en 2 mots, « il y a longtemps »…) se sélectionnent ensemble
    const mots = []; let g = 0;
    item.toks.forEach(tk => {
      if (tk.k === "p") { mots.push({ p: true, t: tk.t }); return; }
      g++;
      tk.t.split(" ").forEach(m => mots.push({ t: m, g, k: tk.k }));
    });
    const aDesMots = item.toks.some(t => t.k === "i");
    area.innerHTML = `
      <p class="consigne">🔍 Clique sur le <span style="color:var(--red)">verbe</span> et sur les <span class="ind">mots du temps</span> qui t'aident à savoir quand se passe l'action. Puis appuie sur « Vérifier ».</p>
      <div class="words" id="words">${mots.map((m, n) => m.p ? `<span class="punct">${esc(m.t)}</span>` : `<button class="w" data-g="${m.g}">${esc(m.t)}</button>`).join("")}</div>
      <div class="row" style="justify-content:center"><button class="pill blue big" id="verif">Vérifier ✔</button></div>
      <div class="fb" id="fb" hidden></div>
      <div class="ask" id="ask" hidden>
        <div class="q">Alors, cette phrase est…</div>
        <div class="tbtns">${ORDRE.map(t => `<button class="tbtn ${t}" data-t="${t}">au ${T[t].nom.toLowerCase()}</button>`).join("")}</div>
      </div>`;
    const fb = $("#fb", area), sel = new Set();
    const bonnes = new Set(mots.filter(m => !m.p && m.k !== "w").map(m => String(m.g)));
    const groupeDe = gg => mots.find(m => String(m.g) === gg);
    let essais = 0, err = 0;

    $$(".w", area).forEach(b => b.addEventListener("click", () => {
      const gg = b.dataset.g;
      if (sel.has(gg)) sel.delete(gg); else sel.add(gg);
      $$(`.w[data-g="${gg}"]`, area).forEach(x => x.classList.toggle("sel", sel.has(gg)));
    }));

    function montrerCorrection() {
      $$(".w", area).forEach(b => {
        const m = groupeDe(b.dataset.g);
        b.disabled = true; b.classList.remove("sel");
        if (m.k === "v") b.classList.add("is-v");
        if (m.k === "i") b.classList.add("is-i");
        if (m.k !== "w" && !sel.has(b.dataset.g)) b.classList.add("miss");
      });
      $("#verif", area).hidden = true;
    }
    function etape2() {
      const ask = $("#ask", area); ask.hidden = false; ask.classList.add("pop");
      let err2 = 0;
      $$(".tbtn", ask).forEach(b => b.addEventListener("click", () => {
        if (b.dataset.t === item.t) {
          $$(".tbtn", ask).forEach(x => x.disabled = true);
          b.classList.add("good");
          fb.className = "fb ok pop";
          fb.innerHTML = `Bravo ! Le verbe « ${esc(verbeDe(item.toks))} » est ${T[item.t].au}.` +
            (aDesMots ? ` Les mots du temps confirment.` : ` Ici, il n'y a pas de mot du temps : seul le verbe nous renseigne !`);
          done(err + (err2 ? 1 : 0));
        } else {
          err2++; b.disabled = true; b.classList.add("bad");
          fb.className = "fb ko";
          fb.innerHTML = err2 === 1 ? `Regarde bien le verbe en rouge. Avant ? Maintenant ? Plus tard ?` : `${T[item.t].q} C'est ${T[item.t].au}.`;
        }
      }));
    }

    $("#verif", area).addEventListener("click", () => {
      const manque = [...bonnes].filter(x => !sel.has(x));
      const enTrop = [...sel].filter(x => !bonnes.has(x));
      fb.hidden = false;
      if (!manque.length && !enTrop.length) {
        montrerCorrection();
        fb.className = "fb ok pop";
        fb.innerHTML = aDesMots ? "Super détective ! Tu as trouvé le verbe et les mots du temps." : "Super détective ! Tu as trouvé le verbe.";
        etape2(); return;
      }
      essais++;
      if (essais === 1) {
        err = 1;
        enTrop.forEach(gg => { sel.delete(gg); $$(`.w[data-g="${gg}"]`, area).forEach(b => { b.classList.remove("sel"); b.classList.add("wrong"); b.disabled = true; }); });
        const msgs = [];
        enTrop.forEach(gg => {
          const txt = $$(`.w[data-g="${gg}"]`, area).map(b => b.textContent).join(" ");
          msgs.push(`« ${esc(txt)} » n'indique pas le temps.`);
        });
        const manqueVerbe = manque.some(x => groupeDe(x).k === "v");
        const manqueMot = manque.some(x => groupeDe(x).k === "i");
        if (manqueVerbe) msgs.push("Cherche le verbe : c'est le mot qui change quand on dit « hier », « aujourd'hui » ou « demain ».");
        if (manqueMot) msgs.push("Il manque un mot du temps.");
        fb.className = "fb ko"; fb.innerHTML = msgs.join(" ") + " Essaie encore !";
      } else {
        montrerCorrection();
        fb.className = "fb info";
        fb.innerHTML = `Voici la correction : le verbe est en rouge` + (aDesMots ? `, les mots du temps sont en jaune.` : `. Il n'y a pas de mot du temps dans cette phrase.`);
        etape2();
      }
    });
  }

  // 4 : changer le temps — choisir la bonne phrase
  function rendreTranspo(area, item, done) {
    const { formes, de, vers, debutDe, debutVers } = item;
    const source = parse(`${debutDe}, ${formes[ORDRE.indexOf(de)]}.`);
    const options = shuffle(ORDRE.map(t => ({ t, toks: parse(`${debutVers}, ${formes[ORDRE.indexOf(t)]}.`) })));
    area.innerHTML = `
      <p class="consigne">Change le temps de la phrase : mets-la ${T[vers].au}. Choisis la bonne phrase.</p>
      <div class="model">
        <div class="from">${toHTML(source, { verb: true, ind: true })}</div>
        <span class="arrow">➜</span>
        <div class="target ${vers}">${perso(vers)}<span>${T[vers].nom}<br><small>Commence par « ${esc(debutVers)}… »</small></span></div>
      </div>
      <div class="choices" id="ch">${options.map((o, n) => `<button class="choice" data-n="${n}">${toHTML(o.toks)}</button>`).join("")}</div>
      <div class="fb" id="fb" hidden></div>`;
    const fb = $("#fb", area); let err = 0;
    $$(".choice", area).forEach(b => b.addEventListener("click", () => {
      const o = options[+b.dataset.n];
      fb.hidden = false;
      if (o.t === vers) {
        $$(".choice", area).forEach(x => x.disabled = true);
        b.classList.add("good"); $$(".vb", b).forEach(v => v.classList.add("show"));
        fb.className = "fb ok pop";
        fb.innerHTML = `Bravo ! ${T[vers].au.charAt(0).toUpperCase() + T[vers].au.slice(1)}, le verbe « ${esc(verbeDe(source))} » devient « ${esc(verbeDe(o.toks))} ».`;
        done(err);
      } else {
        err++; b.disabled = true; b.classList.add("bad"); $$(".vb", b).forEach(v => v.classList.add("show"));
        fb.className = "fb ko";
        fb.innerHTML = `Non : le verbe « ${esc(verbeDe(o.toks))} » est ${T[o.t].au}. Avec « ${esc(debutVers)} », il faut un verbe ${T[vers].au}.`;
      }
    }));
  }

  // 5 : le bon mot du temps
  function rendreBonMot(area, item, done) {
    const toks = item.toks.map(t => Object.assign({}, t));
    const idx = toks.findIndex(t => t.k === "i");
    const bon = toks[idx].t;
    const debut = idx === 0;
    const autres = ORDRE.filter(t => t !== item.t).map(t => ({ t, w: pick(MOTS[t]) }));
    const options = shuffle([{ t: item.t, w: bon }].concat(autres.map(o => ({ t: o.t, w: debut ? cap(o.w) : low(o.w) }))));
    toks[idx] = { k: "i", t: bon, slot: true };
    area.innerHTML = `
      <p class="consigne">Quel mot du temps va avec cette phrase ? Regarde bien le verbe !</p>
      <div class="sentence" id="snt">${toHTML(toks)}</div>
      <div class="choices inline" id="ch">${options.map((o, n) => `<button class="choice hand" style="font-size:clamp(1.6rem,3.6vw,2.2rem)" data-n="${n}">${esc(o.w)}</button>`).join("")}</div>
      <div class="fb" id="fb" hidden></div>`;
    const fb = $("#fb", area), snt = $("#snt", area); let err = 0;
    const verbe = verbeDe(item.toks);
    $$(".choice", area).forEach(b => b.addEventListener("click", () => {
      const o = options[+b.dataset.n];
      fb.hidden = false;
      if (o.t === item.t) {
        $$(".choice", area).forEach(x => x.disabled = true);
        b.classList.add("good");
        const s = $(".slot", snt); s.classList.add("filled", "ind");
        $$(".vb", snt).forEach(v => v.classList.add("show"));
        fb.className = "fb ok pop";
        fb.innerHTML = `Oui ! Le verbe « ${esc(verbe)} » est ${T[item.t].au} : il faut ${T[item.t].mot}.`;
        done(err);
      } else {
        err++; b.disabled = true; b.classList.add("bad");
        $$(".vb", snt).forEach(v => v.classList.add("show"));
        snt.classList.remove("shake"); void snt.offsetWidth; snt.classList.add("shake");
        fb.className = "fb ko";
        fb.innerHTML = `« ${esc(o.w)} », c'est ${T[o.t].au}. Mais regarde le verbe « ${esc(verbe)} » : est-il au passé, au présent ou au futur ?`;
      }
    }));
  }

  /* ============ GÉNÉRATEURS ============ */
  function genTri() {
    const p = shuffle(PIEGES).slice(0, 2);
    const items = p.slice();
    ORDRE.forEach(t => {
      const deja = items.filter(x => x.t === t).length;
      items.push(...shuffle(NORMALES.filter(x => x.t === t)).slice(0, 3 - deja));
    });
    return shuffle(items).map(x => Object.assign({ type: 1 }, x));
  }
  function genDetective() {
    const a = shuffle(AVEC_MOT).slice(0, 6), b = shuffle(SANS_MOT).slice(0, 2);
    return shuffle(a.concat(b)).map(x => Object.assign({ type: 2 }, x));
  }
  function genMots() {
    const items = [];
    ORDRE.forEach(t => shuffle(MOTS[t]).slice(0, 4).forEach(w => items.push({ type: 3, w, t })));
    return shuffle(items);
  }
  function genTranspo(n) {
    return shuffle(TRANSPO).slice(0, n || 8).map(formes => {
      const de = pick(ORDRE), vers = pick(ORDRE.filter(t => t !== de));
      return { type: 4, formes, de, vers, debutDe: pick(DEBUTS[de]), debutVers: pick(DEBUTS[vers]) };
    });
  }
  function genBonMot(n) { return shuffle(AVEC_MOT).slice(0, n || 8).map(x => Object.assign({ type: 5 }, x)); }
  function genDefi() {
    const items = []
      .concat(genTri().filter(x => !x.piege).slice(0, 2), genTri().filter(x => x.piege).slice(0, 1))
      .concat(genDetective().slice(0, 2))
      .concat(genMots().slice(0, 1))
      .concat(genTranspo(2))
      .concat(genBonMot(2));
    return shuffle(items);
  }

  const EX = {
    1: { titre: "Classe les phrases", desc: "Trouve le verbe et range chaque phrase : passé, présent ou futur.", gen: genTri, rendre: (a, i, d) => rendreTri(a, i, d, "phrase"), auto: true, aide: true },
    2: { titre: "Le détective du temps", desc: "Clique sur le verbe et les mots qui disent quand se passe l'action.", gen: genDetective, rendre: rendreDetective },
    3: { titre: "Les mots du temps", desc: "Hier, demain, maintenant… Range les mots du temps.", gen: genMots, rendre: (a, i, d) => rendreTri(a, i, d, "mot"), auto: true },
    4: { titre: "Change le temps", desc: "Transforme la phrase et choisis la bonne réponse.", gen: () => genTranspo(8), rendre: rendreTranspo },
    5: { titre: "Le bon mot", desc: "Choisis le mot du temps qui va avec le verbe.", gen: () => genBonMot(8), rendre: rendreBonMot, aide: true },
    6: { titre: "Le grand défi", desc: "Un peu de tout pour vérifier que tu as bien compris !", gen: genDefi, defi: true }
  };

  /* ============ ÉCRANS ============ */
  function entete(sousTitre) {
    return `<div class="top">
      <div><h1 class="hand">⏳ Passé, présent, futur</h1><p class="sub">${sousTitre}</p></div>
    </div>`;
  }

  function menu() {
    clearTimeout(minuterie); ses = null;
    document.body.classList.remove("help-on");
    const et = lireEtoiles();
    app.innerHTML = entete("CE1 · C'est le verbe qui indique le temps de la phrase.") + `
      <div class="menu">
        ${[1, 2, 3, 4, 5, 6].map(n => `
          <button class="card ${EX[n].defi ? "c-defi" : ""}" data-go="${n}">
            <span class="num">${EX[n].defi ? "Défi" : "Activité " + n}</span>
            <h2 class="hand">${EX[n].titre}</h2><p>${EX[n].desc}</p>
            <span class="st">${etoilesHTML(et[n] || 0)}</span>
          </button>`).join("")}
      </div>
      <div class="foot-menu"><button class="tiny" id="raz">Effacer les étoiles</button></div>`;
    $$("[data-go]").forEach(b => b.addEventListener("click", () => demarrer(+b.dataset.go)));
    $("#raz").addEventListener("click", () => { ecrireEtoiles({}); menu(); });
  }

  function demarrer(n) {
    ses = { n, items: EX[n].gen(), i: 0, res: [], rangees: { pa: [], pr: [], fu: [] }, defi: !!EX[n].defi };
    question();
  }

  function pastilles() {
    return ses.items.map((_, k) => {
      let c = "";
      if (k < ses.res.length) c = ses.res[k] === 0 ? "done" : "half";
      else if (k === ses.i) c = "now";
      return `<span class="dot ${c}">${k + 1}</span>`;
    }).join("");
  }

  function question() {
    clearTimeout(minuterie);
    const it = ses.items[ses.i];
    const def = EX[it.type];
    const avecAide = !!def.aide;
    app.innerHTML = `
      <div class="bar">
        <h2 class="hand">${EX[ses.n].titre}</h2>
        <div class="row">
          ${avecAide ? `<button class="pill ghost" id="aide" aria-pressed="${etat.aide}">👁 Aide : verbe en rouge</button>` : ""}
          <button class="pill ghost" id="retour">☰ Menu</button>
        </div>
      </div>
      <div class="progress" id="prog">${pastilles()}</div>
      <div class="panel" id="area"></div>
      <div class="nextrow"><button class="pill blue big" id="suiv" hidden>Suivant ➜</button></div>`;
    document.body.classList.toggle("help-on", avecAide && etat.aide);
    $("#retour").addEventListener("click", menu);
    if (avecAide) $("#aide").addEventListener("click", e => {
      etat.aide = !etat.aide; e.currentTarget.setAttribute("aria-pressed", etat.aide);
      document.body.classList.toggle("help-on", etat.aide);
    });
    const suiv = $("#suiv");
    suiv.addEventListener("click", suivant);
    def.rendre($("#area"), it, err => {
      ses.res.push(err);
      $("#prog").innerHTML = pastilles();
      const dernier = ses.i === ses.items.length - 1;
      suiv.textContent = dernier ? "Voir mes étoiles ⭐" : "Suivant ➜";
      suiv.hidden = false;
      if (def.auto && err === 0 && !dernier) minuterie = setTimeout(suivant, 1600);
    });
    window.scrollTo({ top: 0 });
  }

  function suivant() {
    clearTimeout(minuterie);
    if (ses.i < ses.items.length - 1) { ses.i++; question(); } else fin();
  }

  function fin() {
    document.body.classList.remove("help-on");
    const total = ses.items.length;
    const parfaits = ses.res.filter(e => e === 0).length;
    const r = parfaits / total;
    const n = r >= 0.9 ? 3 : r >= 0.65 ? 2 : 1;
    const et = lireEtoiles();
    if (!et[ses.n] || n > et[ses.n]) { et[ses.n] = n; ecrireEtoiles(et); }
    const mots = { 3: "Bravo, champion du temps ! 🎉", 2: "Très bien ! Encore un petit effort. 💪", 1: "Tu progresses ! Recommence pour gagner plus d'étoiles. 💪" };
    app.innerHTML = entete(EX[ses.n].titre) + `
      <div class="panel end">
        <h2 class="hand">${mots[n]}</h2>
        <div class="stars">${etoilesHTML(n)}</div>
        <p style="margin:0;font-size:1.2rem">Réussi du premier coup : <b>${parfaits}</b> sur <b>${total}</b></p>
        <div class="row" style="justify-content:center">
          <button class="pill red big" id="rejouer">🔄 Rejouer</button>
          <button class="pill blue big" id="menu">☰ Menu</button>
        </div>
      </div>`;
    const id = ses.n;
    $("#rejouer").addEventListener("click", () => demarrer(id));
    $("#menu").addEventListener("click", menu);
  }

  menu();
})();
</script>
</body>
</html>
