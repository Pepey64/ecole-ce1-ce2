:root{--r:#d32f2f;--bl:#1565c0;--gy:#7b7b7b;--g:#2e7d32;--line:#b5b5b5}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fff;color:#111;font:clamp(18px,3.3vmin,34px)/1.3 Andika,Arial,sans-serif}
#app{max-width:1500px;margin:auto;padding:12px 16px;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}h1{font:700 clamp(36px,7vmin,60px)/1.1 Kalam,cursive;color:var(--r);text-align:center;margin:4px 0 14px}h1 small{font:700 .4em Andika;color:#555}
h2{font:700 clamp(22px,4.2vmin,38px)/1.1 Kalam,cursive;color:var(--r);margin:0;text-align:center;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.card{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:clamp(96px,19vmin,170px)}.card:hover,.card:focus-visible{border-color:var(--bl)}.card img{height:clamp(72px,14vmin,130px);width:clamp(64px,12vmin,115px);object-fit:contain;flex:none}.card span{display:flex;flex-direction:column}.card em{font-style:normal;color:#555;font-size:.85em}.card i{font-style:normal;color:#c77700;font-weight:700;min-height:1.2em;font-size:.9em}
.lec{margin:14px auto 0;background:#f4f4f4;border:2px solid var(--line);border-radius:12px;padding:8px 22px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:6px}.bar button{background:#f4f4f4;border:2px solid var(--line);border-radius:10px;padding:5px 12px;white-space:nowrap}.pg{color:#555;white-space:nowrap;min-width:5.5em;text-align:right}
.con{text-align:center;font-weight:700;margin:6px 0 10px}
.word{display:flex;align-items:center;justify-content:center;gap:24px;font-size:clamp(34px,8vmin,68px);min-height:clamp(120px,24vmin,210px);line-height:1.15;text-align:center;flex-wrap:wrap}.word img{height:clamp(110px,22vmin,190px);max-width:40%;object-fit:contain}.word.sent{font-size:clamp(26px,5.6vmin,48px)}#slot{display:inline-block;min-width:3em;border-bottom:3px dotted #777}#slot.n{border:0;min-width:0}
.d{color:var(--gy);font-weight:700}.n{color:var(--bl)!important;font-weight:700}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:8px}.ch.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.ch.one{grid-template-columns:minmax(200px,340px);justify-content:center}

const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s);
const nomH=(d,n)=>`<span class="d">${d}</span> <span class="n">${n}</span>`;
const elid=(d,n)=>nomH(d,n);
const ACT=[
 {id:'cat',t:'Que désigne ce nom ?',s:'une personne, un objet, un animal ou un lieu',img:'nom',mk:()=>shuf(D.cat).slice(0,10).map(([d,n,c,im])=>({k:'cat',d,n,c,im}))},
 {id:'oui',t:'Est-ce un nom ?',s:'je cherche ce que le mot désigne',img:'nom',mk:()=>shuf([...shuf(D.oui).slice(0,5).map(w=>({k:'oui',w,a:true})),...shuf(D.non).slice(0,5).map(w=>({k:'oui',w,a:false}))])},
 {id:'cp',t:'Nom commun ou nom propre ?',s:'un nom général ou en particulier',img:'np',mk:()=>shuf([...shuf(D.pp).slice(0,5).map(([w,g])=>({k:'cp',w,a:'p',g})),...shuf(D.nc).slice(0,5).map(w=>({k:'cp',w,a:'c'}))])},
 {id:'maj',t:'Avec ou sans majuscule ?',s:'je choisis la bonne écriture',img:'nc',mk:()=>shuf(D.maj).slice(0,10).map(([a,w,p])=>({k:'maj',a,w,p,f:D.maj_fin[a]||'.'}))},
 {id:'ph',t:'Trouve les noms dans la phrase',s:'je touche tous les noms',img:'nom',mk:()=>shuf(D.ph).slice(0,8).map(s=>({k:'ph',s}))}
];
let done={},Q=[],cur=0,act=null,first=0,total=0,errHere=false,again=[];
function home(){
 app.innerHTML=`<h1>Le nom <small>CE1</small></h1><div class="grid">${ACT.map((a,i)=>`<button class="card" data-i="${i}"><img src="${I[a.img]}" alt=""><span><b>${i+1}. ${a.t}</b><em>${a.s}</em><i>${done[a.id]?'★ '+done[a.id]:''}</i></span></button>`).join('')}</div><button class="lec" id="lec">Revoir la leçon</button>`;
 app.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(+b.dataset.i));$('#lec').onclick=lesson;
}
function lesson(){
 app.innerHTML=`${bar('Revoir la leçon')}<div class="lesson"><div class="lc"><img src="${I.nom}" alt=""><p>Un mot appartient à la famille des <b class="n">noms</b> s’il désigne :</p><div class="et4"><span>une personne</span><span>un objet</span><span>un animal</span><span>un lieu</span></div><div class="pics"><figure><img src="${I.enfant}" alt=""><b class="n">enfant</b></figure><figure><img src="${I.sac}" alt=""><b class="n">sac</b></figure><figure><img src="${I.loup}" alt=""><b class="n">loup</b></figure><figure><img src="${I.foret}" alt=""><b class="n">forêt</b></figure></div></div>
 <div class="lc two"><div><img src="${I.nc}" alt=""><p><b>Un nom commun</b> convient à toutes les personnes, à tous les animaux, à toutes les choses de la même sorte. C’est un nom général.</p><p class="big n">chat, ville, fille</p></div><div><img src="${I.np}" alt=""><p><b>Un nom propre</b> désigne une personne, un animal, une chose, un lieu <i>en particulier</i>. Il commence par une <b>lettre majuscule</b>.</p><p class="big n">Mistigri, Paris, Lilou</p></div></div></div>`;
 $('#back').onclick=home;
}
function bar(t,p){return `<div class="bar"><button id="back">◀ Menu</button><h2>${t}</h2><span class="pg">${p||''}</span></div>`}
function start(i){act=ACT[i];Q=act.mk();total=Q.length;cur=0;first=0;again=[];show()}
function show(){
 if(cur>=Q.length){if(again.length){Q=again;again=[];cur=0;return show()}return end()}
 errHere=false;const q=Q[cur];
 const left=Q.length-cur+again.length;
 app.innerHTML=bar(act.t,`encore ${left}`)+`<div id="q"></div><div id="fb" aria-live="polite"></div><div id="nx"></div>`;$('#back').onclick=home;
 ({cat:qCat,oui:qOui,cp:qCp,maj:qMaj,ph:qPh})[q.k](q,$('#q'));
}
function ok(q,msg){
 if(!q.miss)first++;
 $('#fb').className='fb good';$('#fb').innerHTML='Bravo ! '+msg;
 app.querySelectorAll('#q button').forEach(b=>b.disabled=true);
 $('#nx').innerHTML='<button id="next">Suivant ▶</button>';$('#next').onclick=()=>{cur++;show()};$('#next').focus();
}
function bad(q,msg){
 if(!errHere){errHere=true;if(!q.miss){q.miss=true}again.push(q)}
 $('#fb').className='fb bad';$('#fb').innerHTML=msg;
}
function choices(el,opts,fn){const w=document.createElement('div');w.className='ch';opts.forEach(([v,h])=>{const b=document.createElement('button');b.className='opt';b.innerHTML=h;b.onclick=()=>fn(v,b);w.append(b)});el.append(w)}
const CATS={personne:'une personne',objet:'un objet',animal:'un animal',lieu:'un lieu'};
function qCat(q,el){
 el.innerHTML=`<p class="con">Que désigne ce nom ?</p><div class="word">${q.im?`<img src="${I[q.im]}" alt="">`:''}<div>${nomH(q.d,q.n)}</div></div>`;
 choices(el,['personne','objet','animal','lieu'].map(c=>[c,CATS[c]]),(v,b)=>{if(v===q.c){b.classList.add('right');ok(q,`« ${q.d} ${q.n} » désigne ${CATS[q.c]}.`)}else{b.classList.add('wrong');b.disabled=true;bad(q,`Non, ce n’est pas ${CATS[v]}. Cherche encore.`)}});
}
function qOui(q,el){
 el.innerHTML=`<p class="con">Ce mot désigne-t-il une personne, un objet, un animal ou un lieu ?</p><div class="word"><div class="plain">${q.w}</div></div>`;
 choices(el,[[true,'Oui, c’est un nom'],[false,'Non, ce n’est pas un nom']],(v,b)=>{if(v===q.a){b.classList.add('right');if(q.a)$('.plain').classList.add('n');ok(q,q.a?`« ${q.w} » désigne quelque chose : c’est un nom.`:`« ${q.w} » ne désigne pas une personne, un objet, un animal ou un lieu.`)}else{b.classList.add('wrong');b.disabled=true;bad(q,q.a?`Regarde bien : « ${q.w} » désigne une personne, un objet, un animal ou un lieu.`:`Peux-tu montrer « ${q.w} » comme une personne, un objet, un animal ou un lieu ?`)}});
}
function qCp(q,el){
 el.innerHTML=`<p class="con">Quel nom est-ce ?</p><div class="word"><div class="n">${q.w}</div></div>`;
 choices(el,[['c',`<img src="${I.nc}" alt=""><span>Nom commun</span>`],['p',`<img src="${I.np}" alt=""><span>Nom propre</span>`]],(v,b)=>{if(v===q.a){b.classList.add('right');ok(q,q.a==='p'?`« ${q.w} » est ${q.g} en particulier. Il commence par une majuscule.`:`« ${q.w} » est un nom général, sans majuscule.`)}else{b.classList.add('wrong');b.disabled=true;bad(q,q.a==='p'?`« ${q.w} » commence par une majuscule. Il désigne quelque chose en particulier.`:`« ${q.w} » convient à tous ceux de la même sorte. C’est un nom général.`)}});
 el.querySelector('.ch').classList.add('two');
}
function qMaj(q,el){
 const lo=q.w[0].toLowerCase()+q.w.slice(1),up=q.w[0].toUpperCase()+q.w.slice(1);
 el.innerHTML=`<p class="con">Quelle écriture est correcte ?</p><div class="word sent">${q.a}<span id="slot">……</span>${q.f}</div>`;
 choices(el,shuf([[up,up],[lo,lo]]),(v,b)=>{if(v===q.w){b.classList.add('right');$('#slot').textContent=q.w;$('#slot').className='n';ok(q,q.p?`« ${q.w} » est un nom propre : il prend une majuscule.`:`« ${q.w} » est un nom commun : pas de majuscule.`)}else{b.classList.add('wrong');b.disabled=true;bad(q,q.p?'Ce nom désigne quelqu’un ou un lieu en particulier. Regarde la première lettre.':'C’est un nom général. Il n’a pas besoin de majuscule ici.')}});
 el.querySelector('.ch').classList.add('two');
}
function qPh(q,el){
 const parts=q.s.split('|'),toks=[];
 parts.forEach(p=>{if(p[0]==='*')toks.push({t:p.slice(1),n:true});else{const m=p.match(/[^\s]+\s*|\s+/g)||[];m.forEach(x=>toks.push({t:x,n:false,punct:/^[.\s]+$/.test(x)}))}});
 el.innerHTML=`<p class="con">Touche tous les noms de la phrase, puis clique sur « J’ai fini ».</p><div class="sentence"></div><div class="ch one"><button class="opt" id="val">J’ai fini</button></div>`;
 const s=$('.sentence',el);
 toks.forEach(k=>{if(k.punct){s.append(k.t);return}const b=document.createElement('button');b.className='tok';b.textContent=k.t.trim();k.b=b;if(/\s$/.test(k.t))b.dataset.sp=1;b.onclick=()=>{b.classList.toggle('sel');b.classList.remove('miss','wrong')};s.append(b);if(b.dataset.sp)s.append(' ')});
 $('#val').onclick=()=>{let w=0,m=0;toks.forEach(k=>{if(!k.b)return;const sel=k.b.classList.contains('sel');if(sel&&!k.n){k.b.classList.add('wrong');w++}if(!sel&&k.n)m++});
  if(!w&&!m){ok(q,'Tu as trouvé tous les noms.');toks.forEach(k=>k.b&&(k.b.disabled=true))}
  else bad(q,w?(w>1?'Les mots en rouge ne sont pas des noms.':'Le mot en rouge n’est pas un nom.')+(m?' Et il manque encore un nom.':''):(m>1?`Il manque encore ${m} noms.`:'Il manque encore un nom.'))};
}
function end(){
 done[act.id]=`${first} / ${total}`;
 const st=first===total?'★★★':first>=total*.7?'★★':'★';
 app.innerHTML=bar(act.t)+`<div class="end"><img src="${I.nom}" alt=""><div class="stars">${st}</div><p>${first} réussites du premier coup sur ${total}.</p><div class="ch two"><button class="opt" id="re">Recommencer</button><button class="opt" id="me">Retour au menu</button></div></div>`;
 $('#back').onclick=home;$('#re').onclick=()=>start(ACT.indexOf(act));$('#me').onclick=home;
}
home();
</script></body></html>
