<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les dizaines entières – CE1</title><style>*{box-sizing:border-box}
body{margin:0;font-family:"Andika","Comic Sans MS","Trebuchet MS",sans-serif;background:#f4f1ea;color:#222}
#app{max-width:1100px;margin:0 auto;padding:14px 18px 30px;min-height:100vh}
header{text-align:center;margin:10px 0 18px}
h1{font-size:44px;margin:6px 0}
.sub{font-size:22px;color:#555;margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:10px}
button{font-family:inherit;cursor:pointer}
.mode{background:#fff;border:3px solid #333;border-radius:18px;padding:22px 16px;text-align:left;font-size:20px;box-shadow:0 4px 0 #333}
.mode b{display:block;font-size:28px;margin-bottom:6px}
.mode span{color:#555}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 #333}
.settings{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:0 0 18px;font-size:22px}
.settings .grp{background:#fff;border:2px solid #bbb;border-radius:14px;padding:10px 14px}
.settings .grp b{margin-right:8px}
.tog{font-size:20px;padding:8px 14px;margin:2px;border-radius:10px;border:2px solid #888;background:#eee}
.tog.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.top .ttl{text-align:center;font-size:28px;font-weight:bold}
.back{font-size:20px;padding:8px 14px;border-radius:10px;border:2px solid #333;background:#fff}
.prog{font-size:24px;font-weight:bold}
.stage{background:#fff;border-radius:20px;border:2px solid #ddd;padding:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.phrase{font-size:40px;text-align:center;line-height:1.5}
.fld{display:inline-block;min-width:80px;padding:0 10px;border-bottom:4px dotted #999;text-align:center;color:#999}
.fld.act{border:4px solid #2b6cb0;border-radius:10px;color:#2b6cb0;background:#eaf2fb;font-weight:bold}
.fld.ok{color:#1d7a1d;font-weight:bold;border-bottom:4px solid #1d7a1d}
.fld.shown{color:#c0392b;font-weight:bold;border-bottom:4px solid #c0392b}
.msg{text-align:center;font-size:32px;font-weight:bold;height:46px;margin:10px 0}
.msg.good{color:#1d7a1d}.msg.bad{color:#c0392b}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:760px;margin:0 auto}
.pad button{font-size:40px;padding:12px 0;border-radius:14px;border:3px solid #333;background:#fff;box-shadow:0 4px 0 #333;font-weight:bold}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #333}
.pad .ok{background:#2e9e44;color:#fff}.pad .del{background:#f2c94c}
.end{text-align:center;background:#fff;border-radius:20px;padding:40px;font-size:26px}
.end .big{font-size:90px;font-weight:bold}.end .stars{font-size:60px;min-height:70px}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.row button,.act-btn{font-size:26px;padding:12px 24px;border-radius:14px;border:3px solid #333;background:#fff;box-shadow:0 4px 0 #333}
.act-btn.main{background:#2b6cb0;color:#fff}
.nums{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.nums button{font-size:30px;width:70px;height:62px;border-radius:12px;border:3px solid #333;background:#fff}
.nums button.on{background:#2b6cb0;color:#fff}
/* schéma en barres de la classe : 2 cases grises égales, total dans un cadre blanc */
.schema{display:inline-block}
.cells{display:flex}
.cell{width:190px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;border:2px solid #777;padding:6px}
.c1{background:#dcdcdc}.c2{background:#bdbdbd}
.total{border:3px solid #111;background:#fff;text-align:center;font-size:44px;padding:4px 0;min-height:64px}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:170px;margin-top:4px}
.dot{width:24px;height:24px;border-radius:50%;background:#f06ba8;border:2px solid #b8336f}
.fs{position:fixed;right:10px;bottom:10px;font-size:18px;padding:6px 10px;border-radius:8px;border:2px solid #999;background:#fff;opacity:.7}

.mat{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:430px;padding:8px;border-radius:12px}
.grp.add{background:#fff3c4;border:3px dashed #e0a800}
.grp-u{display:flex;flex-wrap:wrap;gap:3px;max-width:110px;margin-left:8px}
.box{width:76px}.jet{width:26px}
.box.gone{opacity:.25;filter:grayscale(1)}
.opsign{font-size:56px;font-weight:bold}
.chain{font-size:40px;line-height:1.7}
.chain .lab{display:inline-block;width:190px;color:#777;font-size:28px}
.dix{color:#1f5fbf;font-weight:bold}
.note{font-size:26px;color:#a0522d}
</style></head>

<script>/* Ajouter et retirer des dizaines entières CE1.
   Niveau 1 : 30 + 20 (je connais 3 + 2 = 5, donc 3 dix + 2 dix = 5 dix, donc 30 + 20 = 50).
   Niveau 2 : 32 + 20 (j'ajoute des dizaines entières : les unités ne changent pas).
   Matériel de la classe : boîte bleue « 10 » et jeton rose (images de base_10.pdf). */
window.SET = { lvl: 1, op: "+", mat: true };

function gen() {
  const op = SET.op === "mix" ? (Math.random() < 0.5 ? "+" : "−") : SET.op;
  const u = SET.lvl === 2 ? rnd(1, 9) : 0;
  let a, b;
  if (op === "+") { a = SET.lvl === 1 ? rnd(1, 9) : rnd(1, 8); b = rnd(1, (SET.lvl === 1 ? 10 : 9) - a); }
  else { a = SET.lvl === 1 ? rnd(2, 10) : rnd(2, 9); b = rnd(1, a - 1); }
  const r = op === "+" ? a + b : a - b;
  return { a, b, u, op, r, N: 10 * a + u, answers: [r, r, 10 * r + u] };
}
function series(n) {
  const seen = new Set(), out = [];
  let guard = 0;
  while (out.length < n && guard++ < 500) {
    const q = gen(), key = q.a + q.op + q.b + "/" + q.u;
    if (seen.has(key)) continue;
    seen.add(key); out.push(q);
  }
  return out;
}
const box = (cls = "") => `<img class="box ${cls}" src="${IMG_BOX}" alt="10">`;
const dot = () => `<img class="jet" src="${IMG_DOT}" alt="1">`;
function material(q) {
  const units = q.u ? `<div class="grp-u">${dot().repeat(q.u)}</div>` : "";
  if (q.op === "+")
    return `<div class="mat"><div class="grp">${box().repeat(q.a)}</div>${units}
      <div class="opsign">+</div><div class="grp add">${box().repeat(q.b)}</div></div>`;
  return `<div class="mat"><div class="grp">${box().repeat(q.a - q.b)}${box("gone").repeat(q.b)}</div>${units}</div>`;
}
function chain(q, fld) {
  return `${SET.mat ? material(q) : ""}
    <div class="chain">
      <div><span class="lab">Je connais</span> ${q.a} ${q.op} ${q.b} = ${fld(0)}</div>
      <div><span class="lab">donc</span> <span class="dix">${q.a} dix</span> ${q.op} <span class="dix">${q.b} dix</span> = ${fld(1)} <span class="dix">dix</span></div>
      <div><span class="lab">donc</span> ${q.N} ${q.op} ${10 * q.b} = ${fld(2)}</div>
    </div>
    ${q.u ? `<div class="note">Les unités ne changent pas : ${q.u} ${q.u > 1 ? "unités" : "unité"}.</div>` : ""}`;
}

window.APP = {
  title: "Les dizaines entières",
  subtitle: "Si je connais 3 + 2 = 5, je connais 3 dix + 2 dix = 5 dix.",
  settings: () => `<div class="settings">
      <div class="grp"><b>Niveau</b>
        <button class="tog ${SET.lvl===1?'on':''}" data-k="lvl" data-v="1">30 + 20</button>
        <button class="tog ${SET.lvl===2?'on':''}" data-k="lvl" data-v="2">32 + 20</button></div>
      <div class="grp"><b>Calculs</b>
        <button class="tog ${SET.op==='+'?'on':''}" data-k="op" data-v="+">ajouter</button>
        <button class="tog ${SET.op==='−'?'on':''}" data-k="op" data-v="−">retirer</button>
        <button class="tog ${SET.op==='mix'?'on':''}" data-k="op" data-v="mix">les deux</button></div>
      <div class="grp"><b>Matériel</b>
        <button class="tog ${SET.mat?'on':''}" data-k="mat" data-v="1">oui</button>
        <button class="tog ${!SET.mat?'on':''}" data-k="mat" data-v="0">non</button></div>
    </div>`,
  bindSettings: (re) => document.querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    SET[k] = k === "lvl" ? +v : k === "mat" ? v === "1" : v; re();
  }),
  modes: [
    { label: "Découvrir", desc: "Le calcul se dévoile étape par étape.", type: "discover",
      init: () => ({ q: gen(), step: 0 }),
      render: (d) => `${chain(d.q, (i) => i < d.step ? `<span class="fld ok">${d.q.answers[i]}</span>` : `<span class="fld">……</span>`)}
        <div class="row"><button class="act-btn main" id="nx" ${d.step >= 3 ? "disabled" : ""}>Étape suivante</button>
        <button class="act-btn" id="nw">Nouvel exemple</button></div>`,
      bind: (d, re) => {
        document.getElementById("nx").onclick = () => { if (d.step < 3) { d.step++; re(); } };
        document.getElementById("nw").onclick = () => { d.q = gen(); d.step = 0; re(); };
      } },
    { label: "Je connais… donc…", desc: "Complète les trois calculs, l'un après l'autre.", type: "series",
      make: () => series(10).map(q => ({ answers: q.answers, view: () => chain(q, F) })) },
    { label: "Calcul mental", desc: "10 calculs directs, le plus vite possible.", type: "series",
      make: () => series(10).map(q => ({ answers: [q.answers[2]],
        view: () => `${SET.mat ? material(q) : ""}<div class="phrase" style="font-size:64px">${q.N} ${q.op} ${10 * q.b} = ${F(0)}</div>` })) },
  ],
};
</script>
<script>/* Moteur commun : séries de 10 questions, champs à compléter, pavé numérique (TBI) */
(function () {
  const $ = (s) => document.querySelector(s);
  const app = $("#app");
  const C = window.APP; // configuration propre à chaque application
  const S = { view: "menu", mode: null, qs: [], i: 0, score: 0, vals: [], k: 0, input: "", errs: 0,
              locked: false, t0: 0, disc: null, msg: "", msgCls: "" };

  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  window.shuffle = shuffle;
  window.rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  // Champ n° i : rempli / actif / en attente
  function F(i) {
    if (S.vals[i] != null) {
      const cls = S.vals[i].bad ? "fld shown" : "fld ok";
      return `<span class="${cls}">${S.vals[i].v}</span>`;
    }
    if (S.view === "series" && i === S.k) return `<span class="fld act">${S.input || "&nbsp;"}</span>`;
    return `<span class="fld">……</span>`;
  }
  window.F = F;

  function menu() {
    S.view = "menu";
    app.innerHTML = `
      <header><h1>${C.title}</h1><p class="sub">${C.subtitle || ""}</p></header>
      ${C.settings ? C.settings() : ""}
      <div class="modes">${C.modes.map((m, n) => `
        <button class="mode" data-n="${n}"><b>${m.label}</b><span>${m.desc}</span></button>`).join("")}
      </div>`;
    app.querySelectorAll(".mode").forEach((b) => b.onclick = () => start(C.modes[+b.dataset.n]));
    if (C.bindSettings) C.bindSettings(menu);
  }

  function start(m) {
    S.mode = m;
    if (m.type === "discover") { S.view = "discover"; S.disc = m.init(); return discover(); }
    S.view = "series"; S.qs = m.make(); S.i = 0; S.score = 0; S.t0 = Date.now();
    newQ();
  }

  function discover() {
    app.innerHTML = `${top(S.mode.label)}<div class="stage">${S.mode.render(S.disc)}</div>`;
    bindTop();
    S.mode.bind(S.disc, discover);
  }

  function top(label) {
    return `<div class="top"><button class="back">⟵ Menu</button><div class="ttl">${label}</div>
      ${S.view === "series" ? `<div class="prog">${S.i + 1} / ${S.qs.length} &nbsp; ⭐ ${S.score}</div>` : "<div></div>"}</div>`;
  }
  function bindTop() { app.querySelector(".back").onclick = menu; }

  function newQ() { S.vals = []; S.k = 0; S.input = ""; S.errs = 0; S.locked = false; S.msg = ""; renderQ(); }

  function renderQ() {
    const q = S.qs[S.i];
    app.innerHTML = `${top(S.mode.label)}
      <div class="stage">${q.view()}</div>
      <div class="msg ${S.msgCls}">${S.msg || "&nbsp;"}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-d="${d}">${d}</button>`).join("")}
        <button class="del" data-d="del">⌫</button><button data-d="0">0</button><button class="ok" data-d="ok">OK</button></div>`;
    bindTop();
    app.querySelectorAll(".pad button").forEach((b) => b.onclick = () => key(b.dataset.d));
  }

  function key(d) {
    if (S.view !== "series" || S.locked) return;
    if (d === "del") S.input = S.input.slice(0, -1);
    else if (d === "ok") return check();
    else if (S.input.length < 3) S.input += d;
    S.msg = ""; renderQ();
  }

  function check() {
    if (!S.input) return;
    const q = S.qs[S.i], good = q.answers[S.k];
    if (+S.input === good) {
      S.vals[S.k] = { v: good }; S.k++; S.input = "";
      if (S.k < q.answers.length) { S.msg = "Oui !"; S.msgCls = "good"; return renderQ(); }
      if (S.errs === 0) S.score++;
      S.msg = S.errs === 0 ? "Bravo ! ⭐" : "C'est juste !"; S.msgCls = "good";
      S.locked = true; renderQ(); setTimeout(next, 1300);
    } else {
      S.errs++;
      if (S.errs % 2 === 1) { S.msg = "Essaie encore."; S.msgCls = "bad"; S.input = ""; renderQ(); shake(); }
      else {
        S.vals[S.k] = { v: good, bad: true }; S.k++; S.input = "";
        S.msg = "La bonne réponse est " + good + "."; S.msgCls = "bad";
        if (S.k < q.answers.length) return renderQ();
        S.locked = true; renderQ(); setTimeout(next, 2200);
      }
    }
  }
  function shake() { const st = app.querySelector(".stage"); st.classList.add("shake"); setTimeout(() => st.classList.remove("shake"), 400); }

  function next() {
    S.i++;
    if (S.i < S.qs.length) return newQ();
    const sec = Math.round((Date.now() - S.t0) / 1000), n = S.qs.length;
    const stars = S.score >= n ? "⭐⭐⭐" : S.score >= n * 0.7 ? "⭐⭐" : S.score >= n * 0.4 ? "⭐" : "";
    S.view = "end";
    app.innerHTML = `${top(S.mode.label)}<div class="end">
      <div class="big">${S.score} / ${n}</div><div class="stars">${stars}</div>
      <p>Temps : ${Math.floor(sec / 60)} min ${sec % 60} s</p>
      <div class="row"><button class="again">Recommencer</button><button class="tomenu">Menu</button></div></div>`;
    bindTop();
    app.querySelector(".again").onclick = () => start(S.mode);
    app.querySelector(".tomenu").onclick = menu;
  }

  document.addEventListener("keydown", (e) => {
    if (S.view !== "series") return;
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === "Backspace") key("del");
    else if (e.key === "Enter") key("ok");
  });
  window.fullscreen = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
  menu();
})();
</script>
</body></html>
