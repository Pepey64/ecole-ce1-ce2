<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conjugaison : le présent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --fond:#f6f1e7; --papier:#fffdf8; --encre:#1d2733; --doux:#5b6675; --trait:#e3dccd;
    --rouge:#d42a20; --rouge-clair:#fbe3e0; --bleu:#1f62b8; --bleu-clair:#e3edf8;
    --vert:#2f7a4f; --vert-clair:#e2f2e8; --nuit:#1f3a5f; --gris:#e6e6e6; --jaune:#ffe45c; --focus:#f2a900;
    --titre:"Kalam","Segoe Print","Comic Sans MS",cursive;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--fond);color:var(--encre);font-family:"Andika",Verdana,Geneva,sans-serif;font-size:18px;min-height:100vh}
  button,input,select{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--focus);outline-offset:2px}

  header{background:var(--nuit);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;justify-content:space-between}
  header a{color:#cfe0f5;text-decoration:none;font-size:15px}
  header h1{margin:0;font-family:var(--titre);font-size:clamp(24px,3.6vw,36px);font-weight:700;line-height:1.1}
  header h1 span{color:#ffb4ab}
  .niveaux{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
  .niveaux button{font-size:18px;font-weight:700;border:none;background:transparent;color:#fff;padding:7px 22px;cursor:pointer}
  .niveaux button[aria-pressed="true"]{background:#fff;color:var(--nuit)}

  main{max-width:1080px;margin:0 auto;padding:14px 16px 30px}
  .modes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .modes button{font-size:16px;font-weight:700;border:2px solid var(--trait);background:var(--papier);color:var(--encre);padding:8px 14px;border-radius:12px;cursor:pointer;min-height:46px}
  .modes button[aria-pressed="true"]{background:var(--rouge);border-color:var(--rouge);color:#fff}
  .modes button[data-mode="radical"][aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu)}
  .outils{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
  .outils select{font-size:16px;padding:7px 10px;border-radius:10px;border:2px solid var(--trait);background:var(--papier);color:var(--encre)}
  .btn{font-size:16px;font-weight:700;border:2px solid var(--trait);background:var(--papier);color:var(--encre);padding:8px 14px;border-radius:10px;cursor:pointer}
  .btn:hover{border-color:var(--rouge)}
  .note{font-size:14px;color:var(--doux)}

  .scene{background:var(--papier);border:2px solid var(--trait);border-radius:22px;padding:18px 22px 24px;position:relative;min-height:400px}
  .haut{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .consigne{font-size:21px;font-weight:700;flex:1}
  .progres{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:40%}
  .progres i{width:16px;height:16px;border-radius:50%;background:var(--gris);display:block}
  .progres i.ok{background:var(--vert)} .progres i.ko{background:var(--rouge)} .progres i.en-cours{outline:3px solid var(--nuit);outline-offset:1px}
  .mascotte{width:64px;flex:none;transition:transform .25s}
  .mascotte img{width:100%;display:block}
  .mascotte.ok{transform:rotate(-8deg) scale(1.1)} .mascotte.ko{transform:rotate(6deg)}

  .question{font-size:clamp(28px,4.6vw,46px);text-align:center;margin:22px 0 16px;line-height:1.6}
  .question .inf{color:var(--doux);font-size:.6em;font-style:italic;white-space:nowrap}
  .rad{color:var(--bleu);font-weight:700} .term{color:var(--rouge);font-weight:700} .fixe{font-weight:700}
  .barre{color:#9aa3ad;text-decoration:line-through;text-decoration-thickness:3px}
  .trou{display:inline-block;min-width:2.2em;border-bottom:4px solid var(--rouge);color:var(--rouge);font-weight:700;text-align:center}
  .question input{font-size:.9em;width:6.5em;max-width:60vw;padding:2px 8px;border:none;border-bottom:4px solid var(--bleu);background:var(--bleu-clair);border-radius:8px 8px 0 0;text-align:center;color:var(--encre)}
  .question input.pron{width:3.6em}
  .question input.court{width:4.2em;color:var(--bleu);font-weight:700}
  .question input.juste{border-color:var(--vert);background:var(--vert-clair)}
  .question input.faux{border-color:var(--rouge);background:var(--rouge-clair)}
  .gs{background:var(--jaune);padding:0 .15em;border-radius:4px}

  /* Personnage terminaison (image + étiquette) */
  .perso{position:relative;display:inline-block;width:4.6em;line-height:1}
  .perso img{width:100%;display:block}
  .perso .etiq{position:absolute;left:50%;top:68.6%;transform:translate(-50%,-50%);background:#fff;border:.12em solid #111;border-radius:.3em;
    font-weight:700;font-size:1em;min-width:1.35em;padding:.06em .18em .1em;text-align:center;color:#111;white-space:nowrap;font-family:Arial,Helvetica,sans-serif}
  .choix{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
  .choix button{border:3px solid transparent;background:transparent;border-radius:18px;padding:4px 6px;cursor:pointer;font-size:24px}
  .choix button:hover{border-color:var(--trait);background:#fff}
  .choix button.juste{border-color:var(--vert);background:var(--vert-clair)}
  .choix button.faux{border-color:var(--rouge);background:var(--rouge-clair)}
  .choix.formes button{font-size:clamp(24px,3.6vw,34px);font-weight:700;min-width:110px;padding:12px 22px;border:3px solid var(--trait);background:#fff;color:var(--encre)}

  .original{font-size:clamp(22px,3.2vw,30px);text-align:center;background:#f4f1ea;border-radius:14px;padding:12px;margin:8px auto 6px;max-width:820px}
  .remplace{text-align:center;font-size:20px;margin:12px 0}
  .remplace b{background:var(--jaune);padding:0 .2em;border-radius:4px}

  .assoc{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;max-width:640px;margin:12px auto}
  .assoc .col{display:flex;flex-direction:column;gap:10px}
  .assoc button{font-size:clamp(20px,3vw,28px);font-weight:700;padding:9px;border-radius:14px;border:3px solid var(--trait);background:#fff;color:var(--encre);cursor:pointer}
  .assoc button.sel{border-color:var(--bleu);background:var(--bleu-clair)}
  .assoc button.fait{border-color:var(--vert);background:var(--vert-clair);cursor:default}
  .assoc button.faux{border-color:var(--rouge);background:var(--rouge-clair)}
  .assoc .verbe-titre{grid-column:1/-1;text-align:center;font-size:28px;font-style:italic;color:var(--doux)}

  .etapes{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
  .etape{font-size:19px;color:var(--doux)} .etape b{color:var(--encre)}
  .num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#333;color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-right:6px}

  .clavier{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
  .clavier button{font-size:22px;font-weight:700;width:52px;height:46px;border-radius:10px;border:2px solid var(--trait);background:#fff;cursor:pointer}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .valider{font-size:22px;font-weight:700;background:var(--rouge);color:#fff;border:none;border-radius:999px;padding:11px 38px;cursor:pointer;box-shadow:0 3px 0 #8d1a13}
  .valider:active{transform:translateY(2px);box-shadow:0 1px 0 #8d1a13}

  .retour{margin:14px auto 0;max-width:820px;border-radius:14px;padding:12px 16px;font-size:20px;text-align:center}
  .retour.ok{background:var(--vert-clair);color:var(--vert);font-weight:700}
  .retour.ko{background:var(--rouge-clair);color:#7c1a12}
  .retour .corr{font-size:26px;color:var(--encre);margin-top:4px}

  .carte-gn{display:inline-flex;align-items:center;gap:12px;border:2px dashed #aaa;border-radius:14px;padding:8px 14px;margin-top:8px;background:#fff;text-align:left;font-size:18px}
  .carte-gn img{height:70px;border-radius:6px}
  .carte-gn b{font-size:21px}
  .carte-gn small{color:var(--doux);display:block}

  .fin{text-align:center;padding:6px}
  .fin .etoiles{font-size:64px;color:#e8a400;letter-spacing:8px}
  .fin .score{font-size:30px;font-weight:700;margin:6px 0 14px}
  .fin ul{list-style:none;padding:0;margin:10px auto;max-width:640px;text-align:left}
  .fin li{padding:8px 12px;border-bottom:1px solid var(--trait);font-size:19px}

  /* ---------- La leçon (comme la fiche) ---------- */
  .voile{position:fixed;inset:0;background:rgba(15,25,35,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
  .lecon{background:#fff;border-radius:16px;max-width:820px;width:100%;max-height:94vh;overflow:auto;padding:0 22px 20px;position:relative;font-size:18px}
  .lecon .tete{display:flex;align-items:stretch;border-bottom:2px solid #555;margin:0 -22px 12px}
  .lecon .code{padding:10px 16px;border-right:2px solid #555;font-weight:700;font-size:22px;display:flex;align-items:center}
  .lecon h2{margin:0;padding:8px 46px 6px 16px;font-family:var(--titre);color:var(--rouge);font-size:30px;flex:1}
  .lecon .fermer{position:absolute;top:10px;right:12px;font-size:26px;background:none;border:none;cursor:pointer}
  .lecon h3{display:flex;align-items:center;gap:12px;font-size:19px;margin:16px 0 8px}
  .lecon h3::after{content:"";flex:1;height:1px;background:#bbb}
  .lecon select{font-size:17px;padding:4px 8px;border-radius:8px;border:2px solid var(--trait)}
  .intro{display:flex;gap:12px;align-items:center}
  .intro img{height:66px}
  .intro .gris{color:#888}
  .lignes-etapes{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
  .boite{border:2px solid #bbb;border-radius:8px;padding:2px 14px;text-align:center;min-width:180px;font-size:19px}
  .encadre{border-left:4px solid var(--bleu);background:#f2f2f2;padding:6px 12px;margin:8px 0}
  table.conj{border-collapse:collapse;width:100%;margin:8px 0;font-size:20px;text-align:center}
  table.conj th{background:#eee;padding:6px;border:1px solid #999}
  table.conj td{border:1px solid #999;padding:5px 10px}
  table.conj td:first-child{font-weight:700}
  .gn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gn > div{border:2px dashed #aaa;border-radius:12px;padding:8px 12px}
  .gn .t{display:flex;gap:8px;align-items:center} .gn img{height:54px;border-radius:5px}
  .gn small{color:var(--doux);display:block;font-size:14px}
  .rang-term{display:flex;justify-content:space-around;flex-wrap:wrap;gap:4px;font-size:19px;text-align:center}
  .rang-term .perso{width:4em}
  .rang-term div b{display:block;margin-top:4px}
  .bulle{border:2px dashed #555;border-radius:16px;padding:8px 12px;margin:8px 0}

  @media (max-width:640px){
    body{font-size:16px}
    .scene{padding:12px}
    .mascotte{width:46px}
    .consigne{font-size:17px}
    .assoc{gap:10px 14px}
    .choix button{font-size:17px}
    .gn{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <a href="index.html">← Ludothèque</a>
  <h1>Conjugaison : <span>le présent</span></h1>
  <div class="niveaux" role="group" aria-label="Niveau">
    <button data-niv="CE1">CE1</button>
    <button data-niv="CE2">CE2</button>
  </div>
</header>

<main>
  <div class="modes" role="group" aria-label="Activité">
    <button data-mode="radical">Le radical</button>
    <button data-mode="terminaison">Choisir la terminaison</button>
    <button data-mode="ecrire">Écrire le verbe</button>
    <button data-mode="associer">Associer pronom – verbe</button>
    <button data-mode="accord">Accord avec le sujet</button>
    <button data-mode="transposer">Transposer</button>
  </div>
  <div class="outils">
    <label for="filtre" class="note">Verbes :</label>
    <select id="filtre">
      <option value="tous">Tous les verbes</option>
      <option value="er">Verbes en -er</option>
      <option value="eaa">Être, avoir, aller</option>
      <option value="irr">Faire, dire, venir…</option>
    </select>
    <span id="note-filtre" class="note" hidden>Cette activité utilise les verbes en -er.</span>
    <button class="btn" id="btn-lecon">📖 La leçon</button>
    <button class="btn" id="btn-nouveau">↻ Nouvelle série</button>
  </div>

const $ = id => document.getElementById(id);
const alea = a => a[Math.floor(Math.random()*a.length)];
const melange = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const maj = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const verbe = inf => VERBES.find(v => v.inf === inf);
const estEr = v => !IRR[v.inf];
const radicalSimple = v => estEr(v) && !/[gc]er$/.test(v.inf);   // le radical ne change jamais

// Conjugue : renvoie {forme, rad, term}
function conj(v, k){
  if(IRR[v.inf]){
    const f = IRR[v.inf][k];
    if(PAR_COEUR.includes(v.inf)) return {forme:f, rad:f, term:"", coeur:true};
    const m = f.match(/(ons|ez|ent|es|s|t|d|x)$/);
    const t = m ? m[1] : "";
    return {forme:f, rad:f.slice(0, f.length - t.length), term:t};
  }
  let r = v.inf.slice(0,-2);
  if(k === 3 && r.endsWith("g")) r += "e";
  if(k === 3 && r.endsWith("c")) r = r.slice(0,-1) + "ç";
  return {forme:r + TERM_ER[k], rad:r, term:TERM_ER[k]};
}
const voyelle = f => /^[aeiouyéèêâîôûh]/i.test(f);
function pronomDe(k, forme, variante){
  if(k === 0) return voyelle(forme) ? "j'" : "je";
  if(k === 1) return "tu";
  if(k === 3) return "nous";
  if(k === 4) return "vous";
  return variante || (k === 2 ? alea(["il","elle","on"]) : alea(["ils","elles"]));
}
const colle = (p, f) => p.endsWith("'") ? p + f : p + " " + f;
const formeHTML = c => c.coeur ? `<span class="fixe">${esc(c.forme)}</span>` : `<span class="rad">${esc(c.rad)}</span><span class="term">${esc(c.term)}</span>`;
const pronomReprise = s => s.k===0?"je":s.k===1?"tu":s.k===3?"nous":s.k===4?"vous":s.k===2?(s.g==="f"?"elle":"il"):(s.g==="f"?"elles":"ils");

function norm(s){ return String(s).trim().toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g," "); }
function sansAccent(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }
// 0 = faux, 1 = juste, 2 = juste sauf les accents
function compare(rep, attendu){
  const a = norm(rep), b = norm(attendu);
  if(a === b) return 1;
  if(sansAccent(a) === sansAccent(b)) return 2;
  return 0;
}
function humeur(h){ const m = $("mascotte"); m.classList.remove("ok","ko"); if(h) m.classList.add(h); }

}catch(e){}
function sauver(){ try{ localStorage.setItem("conj-present", JSON.stringify({niveau, mode, filtre})); }catch(e){} }
const SEULEMENT_ER = {radical:"simple", terminaison:"er"};

function verbesDispo(restriction){
  let v = VERBES.filter(x => niveau === "CE2" || x.niv === "CE1");
  if(restriction === "simple") return v.filter(radicalSimple);
  if(restriction === "er") return v.filter(estEr);
  if(filtre === "er") v = v.filter(estEr);
  else if(filtre === "eaa") v = v.filter(x => PAR_COEUR.includes(x.inf));
  else if(filtre === "irr") v = v.filter(x => IRR[x.inf] && !PAR_COEUR.includes(x.inf));
  return v.length ? v : VERBES.filter(x => x.niv === "CE1");
}
const sujetsDispo = () => SUJETS.filter(s => niveau === "CE2" || !s.ce2);

/* =========================================================
   FABRICATION DES QUESTIONS
   ========================================================= */
function tireVerbes(n, restriction){
  const dispo = verbesDispo(restriction);
  const out = [];
  let sac = [];
  for(let i=0;i<n;i++){ if(!sac.length) sac = melange(dispo); out.push(sac.pop()); }
  return out;
}

function fabriquer(){
  const n = mode === "associer" ? 5 : 10;
  if(mode === "radical"){
    // 3 sortes de questions : trouver le radical, construire le verbe, retrouver l'infinitif
    const sortes = niveau === "CE1" ? ["rad","rad","constr","constr","constr","inf"] : ["rad","constr","constr","inf","inf"];
    return tireVerbes(n, "simple").map((v,i) => {
      const k = Math.floor(Math.random()*6), c = conj(v,k);
      const sorte = i < 2 ? "rad" : alea(sortes);
      return {v, k, c, pro:pronomDe(k, c.forme), sorte};
    });
  }
  if(mode === "terminaison" || mode === "ecrire"){
    return tireVerbes(n, SEULEMENT_ER[mode]).map(v => {
      const k = Math.floor(Math.random()*6), c = conj(v,k);
      return {v, k, c, pro:pronomDe(k, c.forme)};
    });
  }
  if(mode === "associer"){
    return tireVerbes(n).map(v => ({v, pros:[0,1,2,3,4,5].map(k => pronomDe(k, conj(v,k).forme))}));
  }
  if(mode === "accord"){
    const sujets = sujetsDispo();
    return tireVerbes(n).map((v,i) => {
      const pool = sujets.filter(s => i%2 ? s.k===5 || s.k===4 : s.k===2 || s.k===3);
      const s = alea(pool.length ? pool : sujets);
      return {v, s, comp:alea(v.c), c:conj(v,s.k)};
    });
  }
  if(mode === "transposer"){
    const sujets = sujetsDispo().filter(s => s.k===2 || s.k===5);
    const cibles = sujetsDispo().concat(PRONOMS_SUJETS);
    const verbs = tireVerbes(n*2);
    const out = [];
    for(let i=0;i<n;i++){
      const src = alea(sujets);
      let pool = cibles.filter(c => c.k !== src.k && (niveau === "CE2" || [0,1,2,5].includes(c.k)));
      if(niveau === "CE1" && Math.random() < .7) pool = pool.filter(c => !c.pron && (c.k===2||c.k===5));
      const cib = alea(pool);
      const v1 = verbs[2*i];
      let v2 = verbs[2*i+1]; if(v2.inf === v1.inf) v2 = alea(verbesDispo().filter(x => x.inf !== v1.inf)) || v2;
      out.push({src, cib, v1, c1:alea(v1.c), v2, c2:alea(v2.c), deux: niveau === "CE2"});
    }
    return out;
  }
  return [];
}

  }

  else if(mode === "ecrire"){
    z.innerHTML = `<div class="question">${esc(maj(q.k===0 ? "je / j'" : q.pro))} <span class="inf">(${esc(q.v.inf)})</span> → ${champ("rep1","","Verbe conjugué")}</div>
      ${clavierHTML()}${boutonValider()}`;
    $("rep1").focus();
    $("valider").onclick = validerSaisie;
  }

  else if(mode === "associer"){
    const formes = melange([0,1,2,3,4,5].map(k => conj(q.v,k).forme));
    q.trouves = 0; q.erreurs = 0; q.sel = null;
    z.innerHTML = `<div class="assoc"><div class="verbe-titre">${esc(q.v.inf)}</div>
      <div class="col" id="col-p">${q.pros.map((p,k) => `<button data-k="${k}">${esc(p)}</button>`).join("")}</div>
      <div class="col" id="col-f">${formes.map(f => `<button data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div></div>`;
    z.querySelectorAll("#col-p button").forEach(b => b.onclick = () => {
      if(b.classList.contains("fait") || attente) return;
      z.querySelectorAll("#col-p button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); q.sel = +b.dataset.k;
    });
    z.querySelectorAll("#col-f button").forEach(b => b.onclick = () => {
      if(b.classList.contains("fait") || q.sel === null || attente) return;
      const bp = z.querySelector(`#col-p button[data-k="${q.sel}"]`);
      if(conj(q.v, q.sel).forme === b.dataset.f){
        bp.classList.remove("sel"); bp.classList.add("fait"); b.classList.add("fait");
        bp.innerHTML = esc(q.pros[q.sel]) + (q.pros[q.sel].endsWith("'") ? "" : " ") + formeHTML(conj(q.v,q.sel));
        q.sel = null; q.trouves++;
        if(q.trouves === 6) terminer(q.erreurs === 0, q.erreurs === 0 ? "" : `${q.erreurs} erreur${q.erreurs>1?"s":""} pendant l'association.`);
      } else {
        q.erreurs++; b.classList.add("faux"); humeur("ko");
        setTimeout(() => { b.classList.remove("faux"); humeur(); }, 600);
      }
    });
  }

  else if(mode === "accord"){
    const ce1 = niveau === "CE1";
    z.innerHTML = `<div class="question"><span class="gs">${esc(maj(q.s.t))}</span> ${ce1 ? '<span class="trou" id="trou">…</span>' : champ("rep1","","Verbe conjugué")} ${esc(q.comp)}.
      <div class="inf">(${esc(q.v.inf)})</div></div>
      ${ce1 ? `<div class="choix formes" id="choix">${melange(optionsAccord(q)).map(f => `<button data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>` : clavierHTML() + boutonValider()}
      <div class="actions"><button class="btn" id="btn-indice">💡 Par quel pronom remplacer ?</button></div><div style="text-align:center" id="indice"></div>`;
    $("btn-indice").onclick = () => { $("indice").innerHTML = carteGN(q.s); };
    if(ce1) z.querySelectorAll("#choix button").forEach(b => b.onclick = () => repondreChoix(b, b.dataset.f === q.c.forme));

    const s = q.src, c = q.cib;

    q.r1 = conj(q.v1, c.k); q.r2 = conj(q.v2, c.k);
    q.pr2 = c.k === 0 ? (voyelle(q.r2.forme) ? "j'" : "je") : pronomReprise(c);
    let orig = `<span class="gs">${esc(maj(s.t))}</span> ${esc(f1s)} ${esc(q.c1)}.`;

    const debut = c.k === 0 ? (voyelle(q.r1.forme) ? "J'" : "Je") : maj(c.t);
    let nouv = `<span class="gs">${esc(debut)}</span>${debut.endsWith("'") ? "" : " "}${champ("rep1","","Premier verbe")} ${esc(q.c1)}.`;

      <div class="remplace">Remplace <b>${esc(s.t)}</b> par <b>${esc(c.t)}</b>.</div>

      ${clavierHTML()}${boutonValider()}`;

  // Clavier des accents

    if(!dernier) return;

    dernier.focus(); dernier.setSelectionRange(p+1, p+1);

}

function carteGN(s){
  const p = pronomReprise(s);
  let img = "";
  if(s.k === 2) img = `<img alt="Ludo" src="${IMG.ludo}">`;
  if(s.k === 5) img = `<img alt="Ludo et Léo" src="${IMG.ludoleo}">`;
  const exemple = s.k === 2 ? "Ludo = il" : s.k === 5 ? "Ludo et Léo = ils" : "";
  const type = s.k === 2 ? "groupe du nom au singulier" : s.k === 5 ? "groupe du nom au pluriel" : s.k === 3 ? "moi + quelqu'un = nous" : "toi + quelqu'un = vous";
  return `<div class="carte-gn">${img}<div>${exemple ? `<small>comme ${exemple}</small>` : ""}<b>${esc(maj(s.t))} = ${esc(p)}</b><small>${type}</small></div></div>`;
}

function optionsAccord(q){
  const f = new Set([conj(q.v,2).forme, conj(q.v,5).forme, conj(q.v,1).forme, conj(q.v,q.s.k).forme]);
  return [...f].slice(0,4);
}

/* =========================================================
   CORRECTION
   ========================================================= */
function repondreChoix(bouton, juste){
  if(attente) return;
  attente = true;
  bouton.classList.add(juste ? "juste" : "faux");
  if(!juste){
    const bonne = [...$("choix").querySelectorAll("button")].find(b => (b.dataset.t && b.dataset.t === courant.c.term) || (b.dataset.f && b.dataset.f === courant.c.forme));
    if(bonne) bonne.classList.add("juste");
  }
  if(mode === "terminaison"){ const t = $("trou"); t.textContent = courant.c.term; t.style.borderColor = juste ? "var(--vert)" : "var(--rouge)"; }
  if(mode === "accord"){ $("trou").innerHTML = formeHTML(courant.c); }
  terminer(juste);
}

function validerSaisie(boutonTerm){
  if(attente) return;
  const q = courant;
  const champs = [];
  if(mode === "radical"){
    if(q.sorte === "rad" || q.sorte === "constr") champs.push(["rep1", [q.c.rad]]);
    else champs.push(["rep1", [q.v.inf]]);
  }
  if(mode === "ecrire" || mode === "accord") champs.push(["rep1", [q.c.forme]]);
  if(mode === "transposer"){
    champs.push(["rep1", [q.r1.forme]]);
    if(q.deux){
      champs.push(["repP", q.cib.k === 0 ? ["je","j'"] : [q.pr2]]);
      champs.push(["rep2", [q.r2.forme]]);
    }
  }
  const vide = champs.find(([id]) => !norm($(id).value));
  if(vide){ $(vide[0]).focus(); return; }
  let tout = true, accents = false;
  champs.forEach(([id, attendus]) => {
    const r = Math.max(...attendus.map(a => compare($(id).value, a)));
    $(id).classList.add(r === 1 ? "juste" : "faux");
    if(r !== 1) tout = false;
    if(r === 2) accents = true;
  });
  let message = accents ? "Attention aux accents !" : "";
  if(mode === "radical" && q.sorte === "constr"){
    const bonTerm = q.termChoisie === q.c.term;
    boutonTerm.classList.add(bonTerm ? "juste" : "faux");
    if(!bonTerm){ const b = $("choix").querySelector(`button[data-t="${q.c.term}"]`); if(b) b.classList.add("juste"); }
    $("trou").textContent = q.termChoisie;
    if(!bonTerm) tout = false;
    if(tout === false && norm($("rep1").value) === norm(q.c.forme)) message = "J'écris seulement le radical, sans la terminaison.";
  }
  if(mode === "radical" && q.sorte === "rad" && norm($("rep1").value) === norm(q.v.inf)) message = "Il faut enlever -er !";
  attente = true;
  terminer(tout, message);
}

function correctionHTML(){
  const q = courant;
  if(mode === "radical"){
    if(q.sorte === "rad") return `${esc(q.v.inf)} → <span class="rad">${esc(q.c.rad)}</span><span class="barre">er</span>`;
    if(q.sorte === "constr") return `${debutPro(q.pro)}<span class="rad">${esc(q.c.rad)}</span> + <span class="term">${esc(q.c.term)}</span> → ${esc(colle(q.pro, ""))}${formeHTML(q.c)}`;
    return `${debutPro(q.pro)}${formeHTML(q.c)} → il faut <span class="rad">${esc(q.c.rad)}</span>er`;
  }
  if(mode === "terminaison" || mode === "ecrire") return `${debutPro(q.pro)}${formeHTML(q.c)}`;
  if(mode === "accord") return `${esc(maj(q.s.t))} = <b>${esc(pronomReprise(q.s))}</b> → <span class="gs">${esc(maj(q.s.t))}</span> ${formeHTML(q.c)} ${esc(q.comp)}.`;
  if(mode === "transposer"){
    const d = q.cib.k === 0 ? (voyelle(q.r1.forme) ? "J'" : "Je") : maj(q.cib.t);
    let s = `${esc(d)}${d.endsWith("'") ? "" : " "}${formeHTML(q.r1)} ${esc(q.c1)}.`;
    if(q.deux) s += ` ${debutPro(q.pr2)}${formeHTML(q.r2)} ${esc(q.c2)}.`;
    return s;
  }
  if(mode === "associer") return q.pros.map((p,k) => `${esc(p)}${p.endsWith("'")?"":" "}${formeHTML(conj(q.v,k))}`).join(" · ");
  return "";
}

function terminer(juste, message){
  attente = true;
  resultats.push({ok:juste, corr:correctionHTML()});
  progres();
  humeur(juste ? "ok" : "ko");
  const dernier = index === serie.length - 1;
  if(juste){
    $("retour").innerHTML = `<div class="retour ok">${alea(["Bravo !","Super !","C'est juste !","Excellent !"])}${mode === "radical" ? `<div class="corr">${correctionHTML()}</div>` : ""}</div>`;
    setTimeout(suivant, mode === "radical" ? 1600 : mode === "associer" ? 1100 : 1000);
  } else {
    $("retour").innerHTML = `<div class="retour ko">${message ? esc(message) + "<br>" : ""}La bonne réponse :<div class="corr">${correctionHTML()}</div></div>
      <div class="actions"><button class="valider" id="suivant">${dernier ? "Voir mon score" : "Suivant →"}</button></div>`;
    $("suivant").onclick = suivant; $("suivant").focus();
  }
}

function suivant(){
  if(!attente) return;
  attente = false;
  if(index < serie.length - 1){ index++; afficherQuestion(); }
  else afficherFin();
}

function afficherFin(){
  const ok = resultats.filter(r => r.ok).length, n = serie.length;
  const pct = ok / n;
  const etoiles = pct === 1 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  humeur(etoiles >= 2 ? "ok" : null);
  $("progres").innerHTML = resultats.map(r => `<i class="${r.ok?"ok":"ko"}"></i>`).join("");
  const erreurs = resultats.filter(r => !r.ok);
  $("zone").innerHTML = `<div class="fin">
    <div class="etoiles">${"★".repeat(etoiles)}${"☆".repeat(3-etoiles)}</div>
    <div class="score">${ok} / ${n}</div>
    ${erreurs.length ? `<div>À revoir :</div><ul>${erreurs.map(r => `<li>${r.corr}</li>`).join("")}</ul>` : "<div>Aucune erreur, bravo !</div>"}
    <div class="actions"><button class="valider" id="rejouer">Nouvelle série</button></div></div>`;
  $("retour").innerHTML = "";
  $("rejouer").onclick = nouvelleSerie; $("rejouer").focus();
}

   LA LEÇON (reprend la fiche « Le présent des verbes en -er »)

  const pc = ["je","tu","il / elle / on / Ludo","nous","vous","ils / elles / Ludo et Léo"];
  const lignes = [0,1,2,3,4,5].map(k => `<tr><td>${pc[k]}</td><td>${esc(ps[k])}${ps[k].endsWith("'")?"":" "}${formeHTML(conj(v,k))}</td></tr>`).join("");

      <h3>Radical + terminaison</h3>
      <div class="lignes-etapes">
        <div><span class="num">1</span>J'écris le verbe à l'infinitif.</div><div class="boite">${esc(v.inf)}</div>
        <div><span class="num">2</span>J'enlève <b>-er</b> : il reste le <b class="rad">radical</b>.</div><div class="boite"><span class="rad">${esc(r)}</span><span class="barre">er</span></div>
        <div><span class="num">3</span>J'ajoute la <b class="term">terminaison</b> du pronom.</div><div class="boite">nous <span class="rad">${esc(conj(v,3).rad)}</span> + <span class="term">ons</span></div>
      </div>
      <div class="encadre">Le radical ne change pas : <b>je le recopie à chaque fois.</b></div>`;
    if(/ger$/.test(v.inf)) h += `<div class="bulle">⚠️ Avec <b>nous</b>, on garde le <b>e</b> pour entendre [ʒ] : nous <span class="rad">${esc(conj(v,3).rad)}</span><span class="term">ons</span>.</div>`;
    if(/cer$/.test(v.inf)) h += `<div class="bulle">⚠️ Avec <b>nous</b>, le c devient <b>ç</b> pour entendre [s] : nous <span class="rad">${esc(conj(v,3).rad)}</span><span class="term">ons</span>.</div>`;
    h += `<p>Ils se conjuguent tous comme <b>« ${esc(v.inf)} »</b> :</p>`;
  } else {
    $("lecon-titre").textContent = "Le présent : " + v.inf + ".";
    h += `<div class="intro"><img alt="" src="${IMG.verbe}"><div>${PAR_COEUR.includes(v.inf)
      ? `<b>${esc(v.inf)}</b> ne se termine pas comme les verbes en -er : je l'apprends <b>par cœur</b>.`
      : `<b>${esc(v.inf)}</b> n'est pas un verbe en -er : son radical peut changer.<br>Terminaisons souvent : <b class="term">-s / -s / -t (ou -d) / -ons / -ez / -ent</b>.`}</div></div>`;
  }
  h += `<table class="conj"><thead><tr><th>pronom</th><th>${esc(nom)}</th></tr></thead><tbody>${lignes}</tbody></table>
    <h3>Ludo / Ludo et Léo</h3>
    <div class="gn">
      <div><div class="t"><img alt="Ludo" src="${IMG.ludo}"><div><b>Ludo = il</b><small>groupe du nom au singulier</small></div></div>
        <span class="gs">Ludo</span> ${formeHTML(conj(v,2))}.<br><span class="gs">L'hippopotame</span> ${formeHTML(conj(v,2))}.</div>
      <div><div class="t"><img alt="Ludo et Léo" src="${IMG.ludoleo}"><div><b>Ludo et Léo = ils</b><small>groupe du nom au pluriel</small></div></div>
        <span class="gs">Ludo et Léo</span> ${formeHTML(conj(v,5))}.<br><span class="gs">Les hippopotames</span> ${formeHTML(conj(v,5))}.</div>
    </div>`;
  if(er){
    h += `<h3>Les terminaisons</h3>
      <div class="rang-term">${TERM_ER.map((t,k) => `<div>${perso(t)}<b>${["je","tu","il / elle","nous","vous","ils / elles"][k]}</b></div>`).join("")}</div>`;
  }
  $("lecon-contenu").innerHTML = h;
}
function ouvrirLecon(){
  let inf = courant && (courant.v ? courant.v.inf : courant.v1 ? courant.v1.inf : null);
  if(!inf || !verbe(inf) || (niveau === "CE1" && verbe(inf).niv !== "CE1")) inf = "penser";
  remplirLecon(inf);
  $("voile").hidden = false; $("fermer-lecon").focus();
}
$("lecon-verbe").onchange = e => remplirLecon(e.target.value);
$("btn-lecon").onclick = ouvrirLecon;
$("fermer-lecon").onclick = () => $("voile").hidden = true;
$("voile").onclick = e => { if(e.target === $("voile")) $("voile").hidden = true; };

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */
document.querySelectorAll(".niveaux button").forEach(b => b.onclick = () => { niveau = b.dataset.niv; sauver(); nouvelleSerie(); });
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => { mode = b.dataset.mode; sauver(); nouvelleSerie(); });
$("filtre").onchange = e => { filtre = e.target.value; sauver(); nouvelleSerie(); };
$("btn-nouveau").onclick = nouvelleSerie;
document.addEventListener("keydown", e => {
  if(!$("voile").hidden){ if(e.key === "Escape") $("voile").hidden = true; return; }
  if(e.key !== "Enter") return;
  if(attente && $("suivant")){ e.preventDefault(); suivant(); return; }
  if(!attente && $("valider") && e.target.tagName === "INPUT"){ e.preventDefault(); validerSaisie(); }
});

if(!CONSIGNES[mode]) mode = "radical";
nouvelleSerie();
</script>
</body>
</html>
