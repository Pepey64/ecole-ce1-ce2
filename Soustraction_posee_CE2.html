  :root{--c:#3f8f12;--d:#1f6fc0;--u:#d0397f;--red:#d32f2f;--grey:#f1f1f1;--ink:#222}
  *{box-sizing:border-box}
  body{margin:0;font-family:Andika,"Comic Sans MS","Trebuchet MS",sans-serif;color:var(--ink);background:#fafafa}
  header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:#e6e6e6;border-bottom:2px solid #ccc;flex-wrap:wrap}
  h1{margin:0;font-size:26px;font-weight:700}
  .tabs{display:flex;gap:6px}
  .tab{border:2px solid #999;background:#fff;border-radius:22px;padding:7px 16px;font-size:18px;cursor:pointer;font-family:inherit}
  .tab.on{background:#333;color:#fff;border-color:#333}
  select,.btn,input{font-family:inherit}
  select{font-size:17px;padding:6px 8px;border-radius:8px;border:2px solid #999}
  .spacer{flex:1}
  .score{font-size:20px;font-weight:700}
  main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;padding:14px 18px}
  .panel{background:#fff;border:2px solid #ddd;border-radius:16px;padding:12px}
  /* matériel */
  .mat{display:grid;gap:8px;min-height:330px}
  .mcol{border-radius:12px;padding:8px 6px 4px;display:flex;flex-direction:column;align-items:center;transition:background .3s}
  .mcol.active{background:#fff7d6;box-shadow:inset 0 0 0 3px #f2c94c}
  .mitems{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:5px;width:100%}
  .mlab{font-weight:700;font-size:19px;margin-top:6px}
  .it{position:relative;display:inline-block;line-height:0}
  .it img{display:block}
  .it.x::before,.it.x::after{content:"";position:absolute;left:8%;top:47%;width:84%;height:5px;background:#111;border-radius:3px}
  .it.x::before{transform:rotate(30deg)}
  .it.x::after{transform:rotate(-30deg)}
  .it.new{animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .gone{opacity:.22;filter:grayscale(1)}
  .take{font-size:15px;color:#555;width:100%;text-align:center;line-height:1.2}
  /* opération */
  .opwrap{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .op{display:grid;column-gap:0}
  .cell{width:76px;height:74px;position:relative;font-size:58px;text-align:center;line-height:74px}
  .hd{height:30px;line-height:30px;font-size:20px;font-weight:700}
  .top{height:126px}
  .lay{position:absolute;left:0;right:0;text-align:center}
  .lay .pre{font-size:30px;position:relative;top:-2px;margin-right:1px}
  .lay.s{font-size:36px}
  .lay .strike{position:absolute;left:12%;right:12%;top:50%;height:4px;background:currentColor;transform:rotate(-55deg)}
  .lay.wide .strike{left:-2%;right:4%;transform:rotate(-38deg)}
  .rule{grid-column:1/-1;height:5px;background:#222;border-radius:3px;margin:2px 0 4px}
  .res{color:var(--red);font-weight:700}
  .hot{color:var(--red)}
  .colhl{background:#fff7d6;border-radius:8px}
  .check{margin-top:10px;font-size:24px;min-height:34px;text-align:center}
  /* bas */
  .bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}
  .msg{font-size:24px;line-height:1.45;min-height:110px}
  .msg b{color:#111}
  .msg .r{color:var(--red);font-weight:700}
  .msg .bad{color:#b35400}
  .acts{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:300px}
  .btn{font-size:21px;padding:12px 18px;border-radius:14px;border:2px solid #333;background:#fff;cursor:pointer}
  .btn:hover{background:#f3f3f3}
  .btn.main{background:#333;color:#fff}
  .btn.d{border-color:var(--d);color:var(--d)}
  .btn.c{border-color:var(--c);color:var(--c)}
  .btn.u{border-color:var(--u);color:var(--u)}
  .pad{display:grid;grid-template-columns:repeat(5,58px);gap:8px;justify-content:center}
  .pad button{font-size:28px;height:58px;border-radius:12px;border:2px solid #555;background:#fff;cursor:pointer;font-family:inherit}
  .pad button:hover{background:#eee}
  .ask{font-size:30px;text-align:center;margin-bottom:6px}
  .ask .box{display:inline-block;min-width:54px;border-bottom:3px solid #333;color:var(--red)}
  .own{display:flex;gap:8px;align-items:center;font-size:18px}
  .own input{width:84px;font-size:20px;padding:5px;border:2px solid #999;border-radius:8px;text-align:center}
  .stars{font-size:22px;letter-spacing:2px}
  .hide{display:none!important}
  .shake{animation:sh .35s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<header>
  <h1>La soustraction posée</h1>
  <div class="tabs">
    <button class="tab on" data-mode="demo">👀 Je regarde</button>
    <button class="tab" data-mode="train">✏️ Je m'entraîne</button>
  </div>
  <select id="level">
    <option value="1">Niveau 1 · 2 chiffres (rappel CE1)</option>
    <option value="2" selected>Niveau 2 · 3 chiffres, j'ouvre 1 fois</option>
    <option value="3">Niveau 3 · 3 chiffres, j'ouvre 2 fois</option>
    <option value="4">Niveau 4 · ★ avec un zéro</option>
  </select>
  <div class="own" id="own">
    <input id="ownA" inputmode="numeric" placeholder="524"> −
    <input id="ownB" inputmode="numeric" placeholder="268">
    <button class="btn" id="ownGo" style="font-size:17px;padding:6px 12px">Montrer</button>
  </div>
  <div class="spacer"></div>
  <div class="score hide" id="score"><span class="stars" id="stars"></span></div>
</header>
<main>
  <div class="panel"><div class="mat" id="mat"></div></div>
  <div class="panel opwrap"><div class="op" id="op"></div><div class="check" id="check"></div></div>
  <div class="bottom">
    <div class="panel msg" id="msg"></div>
    <div class="panel acts" id="acts"></div>
  </div>
</main>

const KEYS = ["u","d","c"];                       // index 0 = unités
const SING = ["unité","dizaine","centaine"], PLUR = ["unités","dizaines","centaines"];
const LET = ["u","d","c"];
const IMGK = ["dot","box10","box100"], OPENK = ["open10","open100",null];
const WID = {dot:30,box10:62,box100:74,open10:84,open100:130};
let mode = "demo", S = null, stars = [];

const $ = id => document.getElementById(id);
const digits = n => String(n).split("").reverse().map(Number);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));

/* ---------- génération selon le niveau ---------- */
function pattern(a,b){ // rangs où il faut ouvrir (simulation)
  const A = digits(a), B = digits(b), n = A.length, v = A.slice(), opens = [];
  let zero = false;
  for(let i=0;i<n;i++){
    const bi = B[i]||0;
    if(v[i] < bi){ opens.push(i); let j=i+1; if(v[j]===0){zero=true; v[j]+=10; v[j+1]-=1;} v[j]-=1; v[i]+=10; }
  }
  return {opens, zero, ok: v[n-1] - (B[n-1]||0) > 0 || n===1};
}
function gen(level){
  for(let t=0;t<5000;t++){
    let a,b;
    if(level==1){ a=rnd(30,98); b=rnd(11,a-10); }
    else if(level==4){ a=rnd(2,9)*100+rnd(0,9); b = Math.random()<.7 ? rnd(101,a-100) : rnd(12,99); if(Math.floor(a/10)%10!==0) continue; }
    else { a=rnd(200,987); b = Math.random()<.8 ? rnd(101,a-100) : rnd(12,99); }
    if(b>=a) continue;
    const p = pattern(a,b); if(!p.ok) continue;
    if(level==1 && !(p.opens.length==1 && String(a).length==2 && String(b).length==2)) continue;
    if(level==2 && !(p.opens.length==1 && !p.zero)) continue;
    if(level==3 && !(p.opens.length==2 && !p.zero)) continue;
    if(level==4 && !p.zero) continue;
    if(String(a).includes("0") && level<4) continue;
    return [a,b];
  }
  return [524,268];
}

/* ---------- état ---------- */
function start(a,b){
  const A = digits(a), B = digits(b);
  S = {a,b,n:A.length,B,p:0,phase:"decide",err:0,
       cols:A.map(v=>({orig:v,val:v,ev:[],crossed:0,recv:false,res:null,gone:0})),
       fresh:new Set(), log:""};
  $("check").textContent = "";
  if(mode==="demo"){ S.phase="intro"; }
  render(); prompt();
}
function borrow(i){ // le rang i reçoit 10 du rang i+1 ; renvoie le texte de l'explication
  const j=i+1, C=S.cols; let pre="";
  if(C[j].val===0){
    borrow(j);
    pre = `Il n'y a pas de ${SING[j]} à ouvrir : <b>j'ouvre d'abord 1 ${SING[j+1]}</b> pour avoir 10 ${PLUR[j]}. `;
  }
  C[j].val-=1; C[j].ev.push("dec"); C[j].crossed++;
  C[i].val+=10; C[i].ev.push("add10"); C[i].recv=true;
  S.fresh.add(i); S.fresh.add(j);
  return pre;
}
const bi = i => S.B[i];            // undefined si le chiffre manque

/* ---------- affichage ---------- */
function itemHTML(k, cls=""){ return `<span class="it ${cls}"><img src="${IMG[k]}" width="${WID[k]}" alt=""></span>`; }
function render(){
  const C=S.cols, n=S.n;
  // matériel : colonnes de gauche à droite (centaines … unités)
  const mat=$("mat"); mat.style.gridTemplateColumns=`repeat(${n},1fr)`;
  let h="";
  for(let i=n-1;i>=0;i--){
    const col=C[i]; let items="";
    const loose = col.orig;                 // objets de départ
    const xs = Math.min(col.crossed, loose);
    for(let t=0;t<loose;t++){
      const isX = t>=loose-xs;
      items += itemHTML(IMGK[i], (isX?"x ":"")+(isX&&S.fresh.has(i)?"new":""));
    }
    if(col.recv) items += itemHTML(OPENK[i], S.fresh.has(i)?"new":"");
    if(col.crossed>loose) items += `<div class="take">j'en prends 1 :</div>`+itemHTML(IMGK[i],"x new");
    if(col.res!==null && col.gone) items += `<div class="take">J'enlève ${col.gone} : il reste ${col.res}</div>`;
    h += `<div class="mcol ${i===S.p&&S.phase!=="done"?"active":""}">
            <div class="mitems">${items}</div>
            <div class="mlab" style="color:var(--${LET[i]})">${PLUR[i]}</div></div>`;
  }
  mat.innerHTML=h;
  // opération posée
  const op=$("op"); op.style.gridTemplateColumns=`repeat(${n+1},76px)`;
  let o=`<div class="cell hd"></div>`;
  for(let i=n-1;i>=0;i--) o+=`<div class="cell hd" style="color:var(--${LET[i]})">${LET[i]}</div>`;
  o+=`<div class="cell top"></div>`;
  for(let i=n-1;i>=0;i--) o+=`<div class="cell top ${i===S.p&&S.phase!=="done"?"colhl":""}">${layersHTML(i)}</div>`;
  o+=`<div class="cell">−</div>`;
  for(let i=n-1;i>=0;i--) o+=`<div class="cell ${i===S.p&&S.phase!=="done"?"colhl":""}">${bi(i)===undefined?"":bi(i)}</div>`;
  o+=`<div class="rule"></div><div class="cell"></div>`;
  for(let i=n-1;i>=0;i--) o+=`<div class="cell res">${C[i].res===null||(i===n-1&&n>1&&C[i].res===0)?"":C[i].res}</div>`;
  op.innerHTML=o;
  S.fresh.clear();
}
function layersHTML(i){
  const col=S.cols[i]; const L=[[col.orig,false,false]];
  col.ev.forEach(e=>{ const t=L[L.length-1]; if(e==="add10"){t[0]+=10;t[1]=true;} else {t[2]=true; L.push([t[0]-1,false,false]);} });
  return L.map(([v,pre,x],li)=>{
    const bottom = 2 + li*44;
    const txt = (pre?`<span class="pre ${li?"":"hot"}">1</span>`:"") + (pre? v%10 : v);
    return `<div class="lay ${li?"s hot":""} ${pre?"wide":""}" style="bottom:${bottom}px">${txt}${x?'<span class="strike hot"></span>':""}</div>`;
  }).join("");
}
function say(html){ $("msg").innerHTML = html; }
function acts(html){ $("acts").innerHTML = html; }

/* ---------- déroulé ---------- */
function prompt(){
  const C=S.cols, i=S.p;
  if(S.phase==="done") return finish();
  const v=C[i].val, b=bi(i), A=S.a;
  if(mode==="demo"){
    if(S.phase==="intro"){
      say(`On calcule <b>${S.a} − ${S.b}</b>.<br>Il faut commencer par les <b>unités</b>.`);
      return acts(`<button class="btn main" id="nx">Suivant ▶</button>`), $("nx").onclick=()=>{S.phase="decide";render();prompt();};
    }
    let t;
    if(b===undefined){
      t = `Il n'y a rien à enlever aux ${PLUR[i]} : il reste <span class="r">${v}</span>. J'écris ${v} comme chiffre des ${PLUR[i]} au résultat.`;
      return step(t, ()=>{C[i].res=v; next();});
    }
    if(v>=b){
      t = `${i?"On continue par les "+PLUR[i]+". ":""}Dans ${A}, il y a ${C[i].recv||C[i].crossed?"maintenant ":""}<b>${v} ${v>1?PLUR[i]:SING[i]}</b>. Je dois enlever ${b} ${b>1?PLUR[i]:SING[i]}.<br>On peut enlever ${b} à ${v} : <span class="r">${v} − ${b} = ${v-b}</span>. J'écris ${v-b} comme chiffre des ${PLUR[i]} au résultat.`;
      return step(t, ()=>{C[i].res=v-b; C[i].gone=b; next();});
    }
    t = `${i?"On continue par les "+PLUR[i]+". ":"Il faut commencer par les unités. "}Dans ${A}, il y a <b>${v} ${v>1?PLUR[i]:SING[i]}</b>. Enlever ${b} à ${v}, <b>ce n'est pas possible tout de suite</b>.<br>Dans ${A}, il faut <b>ouvrir 1 ${SING[i+1]}</b> pour avoir 10 ${PLUR[i]}.`;
    return step(t, ()=>{
      const pre=borrow(i); render();
      say(`${pre}Dans ${A}, il y a maintenant <b>${C[i+1].val} ${C[i+1].val>1?PLUR[i+1]:SING[i+1]}</b> et <b>${C[i].val} ${PLUR[i]}</b>.<br>On peut enlever ${b} à ${C[i].val} : <span class="r">${C[i].val} − ${b} = ${C[i].val-b}</span>.`);
      acts(`<button class="btn main" id="nx">Suivant ▶</button>`);
      $("nx").onclick=()=>{C[i].res=C[i].val-b; C[i].gone=b; next();};
    });
  }
  // ---- entraînement
  if(b===undefined){
    say(`Il n'y a rien à enlever aux <b>${PLUR[i]}</b>. Combien de ${PLUR[i]} reste-t-il ?`);
    return askNumber(v, v, `Il reste `);
  }
  if(S.phase==="decide"){
    say(`Dans ${A}, il y a ${C[i].recv?"maintenant ":""}<b>${v} ${v>1?PLUR[i]:SING[i]}</b>. Je dois enlever <b>${b}</b>.<br>Que fais-tu ?`);
    let h=`<button class="btn ${LET[i]}" id="bTake">J'enlève ${b} tout de suite</button>`;
    if(i+1<S.n) h+=`<button class="btn ${LET[i+1]}" id="bOpen">J'ouvre 1 ${SING[i+1]}</button>`;
    acts(h);
    $("bTake").onclick=()=>{
      if(v>=b){ S.phase="answer"; prompt(); }
      else { S.err++; bad(`Enlever ${b} à ${v}, <b>ce n'est pas possible tout de suite</b> ! Il faut ouvrir une boîte.`); }
    };
    if($("bOpen")) $("bOpen").onclick=()=>{
      if(v>=b){ S.err++; return bad(`Pas besoin d'ouvrir : on peut enlever ${b} à ${v} tout de suite.`); }
      if(C[i+1].val===0){
        say(`Il n'y a pas de ${SING[i+1]} à ouvrir : il y a <b>0 ${SING[i+1]}</b> ! Que faire ?`);
        acts(`<button class="btn ${LET[i+2]}" id="bOpen2">J'ouvre d'abord 1 ${SING[i+2]}</button>`);
        $("bOpen2").onclick=()=>{ borrow(i); render(); afterOpen(); };
        return;
      }
      borrow(i); render(); afterOpen();
    };
    return;
  }
  if(S.phase==="answer"){
    say(`On peut enlever ${b} à ${v}. Combien reste-t-il ?`);
    askNumber(v-b, v, `${v} − ${b} = `);
  }
}
function afterOpen(){
  const C=S.cols, i=S.p;
  say(`Bien ! Dans ${S.a}, il y a maintenant <b>${C[i+1].val} ${C[i+1].val>1?PLUR[i+1]:SING[i+1]}</b> et <b>${C[i].val} ${PLUR[i]}</b>.`);
  acts(`<button class="btn main" id="nx">Suivant ▶</button>`);
  $("nx").onclick=()=>{S.phase="answer"; prompt();};
}
function askNumber(good, v, label){
  acts(`<div class="ask">${label}<span class="box" id="box">?</span></div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-d="${d}">${d}</button>`).join("")}</div>`);
  document.querySelectorAll(".pad button").forEach(btn=>btn.onclick=()=>{
    const d=+btn.dataset.d;
    if(d===good){
      $("box").textContent=d; const i=S.p; S.cols[i].res=d; S.cols[i].gone = bi(i)||0;
      setTimeout(next, 450);
    } else {
      S.err++; $("box").textContent=d; $("box").parentElement.classList.add("shake");
      setTimeout(()=>{ $("box").textContent="?"; $("box").parentElement.classList.remove("shake"); }, 500);
      $("msg").insertAdjacentHTML("beforeend", `<br><span class="bad">Pas tout à fait. Recompte : ${label.replace(" = ","")}.</span>`);
    }
  });
}
function bad(t){ say(`<span class="bad">${t}</span>`); setTimeout(prompt, 1900); acts(""); }
function step(t, fn){
  say(t); acts(`<button class="btn main" id="nx">Suivant ▶</button>`);
  $("nx").onclick=fn;
}
function next(){
  S.p++; S.phase = S.p>=S.n ? "done" : "decide"; render(); prompt();
}
function finish(){
  const r=S.a-S.b;
  say(`<b>${S.a} − ${S.b} = <span class="r">${r}</span></b>${mode==="train"?(S.err?`<br>Terminé avec ${S.err} erreur${S.err>1?"s":""}.`:"<br>Bravo, sans erreur ! ⭐"):""}`);
  if(mode==="train"){ stars.push(S.err?"✔️":"⭐"); stars=stars.slice(-10); $("stars").textContent=stars.join(""); }
  acts(`<button class="btn" id="ver">Je vérifie avec une addition</button>
        <button class="btn main" id="new">Nouvelle soustraction ▶</button>`);
  $("ver").onclick=()=>{ $("check").innerHTML=`${r} + ${S.b} = <b style="color:var(--red)">${S.a}</b> ✔ c'est juste !`; };
  $("new").onclick=()=>start(...gen(+$("level").value));
}

/* ---------- commandes ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  mode=t.dataset.mode; $("own").classList.toggle("hide", mode!=="demo"); $("score").classList.toggle("hide", mode!=="train");
  start(...gen(+$("level").value));
});
$("level").onchange=()=>start(...gen(+$("level").value));
$("ownGo").onclick=()=>{
  const a=parseInt($("ownA").value,10), b=parseInt($("ownB").value,10);
  if(!(a>0&&b>0&&b<a&&a<1000)){ say(`<span class="bad">Écris deux nombres : le premier plus grand que le second, plus petit que 1 000.</span>`); return; }
  start(a,b);
};
start(352,127);
</script>
